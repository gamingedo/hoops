<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocMan2021 Hoops</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoops">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>window.HOOPS_APP=true;window.HOOPS_VER="be951326e6";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: same arena system as Hoops Lab. Hardwood page, scoreboard panels, sticky tab rail, fixed sim bar at the thumb. */
:root{
  --floor:#070b16; --floor-2:#0b1224; --floor-line:#ffffff06;
  --ink:#111c38; --ink-2:#18264a; --ink-3:#22335f; --ink-line:#34497e;
  --led:#ffd166; --led-dim:#a8803a; --leather:#ff8a3d; --leather-hi:#ffa45f;
  --paper:#f6f2ea; --muted:#c6cee2; --good:#6cb8ff; --bad:#ffa24c;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.5;color:var(--paper);background:var(--floor);
  background-image:radial-gradient(1100px 620px at 85% -8%,#22386f 0,transparent 62%),radial-gradient(900px 520px at -5% 105%,#5a2c1866 0,transparent 60%),repeating-linear-gradient(115deg,transparent 0 90px,#ffffff05 90px 92px);background-attachment:fixed;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--floor)}
button,select,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}

/* header */
.hdr{background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;box-shadow:0 14px 30px -18px #000a}
.hdr .who{display:flex;gap:12px;align-items:center;min-width:0}
.sw{width:14px;height:44px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px #fff3}
.hdr h1{margin:0;font:900 clamp(26px,5.4vw,40px)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font:600 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rec{font:900 44px/.9 var(--f-display);color:var(--led);font-variant-numeric:tabular-nums;text-align:right;text-shadow:0 0 16px #ffb42e44}
.owner{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.owner .bar{height:8px;border-radius:4px;background:var(--ink-2);overflow:hidden}
.owner .bar i{display:block;height:100%;border-radius:4px}
.owner b{font:900 18px var(--f-display);font-variant-numeric:tabular-nums}
.lab-link{color:var(--paper);font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.lab-link:hover{text-decoration:underline}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font:900 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.brand span{color:var(--leather)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px;background:var(--ink);border-radius:999px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:transparent;color:var(--muted);font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--led);color:var(--ink)}

/* panels */
.panel{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px;box-shadow:0 2px 0 #0003,0 14px 30px -18px #000a;min-width:0}
.panel h2{margin:0 0 10px;font:900 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.panel h3{margin:0 0 8px;font:900 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;color:var(--paper)}
.label{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stack{display:grid;gap:14px}
p{margin:0}
.note{font-size:14px;color:var(--muted);margin-top:8px}

/* buttons */
.btn{font:900 17px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--leather);color:#fff;box-shadow:inset 0 -3px 0 #0003}
.btn:hover:not(:disabled){background:var(--leather-hi)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--ink-3);color:var(--paper)}
.btn.ghost:hover:not(:disabled){background:var(--ink-line)}
.btn.sm{font-size:14px;padding:7px 11px;border-radius:8px}
.btn.xs{font-size:12px;padding:5px 8px;border-radius:6px;letter-spacing:.06em}
.row-btns{display:flex;gap:4px;justify-content:flex-end}
.icon{background:var(--ink-3);color:var(--paper);border:0;border-radius:6px;width:30px;height:30px;cursor:pointer;font:700 14px var(--f-body)}
.icon:hover:not(:disabled){background:var(--ink-line)}
.icon:disabled{opacity:.3}
.linkish{background:none;border:0;padding:0;color:var(--paper);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.linkish:hover{color:var(--led);text-decoration:underline}

/* tables */
.tw{overflow-x:auto;border-radius:8px;border:1px solid var(--ink-line)}
table{border-collapse:collapse;width:100%;font:400 14px var(--f-mono);font-variant-numeric:tabular-nums}
th{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 7px;background:var(--ink-2);white-space:nowrap}
td{padding:8px 7px;text-align:right;border-top:1px solid var(--ink-2);white-space:nowrap}
th.l,td.l{text-align:left}
td.name{font-family:var(--f-body);font-size:14px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
tr.me td{background:#ffb42e14}
tr.cut td{border-top:2px solid var(--led-dim)}
td.hi{color:var(--led);font-weight:600}
.role{font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--ink-3);color:var(--paper);vertical-align:middle;margin-left:4px}
.chip.gold{background:var(--led);color:var(--ink)}
.chip.red{background:#4a2a10;color:#ffc58f}
.chip.lab{background:var(--leather);color:#fff}
.chip.green{background:#163a5e;color:#a9d6ff}
.ovr{font:900 18px var(--f-display);color:var(--led)}
.tsw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;box-shadow:inset 0 0 0 1px #fff4}

/* cards */
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv div{background:var(--ink-2);border-radius:8px;padding:8px 10px;min-width:0}
.kv b{display:block;font:900 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv span{font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink-2);border-radius:10px;padding:12px 14px}
.score .t{font:900 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.score .s{font:900 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score .s.w{color:var(--led)}
.strip{display:flex;gap:4px;flex-wrap:wrap}
.strip span{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;font:900 14px var(--f-display)}
.strip .W{background:#163a5e;color:#a9d6ff}.strip .L{background:#4a2a10;color:#ffc58f}
.news{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.news li{font-size:14px;padding:8px 10px;background:var(--ink-2);border-radius:8px}
.news li small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.perf{display:grid;gap:4px;margin-top:10px}
.perf div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.perf div span:last-child{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* team picker */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tcard{background:var(--ink-2);border:1px solid var(--ink-line);border-radius:10px;padding:10px 12px;color:var(--paper);text-align:left;cursor:pointer;display:grid;gap:4px;border-left-width:6px}
.tcard:hover{border-color:var(--led)}
.tcard b{font:900 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.tcard .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* bracket */
.bracket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.round{display:grid;gap:6px;align-content:start}
.series{background:var(--ink-2);border-radius:8px;padding:6px 8px;font:500 12px var(--f-mono);display:grid;gap:2px}
.series.me{box-shadow:0 0 0 1px var(--led) inset}
.series div{display:flex;justify-content:space-between;gap:6px}
.series .won{color:var(--led);font-weight:600}

/* trade */
.tcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{display:grid;gap:4px}
.pick label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--ink-2);border-radius:8px;padding:7px 9px;cursor:pointer;border:1px solid transparent}
.pick label:has(input:checked){border-color:var(--led);background:#ffb42e14}
.pick input{accent-color:var(--led);width:18px;height:18px}
.pick .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.pick .n small{display:block;color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.meter{height:12px;border-radius:6px;background:var(--ink-2);overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--led) 70%,var(--good))}
.meter::after{content:"";position:absolute;left:66.6%;top:0;bottom:0;width:2px;background:var(--paper);opacity:.6}
select{background:var(--ink-2);color:var(--paper);border:1px solid var(--ink-line);border-radius:8px;padding:8px 10px;max-width:100%}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);border-top:1px solid var(--ink-line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:1040px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .btn{flex:1;padding:13px 10px;font-size:16px}
.bar .status{color:var(--muted);font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;flex:1}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:#0b1020cc;display:grid;place-items:end center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--ink);color:var(--paper);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:760px){.modal{place-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h2{margin:0;font:900 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.x{background:var(--ink-3);border:0;color:var(--paper);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.attrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.attr{background:var(--ink-2);border-radius:8px;padding:8px;text-align:center}
.attr b{display:block;font:900 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.attr span{font:600 10px var(--f-body);letter-spacing:.12em;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{background:#4a2a1055;border:1px solid #8a5a2a;border-radius:10px;padding:12px;display:grid;gap:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--paper);color:var(--ink);font-weight:600;padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px -10px #000a;max-width:min(92vw,520px);text-align:center}
textarea{width:100%;min-height:120px;background:var(--ink-2);color:var(--paper);border:1px solid var(--ink-line);border-radius:8px;padding:10px;font:12px var(--f-mono)}
pre.schema{background:var(--ink-2);border-radius:8px;padding:12px;overflow-x:auto;font:12px/1.5 var(--f-mono);margin:0;color:var(--paper)}
input[type=file]{color:var(--paper);max-width:100%}



/* legacy */
.banners{display:flex;flex-wrap:wrap;gap:10px}
.banner{width:86px;padding:12px 6px 16px;text-align:center;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#000));color:#fff;clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%);display:grid;gap:2px;box-shadow:inset 0 0 0 2px #ffffff40}
.banner b{font:900 26px/1 var(--f-display)}.banner span,.banner small{font:700 9px var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.banner.old{filter:saturate(.6) brightness(.85)}
.jersey{width:96px;padding:10px 6px;text-align:center;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 50%,#000));color:#fff;display:grid;gap:2px;box-shadow:inset 0 0 0 2px #ffffff40}
.jersey b{font:900 40px/1 var(--f-display)}.jersey span{font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.04em}
.recap-hero{background:linear-gradient(120deg,var(--ink-3),var(--ink-2));border-radius:12px;padding:14px;display:grid;gap:4px;border:1px solid var(--led-dim)}
.recap-hero b{font:900 30px/1 var(--f-display);text-transform:uppercase;color:var(--led)}.recap-hero em{color:var(--muted);font-size:13px}
.recap-you{background:#ffb42e14;border:1px solid var(--led-dim);border-radius:10px;padding:10px 12px;font-weight:600}
.goat .tier{display:grid;grid-template-columns:54px minmax(0,1fr);border-top:1px solid var(--ink-line)}
.goat .tnum{font:900 40px var(--f-display);color:var(--muted);display:grid;place-items:center;background:var(--ink-2)}
.goat .tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px}
.gcard{position:relative;background:linear-gradient(150deg,#1d3a63,#0f1d36);border:1px solid #ffffff22;border-radius:10px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;min-width:0}
.gcard.legend{background:linear-gradient(150deg,#3b3f55,#1b1e2e)}
.gcard.mine{box-shadow:0 0 0 2px var(--led)}
.gmono{width:46px;height:46px;border-radius:50%;background:#ffffff1a;border:2px solid #ffffff44;display:grid;place-items:center;line-height:1}
.gmono span{font:900 17px var(--f-display)}.gmono small{font:700 9px var(--f-body);opacity:.8}
.grank{font:700 9px var(--f-body);letter-spacing:.12em;color:#ffffffaa;text-align:right}.grank b{display:block;font:900 26px/1 var(--f-display);color:#fff}
.gname{grid-column:1/-1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gname .linkish{font-weight:700}
.gmeta{grid-column:1/-1;font:500 11px var(--f-mono);color:#ffffffaa}
.gchase{background:var(--ink-2);border:1px solid var(--led-dim);border-radius:10px;padding:10px 12px;min-width:220px}
.gchase b{color:var(--led)}.gchase small{color:var(--muted);font-size:11px}
.gchase .meter::after{display:none}


/* ===== menu + MyCareer ===== */
.menu-btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink-line);border-radius:999px;padding:9px 16px;font:700 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.menu-btn:hover{border-color:var(--led)}
.nav-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.nav-btns .eras-x{margin-left:0}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.menu-card{position:relative;overflow:hidden;text-align:left;cursor:pointer;color:#f4f1ea;border:1px solid #ffffff2e;border-radius:16px;padding:22px;min-height:220px;display:grid;align-content:end;gap:6px;
  background:linear-gradient(130deg,color-mix(in srgb,var(--e3) 90%,#000),color-mix(in srgb,var(--e1) 40%,#000));box-shadow:0 20px 40px -24px #000}
.menu-card:hover,.menu-card:focus-visible{border-color:var(--e2)}
.menu-card .ty{position:absolute;right:12px;top:-14px;font:900 120px/1 var(--f-display);color:#ffffff10}
.menu-card small{font:700 12px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--e2)}
.menu-card b{font:900 34px/1 var(--f-display);text-transform:uppercase;position:relative}
.menu-card p{margin:0;color:#dfe4f0;font-size:15px;position:relative;max-width:42ch}
.mc-in{background:#ffffff14;color:#f4f1ea;border:1px solid #ffffff2a;border-radius:8px;padding:10px 12px;font:700 20px var(--f-display);letter-spacing:.04em;text-transform:uppercase;width:100%;max-width:420px}
.mc-row{display:flex;gap:12px;flex-wrap:wrap}.mc-row>div{display:grid;gap:6px}
.mc-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mc-slot{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:8px 10px;border-radius:8px;background:#ffffff0d;border:1px dashed #ffffff2a}
.mc-slot.on{border-style:solid;border-color:#ffffff40;background:#ffffff16}
.mc-slot span{min-width:0;overflow:hidden;text-overflow:ellipsis;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:#c9cfe0}.mc-slot b{grid-row:span 2;font:900 26px var(--f-display);color:var(--e2)}
.mc-slot small{font-size:12px;color:#dfe4f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mc-b{display:grid;gap:2px;justify-items:center;padding:10px 4px;border-radius:8px;border:1px solid var(--e2);background:#ffffff10;color:#f4f1ea;cursor:pointer}
.mc-b span{font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase}.mc-b b{font:900 28px/1 var(--f-display)}
.mc-b.off{opacity:.35;border-color:#ffffff22;cursor:default}
.mc-offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mc-offer{background:#ffffff10;border:1px solid #ffffff2a;border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.mc-offer b{font:900 24px var(--f-display);text-transform:uppercase;display:block}.mc-offer small{color:#c9cfe0}.mc-offer p{font-size:14px;margin:0}
.mc-offer .start{font-size:15px;padding:10px 14px}
#mc .news li,#mc .news li b{background:#ffffff10;color:#f4f1ea}
@media (max-width:760px){.mc-pick{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* ===== broadcast look (matches the main menu) ===== */
.tabs{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));overflow:visible;border-radius:16px;gap:6px;padding:8px}
.tabs button{padding:9px 4px;font-size:12px;letter-spacing:.04em;white-space:nowrap}

.cl-bar{position:fixed;left:0;right:0;z-index:25;background:#0a1226f2;backdrop-filter:blur(6px);padding:10px max(12px,env(safe-area-inset-left,0px))}
.cl-bar .in{max-width:1040px;margin:0 auto;display:flex;gap:8px;align-items:center}.cl-bar .btn{flex:1;padding:13px 10px;font-size:16px}
.cl-nav{z-index:48}.cl-top{margin:0 -4px}#mc .cl-body{padding-bottom:calc(160px + env(safe-area-inset-bottom,0px))}
.cl-hero h2 .rk{color:var(--led)}.cl-rec{font:700 16px var(--f-body);margin:4px 0 8px}
.tch{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;text-align:left}
.tch i{font:900 11px var(--f-display);font-style:normal;letter-spacing:.04em;padding:2px 5px;border-radius:4px;background:var(--tc);color:#fff;text-shadow:0 1px 2px #000a;min-width:34px;text-align:center}
.tch small{font:800 11px var(--f-mono);color:var(--led)}.tch span{text-decoration:underline;text-decoration-color:#ffffff33;text-underline-offset:3px}
.mv{font:800 12px var(--f-mono)}.mv.up{color:var(--good)}.mv.dn{color:var(--bad)}.mv.eq{color:#8b94ad}.mv.nw{color:var(--led)}
.wl-w{color:var(--good)}.wl-l{color:var(--bad)}
tr.me td{background:#ffd16614}
.chip.pro{background:#6cb8ff22;color:#9fd3ff;border-color:#6cb8ff66}
.mini-ap{margin:4px 0 0;padding-left:20px;display:grid;gap:5px}.mini-ap li{display:flex;justify-content:space-between;gap:8px}
.rec-card{border:1px solid #ffffff1f;border-radius:12px;padding:12px;margin-bottom:10px;background:#ffffff08;display:grid;gap:8px}
.rec-card.won{border-color:#6cb8ff88;background:#6cb8ff12}.rec-card.lost{opacity:.65}
.rec-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.rec-h b{font:900 18px var(--f-display);text-transform:uppercase}.rec-h small{display:block;color:#c9cfe0}
.ibars{display:grid;gap:4px}.ib{display:grid;grid-template-columns:110px 1fr 34px;gap:8px;align-items:center;font-size:13px}.ib span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ib i{height:8px;border-radius:4px;background:#8b94ad;display:block}.ib.me i{background:var(--good)}.ib.me span{color:var(--good);font-weight:700}.ib b{font:700 12px var(--f-mono);text-align:right}
.lead-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.lead{margin:0;padding-left:22px;display:grid;gap:4px}.lead li{display:flex;justify-content:space-between;gap:8px}.lead li.me{color:var(--led)}.lead small{color:#8b94ad}
.bgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));margin:6px 0 12px}
.bm{border:1px solid #ffffff1f;border-radius:8px;overflow:hidden;font-size:13px}.bm.me{border-color:var(--led)}
.bm div{display:flex;justify-content:space-between;gap:8px;padding:5px 8px;color:#a9b1c7}.bm div+div{border-top:1px solid #ffffff14}.bm div.w{color:#f4f1ea;font-weight:700}
.news li.nk-mine{border-left:3px solid var(--led)}.news li.nk-upset{border-left:3px solid var(--bad)}
.sheet>*{min-width:0;max-width:100%}
.sel{display:grid;grid-template-columns:repeat(2,1fr);gap:4px;text-align:left;font-size:13px}.sel div{padding:4px 8px;border-radius:6px;background:#ffffff08}.sel div.me{background:#ffd16633;color:var(--led);font-weight:800}.sel b{display:inline-block;width:22px;color:#a9b1c7}
th.srt{cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}th.srt::after{content:" ⇅";opacity:.3;font-size:.85em}
th.srt[data-sort="asc"]::after{content:" ▲";opacity:1;color:var(--led)}th.srt[data-sort="desc"]::after{content:" ▼";opacity:1;color:var(--led)}
/* ===== rivals, goals, ceremonies ===== */
.riv{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center;margin-bottom:8px}.riv b{display:block;font:900 18px var(--f-display);text-transform:uppercase}.riv small{color:#a9b1c7}.riv>span{font:900 20px var(--f-display);color:var(--led)}
.rivt td{text-align:center}.dash-riv{font:600 13px var(--f-body);color:#c9cfe0}.dash-riv b{color:var(--paper)}
.goals{display:grid;gap:6px}.goal{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:#ffffff06;border:1px solid #ffffff12;opacity:.6}.goal.on{opacity:1;border-color:#ffd16655;background:#ffd16610}
.goal b{font-size:20px}.goal strong{display:block;font:800 14px var(--f-body)}.goal small{color:#a9b1c7;font-size:12px}
.cere{display:grid;gap:8px;text-align:center}.cere canvas,.troom{width:100%;image-rendering:pixelated;border:3px solid #000;border-radius:6px;background:#0b1020}.cere h2{margin:6px 0 0;font:900 28px/1 var(--f-display);text-transform:uppercase}
.cere-k{font:800 13px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--led);margin:0}.cere blockquote{margin:0;padding:10px 14px;border-left:3px solid var(--led);background:#ffffff0a;text-align:left;font-style:italic}
.chal-g{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}.chal-b{display:grid;gap:4px;text-align:left;padding:12px 14px;border-radius:12px;border:1px solid #ffffff26;background:#ffffff0c;color:#f4f1ea;cursor:pointer}
.chal-b b{font:900 18px var(--f-display);text-transform:uppercase}.chal-b small{color:#c9cfe0;font-size:13px}.chal-card b{font:900 20px var(--f-display);text-transform:uppercase}
/* ===== game day ===== */
.coach{display:grid;gap:8px}.lineup{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.lu{display:grid;grid-template-columns:minmax(0,1fr);text-align:left;gap:2px;padding:8px 10px;border-radius:10px;border:1px solid #ffffff1f;background:#ffffff0a;color:var(--paper);cursor:pointer}.lu small{color:#a9b1c7;font-size:11px}.lu.sel{border-color:var(--led);background:#ffd16622}.lu.bn{border-style:dashed}.lu:disabled{opacity:.45}

@keyframes blink{50%{opacity:.4}}
.lv-clutch{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:6px;background:#05081299;cursor:pointer;text-align:center;padding:10px}
.cl-h{font:700 22px Silkscreen,var(--f-display);color:var(--led);letter-spacing:.08em}.cl-n{font:700 14px var(--f-body);color:#fff}.cl-tap{font:700 13px Silkscreen,var(--f-mono);color:#fff;animation:blink 1s steps(2) infinite}
.cl-bar2{position:relative;width:min(300px,70vw);height:22px;background:#1a2036;border:2px solid #000;box-shadow:0 0 0 2px #ffffff33}.cl-bar2 .zone{position:absolute;top:0;bottom:0;background:var(--led)}.cl-bar2 .ndl{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:#fff;box-shadow:0 0 0 1px #000}
.lv-court[data-era]::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0}
.lv-court.era70 canvas{filter:sepia(.5) saturate(.8) contrast(1.08) brightness(.96)}.lv-court.era70::after{opacity:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.22) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55))}
.lv-court.era80 canvas{filter:saturate(1.3) contrast(1.06) blur(.3px) drop-shadow(1.5px 0 0 rgba(255,60,60,.28)) drop-shadow(-1.5px 0 0 rgba(60,200,255,.28))}.lv-court.era80::after{opacity:1;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 65%,rgba(0,0,0,.35))}
.lv-court.era90 canvas{filter:saturate(1.15) contrast(1.03)}.lv-court.era90::after{opacity:.6;background:repeating-linear-gradient(0deg,rgba(0,0,0,.14) 0 1px,transparent 1px 3px)}
.lv-court.era00::after{opacity:.3;background:repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 4px)}
.lv-court.era70 .lv-sb{filter:sepia(.6)}
/* ===== immersion ===== */
.chip.trait{background:#ffffff12;color:#dfe5f2;border-color:#ffffff26;margin-left:4px}.chip.t-leader{color:#9fd3ff;border-color:#6cb8ff66}.chip.t-hot,.chip.t-diva{color:#ffbf86;border-color:#ff8a3d66}.chip.t-gym{color:#ffe08a}
.why{display:grid;gap:4px;background:#ffffff08;border:1px solid #ffffff14;border-radius:10px;padding:10px}.why span{font-size:14px}.w-up{color:var(--good)}.w-dn{color:var(--bad)}.w-eq{color:#c9cfe0}.why small{color:#a9b1c7}
.inbox{display:flex;gap:8px;flex-wrap:wrap;align-items:stretch}
.inbox-b{flex:1 1 30%;min-width:96px;display:grid;justify-items:center;gap:2px;padding:10px 6px;border-radius:12px;border:1px solid #ffffff1f;background:#0d1630e6;color:var(--paper);cursor:pointer;font:600 11px var(--f-body);text-transform:uppercase;letter-spacing:.05em}
.inbox-b b{font:900 20px var(--f-display)}.inbox-b.hot{border-color:var(--led);background:linear-gradient(180deg,#ffd16622,#ff8a3d14);box-shadow:0 0 0 1px #ffd16633}.inbox-b.dim{opacity:.7}
.meters{flex:1 1 100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}.meters div,.tv-meters div{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:#a9b1c7}
.meters i,.tv-meters i{display:block;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--good) var(--v),#ffffff18 var(--v))}
.phone{display:grid;gap:12px}.phone-top{display:flex;justify-content:space-between;align-items:center}.phone-top b{font:900 26px var(--f-display);text-transform:uppercase}
.msg{display:grid;gap:6px;padding-bottom:10px;border-bottom:1px solid #ffffff12}.msg-from{display:flex;gap:8px;align-items:center}.msg-from i{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#0b1020;font:900 13px var(--f-body);font-style:normal}
.msg-from small{margin-left:auto;color:#8b94ad;font-size:11px}
.bub{max-width:86%;background:#24304f;border-radius:16px 16px 16px 4px;padding:9px 12px;font-size:15px;line-height:1.35}.bub.me{justify-self:end;background:#2f6fd6;border-radius:16px 16px 4px 16px;color:#fff}
.msg-ch{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.press{display:grid;gap:10px}.press-top{display:flex;gap:10px;align-items:center;font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;color:#c9cfe0}.live{color:#fff;background:#d23b2a;padding:2px 7px;border-radius:4px}
.pq{font:700 15px var(--f-body);color:#c9cfe0}.pq.now{font:900 22px/1.15 var(--f-display);color:var(--paper);text-transform:uppercase}
.pa{background:#ffffff0a;border-left:3px solid var(--led);padding:8px 10px;border-radius:6px}.pa small{display:block;color:var(--good);margin-top:4px;font-size:12px}
.press-a{text-align:left;white-space:normal;line-height:1.3;padding:12px 14px;font-size:15px}
.tv{display:grid;gap:10px;position:relative}.tv::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#ffffff06 0 1px,transparent 1px 3px)}
.tv-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid var(--led);padding-bottom:6px}.tv-logo{font:900 30px/.9 var(--f-display);letter-spacing:.02em}.tv-logo b{color:var(--led)}
.tv-ep{font:700 12px var(--f-mono);color:#c9cfe0}.tv-seg{background:#ffffff08;border:1px solid #ffffff14;border-radius:10px;padding:10px 12px}
.tv-h{font:900 13px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--led);margin-bottom:6px}.tv-big{font:900 22px var(--f-display);text-transform:uppercase;margin:0 0 4px}
.tv-list{margin:0;padding-left:22px;display:grid;gap:5px}.tv-list li{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}.tv-list li span{margin-left:auto;font:600 13px var(--f-mono);color:#dfe5f2}.tv-list li.me b{color:var(--led)}.tv-list small{color:#8b94ad}
.tv-two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tv-two>div{display:grid;gap:2px}.tv-two small{color:#8b94ad;text-transform:uppercase;font-size:11px;letter-spacing:.08em}.tv-two b{font:900 18px var(--f-display);text-transform:uppercase}
.tv-meters{display:grid;gap:6px;margin-top:6px}
.tv-tick{overflow:hidden;white-space:nowrap;background:var(--led);color:#14100a;font:800 13px var(--f-body);border-radius:4px;padding:6px 0}.tv-tick div{display:inline-block;padding-left:100%;animation:tick 40s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
/* ===== one-hand shell ===== */
.dash{display:grid;gap:12px}.dash-next b{display:block;font:900 24px/1.05 var(--f-display);text-transform:uppercase;margin:4px 0 2px}.dash-next small{color:#c9cfe0}
.dash-kv{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.dash-kv div{background:#ffffff0a;border:1px solid #ffffff14;border-radius:10px;padding:8px 6px;text-align:center}
.dash-kv b{display:block;font:900 20px var(--f-display)}.dash-kv span{font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:#a9b1c7}
.dash-last{display:flex;gap:10px;align-items:center;width:100%;background:#ffffff0a;border:1px solid #ffffff14;border-radius:10px;padding:10px 12px;color:var(--paper);font:600 14px var(--f-body);cursor:pointer;text-align:left}
.dash-last span:first-child{font:900 18px var(--f-display)}.dash-last i{margin-left:auto;font-style:normal;color:var(--led);font-weight:700}
.owner{gap:8px}.owner b{font-size:15px}.hdr .owner .label{font-size:10px}
.topstick{position:sticky;top:env(safe-area-inset-top,0px);z-index:22;display:grid;gap:6px;margin-top:-6px;padding-top:6px;background:linear-gradient(180deg,var(--floor) 70%,#070b1600)}
.hdr{padding:10px 12px;gap:6px 12px}.hdr h1{font-size:clamp(20px,5.2vw,30px)}.hdr .rec{font-size:30px}
.hdr .owner{grid-column:1/-1}
.menu-btn.ico{padding:0;width:38px;height:38px;border-radius:10px;font-size:18px;flex:none;display:grid;place-items:center}
.segs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 6px}.segs::-webkit-scrollbar{display:none}
.segs button{flex:1 0 auto;border:1px solid #ffffff1c;border-radius:999px;padding:9px 14px;background:#0d1630e6;color:#c9cfe0;font:700 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.segs button[aria-current="true"]{background:linear-gradient(180deg,var(--led),var(--leather));color:#14100a;border-color:transparent}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:26;display:grid;grid-template-columns:repeat(5,1fr);background:#060a17f7;border-top:1px solid #ffffff1c;padding:2px max(6px,env(safe-area-inset-left,0px)) calc(2px + env(safe-area-inset-bottom,0px));backdrop-filter:blur(8px)}
.bnav button{background:none;border:0;color:#8b94ad;display:grid;justify-items:center;gap:2px;padding:7px 0 6px;font:700 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;min-height:52px}
.bnav svg{width:24px;height:24px}.bnav button[aria-current="true"]{color:var(--led)}
#bar,.cl-bar{bottom:calc(56px + env(safe-area-inset-bottom,0px))!important;padding-bottom:10px!important;border-top:1px solid #ffffff14}
.hdr .rec{white-space:nowrap}
body{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.bar .btn.main{flex:3;display:grid;line-height:1.15;padding:10px 8px;font-size:16px}
.bar .btn small,.bar .btn.sq small{display:block;font:600 10px var(--f-body);letter-spacing:.06em;opacity:.75;text-transform:uppercase}
.bar .btn.sq{flex:0 0 64px;display:grid;justify-items:center;line-height:1.1;padding:8px 4px;font-size:18px}
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.more-grid button{display:grid;justify-items:center;gap:6px;padding:16px 8px;border-radius:12px;border:1px solid #ffffff1c;background:#ffffff0a;color:var(--paper);font:700 12px var(--f-body);text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.more-grid svg{width:26px;height:26px;color:var(--led)}
.sheet{position:relative;padding-top:26px;max-height:82vh}.sheet::before{content:"";position:absolute;left:50%;top:9px;width:44px;height:5px;margin-left:-22px;border-radius:3px;background:#ffffff40}
@media (min-width:900px){.bnav{left:50%;right:auto;transform:translateX(-50%);width:min(560px,100%);border-radius:16px 16px 0 0;border:1px solid #ffffff1c;border-bottom:0}}
/* landscape phone: full-height court */
@media (orientation:landscape) and (max-height:540px){
  .lv{max-width:none;grid-template-columns:auto minmax(220px,1fr);grid-auto-rows:min-content;column-gap:12px;padding-block:6px}
  .lv-court{grid-column:1;grid-row:1/span 7;align-self:start}.lv>*:not(.lv-court){grid-column:2}
  .lv-feed{max-height:52vh}
}
@media (min-width:860px) and (min-height:541px){
  .lv{max-width:none;grid-template-columns:auto minmax(300px,1fr);grid-auto-rows:min-content;column-gap:16px;padding-block:8px;align-items:start}
  .lv-top{grid-column:1/span 2;grid-row:1}
  .lv-court{grid-column:1;grid-row:2;align-self:start}.lv-me{grid-column:1;grid-row:3}.lv-ctl{grid-column:1;grid-row:4}
  .lv-tabs{grid-column:2;grid-row:2;align-self:start;z-index:1}#lv-coach,.lv-feed,#lv-box{grid-column:2;grid-row:2/span 3;margin-top:44px;max-height:calc(100vh - 170px);overflow:auto;align-self:start}
}
.lv-feed li.mine{border-color:#ffd16677;background:#ffd16614}

/* ===== Eras start screen: broadcast-style hero, light beams, era-colored carousel ===== */
.eras{position:fixed;inset:0;z-index:45;overflow-y:auto;color:#f4f1ea;background:#070b16;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));
  --e1:#e8772e;--e2:#ffc23d;--e3:#1d2a52}
.eras::before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(1200px 600px at 75% 20%,color-mix(in srgb,var(--e3) 70%,transparent),transparent 70%),
    radial-gradient(800px 500px at 10% 90%,color-mix(in srgb,var(--e1) 22%,transparent),transparent 70%),
    repeating-linear-gradient(115deg,transparent 0 90px,#ffffff06 90px 92px);transition:background .5s}
.eras-in{position:relative;max-width:1100px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.eras-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.eras-logo{display:grid;line-height:.85;font-family:var(--f-display);text-transform:uppercase}
.eras-logo small{font:900 13px var(--f-display);letter-spacing:.24em;color:var(--e2)}
.eras-logo b{font-weight:900;font-size:30px;letter-spacing:.03em}
.eras-logo i{font-style:normal;font-weight:900;font-size:16px;letter-spacing:.42em;background:#f4f1ea;color:#070b16;padding:2px 8px;margin-top:4px;justify-self:start}
.eras-top p{margin:0;flex:1;min-width:220px;font-weight:600;color:#c9cfe0;max-width:52ch}
.eras-x{margin-left:auto;background:#ffffff14;color:#f4f1ea;border:1px solid #ffffff2a;border-radius:999px;padding:8px 14px;font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.hero{position:relative;overflow:hidden;border-radius:18px;border:1px solid #ffffff2e;min-height:430px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);
  background:linear-gradient(120deg,color-mix(in srgb,var(--e3) 85%,#000) 0%,color-mix(in srgb,var(--e3) 55%,#000) 55%,color-mix(in srgb,var(--e1) 30%,#000) 100%);box-shadow:0 30px 60px -30px #000}
.hero::before{content:"";position:absolute;inset:-20% -10%;background:
  linear-gradient(115deg,transparent 46%,color-mix(in srgb,var(--e2) 30%,transparent) 47%,transparent 49%),
  linear-gradient(115deg,transparent 56%,#ffffff18 57%,transparent 62%),
  linear-gradient(115deg,transparent 64%,color-mix(in srgb,var(--e1) 35%,transparent) 65%,transparent 66.5%);pointer-events:none}
.hero .year{position:absolute;right:-2%;bottom:-8%;font:900 clamp(140px,26vw,300px)/.8 var(--f-display);color:#ffffff0c;letter-spacing:-.02em;pointer-events:none;user-select:none}
.hero-txt{position:relative;padding:28px 26px;display:grid;gap:14px;align-content:start}
.hero-txt .kicker{font:700 12px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--e2)}
.hero-txt h2{margin:0;font:900 clamp(40px,6.4vw,72px)/.9 var(--f-display);text-transform:uppercase;letter-spacing:.01em;
  background:linear-gradient(180deg,var(--e2),var(--e1));-webkit-background-clip:text;background-clip:text;color:transparent;text-wrap:balance}

function legacyOf(p){

  const o={rings:rg.length,ringsW:rg.reduce((s,a)=>s+(a.k===0?.3:1),0),mvp:aw("MVP"),fm:aw("Finals MVP"),a1:aw("All-NBA 1st"),as:aw("All-Star"),
    pts:p.career.reduce((a,s)=>a+s.pts,0),reb:p.career.reduce((a,s)=>a+s.reb,0),ast:p.career.reduce((a,s)=>a+s.ast,0),peak:Math.max(p.peak||0,p.ovr)};

/* ---------- sortable tables: tap a header for ascending, again for descending, again to reset ---------- */

const YRS={fr:1,so:2,jr:3,sr:4};
function cellVal(td){const s=(td?.textContent||"").trim();if(!s||s==="--"||s==="—")return null;

  m=s.match(/^(\d+)-(\d+)(\s|$)/);if(m&&!/^\d{4}-\d{2}$/.test(s)){const w=+m[1],l=+m[2];return w+l?w/(w+l)+w*1e-6:0}

  return s.toLowerCase()}

  const pin=rows.filter(r=>r.dataset.pin),rest=rows.filter(r=>!r.dataset.pin);

    const r=typeof x==="number"&&typeof y==="number"?x-y:String(x).localeCompare(String(y));return r*d||a.dataset.oi-b.dataset.oi})}
  [...rest,...pin].forEach(r=>tb.appendChild(r));
  t.querySelectorAll("thead th").forEach((th,i)=>{th.classList.add("srt");th.dataset.sort=st&&st.dir&&st.col===i?st.dir:""});t.dataset.sorted="1"}

function autoFill(){const u=user();const fas=()=>Object.values(G.players).filter(p=>p.tid===-1&&p.pid!==G.career?.pid).sort((a,b)=>value(b)-value(a));
  while(u.roster.length<13){let p=fas()[0];if(!p)p=genPlayer(ri(50,58),ri(22,30),pick(POS),-1);p.tid=u.tid;setContract(p,MINSAL,1);u.roster.push(p.pid)}

async function autoAdvance(stop,onTick){
  let n=0;const tick=async()=>{if(++n%6===0){onTick&&onTick();await new Promise(r=>setTimeout(r,0))}};
  for(let guard=0;guard<6000&&!stop();guard++){
    switch(G.phase){
      case"preseason":case"fa":try{syncCareerTeam()}catch(e){}autoFill();startSeason();break;
      case"season":if(G.day%20===0)try{syncCareerTeam()}catch(e){}simDay();break;

      case"draft":revealLottery(true);G.draft.started=true;while(G.draft.i<nPicks())draftPick(G.draft.order[G.draft.i],aiChoice());finishDraft();break;

}

/* ---------- trades ---------- */
function tradeEval(){
  const tr=G.trade;if(tr.tid==null)return null;
  const give=tr.give.map(P),get=tr.get.map(P);
  const vg=give.reduce((a,p)=>a+value(p),0),vr=get.reduce((a,p)=>a+value(p),0);
  const so=give.reduce((a,p)=>a+(p.contract?.amt||0),0),si=get.reduce((a,p)=>a+(p.contract?.amt||0),0);
  const upay=r1(payroll(G.userTid)-so+si),tpay=r1(payroll(tr.tid)-si+so);
  const ur=user().roster.length-give.length+get.length,trr=T(tr.tid).roster.length+give.length-get.length;
  const problems=[];
  if(ur>RMAX)problems.push(`You would have ${ur} players. The limit is ${RMAX}.`);
  if(trr>RMAX)problems.push(`They would have ${trr} players. The limit is ${RMAX}.`);
  if(trr<10)problems.push(`They would be left with only ${trr} players.`);
  const need=vr*1.05+.5,interest=give.length+get.length?clamp(vg/need,0,1.5):0;
  return{vg,vr,so,si,upay,interest,problems,ok:!problems.length&&(give.length+get.length)>0&&vg>=need};
}
function proposeTrade(){
  if(!tradeOpen())return toast("Trades are closed until after the playoffs.");
  const e=tradeEval();if(!e)return;
  if(e.problems.length)return toast(e.problems[0]);
  if(!e.ok)return toast(e.interest>=.8?"They say it's close. Add a little more.":"They turned it down.");
  const tr=G.trade,u=user(),t=T(tr.tid);
  tr.give.forEach(pid=>{u.roster=u.roster.filter(x=>x!==pid);t.roster.push(pid);P(pid).tid=t.tid});
  tr.get.forEach(pid=>{t.roster=t.roster.filter(x=>x!==pid);u.roster.push(pid);const p=P(pid);p.tid=u.tid;p.everUser=true});
  (G.seasonTrades??=[]).push({v:tr.get.concat(tr.give).reduce((a,id)=>a+P(id).ovr,0),t:`You traded ${tr.give.map(p=>P(p).name).join(", ")||"nothing"} to the ${t.name} for ${tr.get.map(p=>P(p).name).join(", ")||"nothing"}.`});
  news(`Trade with ${t.city}: you sent ${tr.give.map(p=>P(p).name).join(", ")||"nothing"} for ${tr.get.map(p=>P(p).name).join(", ")||"nothing"}.`);
  G.trade={tid:tr.tid,give:[],get:[]};toast("Trade accepted.");
}

function fill(a){K.forEach(k=>{if(a[k]==null)a[k]=60});return a}
// Approximate: maps one season of per-game stats to ratings. Tune freely.
function ratingsFromStats(s,pos,age){
  const mpg=Math.max(s.mpg||24,8),f=36/mpg,p36=(x)=>(x||0)*f;
  const fg=s.fg??.45,tp=s.tp??.30,tpa36=p36(s.tpa);
  const a={
    SHT:40+(tp-.30)*160+Math.min(tpa36,9)*3.2,FIN:42+(fg-.42)*170+p36(s.ppg)*.9,PLY:34+p36(s.apg)*6.2,
    DEF:40+p36(s.spg)*10+p36(s.bpg)*7.5,REB:30+p36(s.rpg)*4.1,ATH:52+(p36(s.spg)+p36(s.bpg))*4+p36(s.ppg)*.5-Math.max(0,(age||27)-30)*1.5,
    IQ:50+p36(s.apg)*1.8+mpg*.55+(fg-.45)*50,DUR:40+((s.gp??70)/82)*55};
  K.forEach(k=>a[k]=clamp(Math.round(a[k]),25,99));
  const impact=(s.ppg||0)+(s.rpg||0)*.7+(s.apg||0)*1+((s.spg||0)+(s.bpg||0))*1.5;
  return fitAttrs(a,pos,clamp(Math.round(48+impact*1.05),40,97));
}
function importLeague(data){

  G=blankLeague(yr);G.source=data.name||`Imported league (${sl(yr)})`;
  const tl=Array.isArray(data.teams)&&data.teams.length>=4?data.teams.map(t=>[t.abbr,t.city,t.name,t.conf==="W"?"W":"E",t.color||"#888"]):TEAMS;
  tl.forEach((t,i)=>G.teams.push({tid:i,abbr:t[0],city:t[1],name:t[2],conf:t[3],color:t[4],w:0,l:0,roster:[]}));
  const byAbbr=Object.fromEntries(G.teams.map(t=>[t.abbr,t]));
  data.players.forEach(d=>{
    const pos=POS.includes(d.pos)?d.pos:"SF",age=d.age||(d.born?yr-d.born:26);
    const a=d.ratings?fill({...d.ratings}):d.stats?ratingsFromStats(d.stats,pos,age):genAttrs(55,pos);

  });

  G.draftData=data.draftClasses||null;

}

const IDB_NAME="docman-hoops",IDB_STORE="saves";let idbH=null,saveT=null;

    main+=`<section class="panel dash">${nx}
      ${G.rivalTid!=null&&T(G.rivalTid)?`<div class="dash-riv">Rival: <b>${esc(T(G.rivalTid).city)} ${esc(T(G.rivalTid).name)}</b> · ${G.rivalRec?.w||0}-${G.rivalRec?.l||0} this season</div>`:""}<div class="dash-kv"><div><b>${ordn(seed)}</b><span>${u.conf==="E"?"East":"West"}</span></div><div><b>${u.st?(u.st>0?"W":"L")+Math.abs(u.st):"--"}</b><span>Streak</span></div><div><b>${Math.max(0,deadline()-G.day)}</b><span>To deadline</span></div><div><b>${G.expWins}</b><span>Owner goal</span></div></div>
      ${L?`<button class="dash-last" data-act="box"><span class="${L.us>L.them?"wl-w":"wl-l"}">${L.us>L.them?"W":"L"} ${L.us}-${L.them}</span><span>${L.home?"vs":"at"} ${esc(T(L.opp).abbr)}${top?` · ${esc(lname(P(top.pid)))} ${top.pts} pts`:""}</span><i>Box ›</i></button>`:""}
      ${G.results.length?`<div class="strip">${G.results.slice(-12).reverse().map(r=>`<span class="${r.w?"W":"L"}">${r.w?"W":"L"}</span>`).join("")}</div>`:""}</section>`+injuryReport();
  }else if(G.phase==="playoffs"){main=viewBracket()+injuryReport()+lastGameCard()}

function teamLeaders(t){
  const ps=t.roster.map(P).filter(p=>p.stats.gp);if(!ps.length)return"";
  return[["pts","PPG"],["reb","RPG"],["ast","APG"],["blk","BPG"]].map(([k,l])=>{const p=best(ps,x=>pg(x,k));return`<div><b>${pg(p,k).toFixed(1)}</b><span>${l} · ${esc(p.name.split(" ").slice(-1)[0])}</span></div>`}).join("");
}
function viewBracket(){
  const po=G.po;

  const cols=[...Array(po.nr||4).keys()].map(r=>`<div class="round"><div class="label">${roundName(r)}</div>${(po.rounds[r]||[]).map(ser).join("")||'<div class="muted" style="font-size:12px">TBD</div>'}</div>`).join("");
  const msg=!po.made?"You missed the playoffs. Sim ahead to the draft.":po.userOut?"You've been eliminated. Sim ahead to the draft.":`You're alive in the ${roundName(po.round)}.`;
  return`<section class="panel"><h2>Playoffs</h2><p class="muted" style="margin-bottom:12px">${msg}</p><div class="bracket" style="grid-template-columns:repeat(${po.nr||4},minmax(0,1fr))">${cols}</div></section>`;
}
