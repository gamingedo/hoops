<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DocMan2021 Hoops</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hoops">
<meta name="theme-color" content="#070b16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<script>window.HOOPS_APP=true;window.HOOPS_VER="037c650246";</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: same arena system as Hoops Lab. Hardwood page, scoreboard panels, sticky tab rail, fixed sim bar at the thumb. */
:root{
  --floor:#070b16; --floor-2:#0b1224; --floor-line:#ffffff06;
  --ink:#111c38; --ink-2:#18264a; --ink-3:#22335f; --ink-line:#34497e;
  --led:#ffd166; --led-dim:#a8803a; --leather:#ff8a3d; --leather-hi:#ffa45f;
  --paper:#f6f2ea; --muted:#c6cee2; --good:#6cb8ff; --bad:#ffa24c;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Barlow","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{margin:0;font-family:var(--f-body);font-size:16px;line-height:1.5;color:var(--paper);background:var(--floor);
  background-image:radial-gradient(1100px 620px at 85% -8%,#22386f 0,transparent 62%),radial-gradient(900px 520px at -5% 105%,#5a2c1866 0,transparent 60%),repeating-linear-gradient(115deg,transparent 0 90px,#ffffff05 90px 92px);background-attachment:fixed;
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--floor)}
button,select,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--led);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-block:14px 20px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}

/* header */
.hdr{background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;box-shadow:0 14px 30px -18px #000a}
.hdr .who{display:flex;gap:12px;align-items:center;min-width:0}
.sw{width:14px;height:44px;border-radius:4px;flex:none;box-shadow:inset 0 0 0 1px #fff3}
.hdr h1{margin:0;font:900 clamp(26px,5.4vw,40px)/.95 var(--f-display);text-transform:uppercase;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr .sub{font:600 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rec{font:900 44px/.9 var(--f-display);color:var(--led);font-variant-numeric:tabular-nums;text-align:right;text-shadow:0 0 16px #ffb42e44}
.owner{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
.owner .bar{height:8px;border-radius:4px;background:var(--ink-2);overflow:hidden}
.owner .bar i{display:block;height:100%;border-radius:4px}
.owner b{font:900 18px var(--f-display);font-variant-numeric:tabular-nums}
.lab-link{color:var(--paper);font:700 13px var(--f-body);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.lab-link:hover{text-decoration:underline}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font:900 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.brand span{color:var(--leather)}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:6px;background:var(--ink);border-radius:999px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;border-radius:999px;padding:8px 14px;background:transparent;color:var(--muted);font:600 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.tabs button[aria-current="true"]{background:var(--led);color:var(--ink)}

/* panels */
.panel{background:var(--ink);color:var(--paper);border-radius:14px;padding:16px;box-shadow:0 2px 0 #0003,0 14px 30px -18px #000a;min-width:0}
.panel h2{margin:0 0 10px;font:900 24px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.panel h3{margin:0 0 8px;font:900 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;color:var(--paper)}
.label{font:600 12px var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.stack{display:grid;gap:14px}
p{margin:0}
.note{font-size:14px;color:var(--muted);margin-top:8px}

/* buttons */
.btn{font:900 17px var(--f-display);letter-spacing:.08em;text-transform:uppercase;border:0;border-radius:10px;padding:11px 16px;cursor:pointer;background:var(--leather);color:#fff;box-shadow:inset 0 -3px 0 #0003}
.btn:hover:not(:disabled){background:var(--leather-hi)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:var(--ink-3);color:var(--paper)}
.btn.ghost:hover:not(:disabled){background:var(--ink-line)}
.btn.sm{font-size:14px;padding:7px 11px;border-radius:8px}
.btn.xs{font-size:12px;padding:5px 8px;border-radius:6px;letter-spacing:.06em}
.row-btns{display:flex;gap:4px;justify-content:flex-end}
.icon{background:var(--ink-3);color:var(--paper);border:0;border-radius:6px;width:30px;height:30px;cursor:pointer;font:700 14px var(--f-body)}
.icon:hover:not(:disabled){background:var(--ink-line)}
.icon:disabled{opacity:.3}
.linkish{background:none;border:0;padding:0;color:var(--paper);font:inherit;font-weight:600;cursor:pointer;text-align:left}
.linkish:hover{color:var(--led);text-decoration:underline}

/* tables */
.tw{overflow-x:auto;border-radius:8px;border:1px solid var(--ink-line)}
table{border-collapse:collapse;width:100%;font:400 14px var(--f-mono);font-variant-numeric:tabular-nums}
th{font:600 11px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:8px 7px;background:var(--ink-2);white-space:nowrap}
td{padding:8px 7px;text-align:right;border-top:1px solid var(--ink-2);white-space:nowrap}
th.l,td.l{text-align:left}
td.name{font-family:var(--f-body);font-size:14px;max-width:190px;overflow:hidden;text-overflow:ellipsis}
tr.me td{background:#ffb42e14}
tr.cut td{border-top:2px solid var(--led-dim)}
td.hi{color:var(--led);font-weight:600}
.role{font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-block;font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--ink-3);color:var(--paper);vertical-align:middle;margin-left:4px}
.chip.gold{background:var(--led);color:var(--ink)}
.chip.red{background:#4a2a10;color:#ffc58f}
.chip.lab{background:var(--leather);color:#fff}
.chip.green{background:#163a5e;color:#a9d6ff}
.ovr{font:900 18px var(--f-display);color:var(--led)}
.tsw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px;vertical-align:middle;box-shadow:inset 0 0 0 1px #fff4}

/* cards */
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kv div{background:var(--ink-2);border-radius:8px;padding:8px 10px;min-width:0}
.kv b{display:block;font:900 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv span{font:600 10px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--ink-2);border-radius:10px;padding:12px 14px}
.score .t{font:900 22px var(--f-display);text-transform:uppercase;letter-spacing:.03em}
.score .s{font:900 40px/1 var(--f-display);font-variant-numeric:tabular-nums}
.score .s.w{color:var(--led)}
.strip{display:flex;gap:4px;flex-wrap:wrap}
.strip span{width:26px;height:26px;border-radius:5px;display:grid;place-items:center;font:900 14px var(--f-display)}
.strip .W{background:#163a5e;color:#a9d6ff}.strip .L{background:#4a2a10;color:#ffc58f}
.news{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.news li{font-size:14px;padding:8px 10px;background:var(--ink-2);border-radius:8px}
.news li small{display:block;color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.perf{display:grid;gap:4px;margin-top:10px}
.perf div{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.perf div span:last-child{font-family:var(--f-mono);font-size:13px;color:var(--muted)}

/* team picker */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.tcard{background:var(--ink-2);border:1px solid var(--ink-line);border-radius:10px;padding:10px 12px;color:var(--paper);text-align:left;cursor:pointer;display:grid;gap:4px;border-left-width:6px}
.tcard:hover{border-color:var(--led)}
.tcard b{font:900 20px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.tcard .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}

/* bracket */
.bracket{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.round{display:grid;gap:6px;align-content:start}
.series{background:var(--ink-2);border-radius:8px;padding:6px 8px;font:500 12px var(--f-mono);display:grid;gap:2px}
.series.me{box-shadow:0 0 0 1px var(--led) inset}
.series div{display:flex;justify-content:space-between;gap:6px}
.series .won{color:var(--led);font-weight:600}

/* trade */
.tcols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pick{display:grid;gap:4px}
.pick label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;background:var(--ink-2);border-radius:8px;padding:7px 9px;cursor:pointer;border:1px solid transparent}
.pick label:has(input:checked){border-color:var(--led);background:#ffb42e14}
.pick input{accent-color:var(--led);width:18px;height:18px}
.pick .n{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.pick .n small{display:block;color:var(--muted);font-size:11px;font-family:var(--f-mono)}
.meter{height:12px;border-radius:6px;background:var(--ink-2);overflow:hidden;position:relative}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--bad),var(--led) 70%,var(--good))}
.meter::after{content:"";position:absolute;left:66.6%;top:0;bottom:0;width:2px;background:var(--paper);opacity:.6}
select{background:var(--ink-2);color:var(--paper);border:1px solid var(--ink-line);border-radius:8px;padding:8px 10px;max-width:100%}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--ink);border-top:1px solid var(--ink-line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar .in{max-width:1040px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .btn{flex:1;padding:13px 10px;font-size:16px}
.bar .status{color:var(--muted);font:600 12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;flex:1}

/* modal */
.modal{position:fixed;inset:0;z-index:60;background:#0b1020cc;display:grid;place-items:end center;padding-top:env(safe-area-inset-top,0px)}
.sheet{background:var(--ink);color:var(--paper);width:min(760px,100%);max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:760px){.modal{place-items:center}.sheet{border-radius:16px}}
.sheet-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.sheet-h h2{margin:0;font:900 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.x{background:var(--ink-3);border:0;color:var(--paper);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex:none}
.attrs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.attr{background:var(--ink-2);border-radius:8px;padding:8px;text-align:center}
.attr b{display:block;font:900 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.attr span{font:600 10px var(--f-body);letter-spacing:.12em;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.confirm{background:#4a2a1055;border:1px solid #8a5a2a;border-radius:10px;padding:12px;display:grid;gap:10px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--paper);color:var(--ink);font-weight:600;padding:10px 16px;border-radius:10px;box-shadow:0 10px 30px -10px #000a;max-width:min(92vw,520px);text-align:center}
textarea{width:100%;min-height:120px;background:var(--ink-2);color:var(--paper);border:1px solid var(--ink-line);border-radius:8px;padding:10px;font:12px var(--f-mono)}
pre.schema{background:var(--ink-2);border-radius:8px;padding:12px;overflow-x:auto;font:12px/1.5 var(--f-mono);margin:0;color:var(--paper)}
input[type=file]{color:var(--paper);max-width:100%}



/* legacy */
.banners{display:flex;flex-wrap:wrap;gap:10px}
.banner{width:86px;padding:12px 6px 16px;text-align:center;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 55%,#000));color:#fff;clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%);display:grid;gap:2px;box-shadow:inset 0 0 0 2px #ffffff40}
.banner b{font:900 26px/1 var(--f-display)}.banner span,.banner small{font:700 9px var(--f-body);letter-spacing:.12em;text-transform:uppercase}
.banner.old{filter:saturate(.6) brightness(.85)}
.jersey{width:96px;padding:10px 6px;text-align:center;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 50%,#000));color:#fff;display:grid;gap:2px;box-shadow:inset 0 0 0 2px #ffffff40}
.jersey b{font:900 40px/1 var(--f-display)}.jersey span{font:700 11px var(--f-body);text-transform:uppercase;letter-spacing:.04em}
.recap-hero{background:linear-gradient(120deg,var(--ink-3),var(--ink-2));border-radius:12px;padding:14px;display:grid;gap:4px;border:1px solid var(--led-dim)}
.recap-hero b{font:900 30px/1 var(--f-display);text-transform:uppercase;color:var(--led)}.recap-hero em{color:var(--muted);font-size:13px}
.recap-you{background:#ffb42e14;border:1px solid var(--led-dim);border-radius:10px;padding:10px 12px;font-weight:600}
.goat .tier{display:grid;grid-template-columns:54px minmax(0,1fr);border-top:1px solid var(--ink-line)}
.goat .tnum{font:900 40px var(--f-display);color:var(--muted);display:grid;place-items:center;background:var(--ink-2)}
.goat .tcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:10px}
.gcard{position:relative;background:linear-gradient(150deg,#1d3a63,#0f1d36);border:1px solid #ffffff22;border-radius:10px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;min-width:0}
.gcard.legend{background:linear-gradient(150deg,#3b3f55,#1b1e2e)}
.gcard.mine{box-shadow:0 0 0 2px var(--led)}
.gmono{width:46px;height:46px;border-radius:50%;background:#ffffff1a;border:2px solid #ffffff44;display:grid;place-items:center;line-height:1}
.gmono span{font:900 17px var(--f-display)}.gmono small{font:700 9px var(--f-body);opacity:.8}
.grank{font:700 9px var(--f-body);letter-spacing:.12em;color:#ffffffaa;text-align:right}.grank b{display:block;font:900 26px/1 var(--f-display);color:#fff}
.gname{grid-column:1/-1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.gname .linkish{font-weight:700}
.gmeta{grid-column:1/-1;font:500 11px var(--f-mono);color:#ffffffaa}
.gchase{background:var(--ink-2);border:1px solid var(--led-dim);border-radius:10px;padding:10px 12px;min-width:220px}
.gchase b{color:var(--led)}.gchase small{color:var(--muted);font-size:11px}
.gchase .meter::after{display:none}


/* ===== menu + MyCareer ===== */
.menu-btn{background:var(--ink);color:var(--paper);border:1px solid var(--ink-line);border-radius:999px;padding:9px 16px;font:700 13px var(--f-body);letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.menu-btn:hover{border-color:var(--led)}
.nav-btns{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.nav-btns .eras-x{margin-left:0}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.menu-card{position:relative;overflow:hidden;text-align:left;cursor:pointer;color:#f4f1ea;border:1px solid #ffffff2e;border-radius:16px;padding:22px;min-height:220px;display:grid;align-content:end;gap:6px;
  background:linear-gradient(130deg,color-mix(in srgb,var(--e3) 90%,#000),color-mix(in srgb,var(--e1) 40%,#000));box-shadow:0 20px 40px -24px #000}
.menu-card:hover,.menu-card:focus-visible{border-color:var(--e2)}
.menu-card .ty{position:absolute;right:12px;top:-14px;font:900 120px/1 var(--f-display);color:#ffffff10}
.menu-card small{font:700 12px var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--e2)}
.menu-card b{font:900 34px/1 var(--f-display);text-transform:uppercase;position:relative}
.menu-card p{margin:0;color:#dfe4f0;font-size:15px;position:relative;max-width:42ch}
.mc-in{background:#ffffff14;color:#f4f1ea;border:1px solid #ffffff2a;border-radius:8px;padding:10px 12px;font:700 20px var(--f-display);letter-spacing:.04em;text-transform:uppercase;width:100%;max-width:420px}
.mc-row{display:flex;gap:12px;flex-wrap:wrap}.mc-row>div{display:grid;gap:6px}
.mc-slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.mc-slot{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:8px 10px;border-radius:8px;background:#ffffff0d;border:1px dashed #ffffff2a}
.mc-slot.on{border-style:solid;border-color:#ffffff40;background:#ffffff16}
.mc-slot span{min-width:0;overflow:hidden;text-overflow:ellipsis;font:600 12px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:#c9cfe0}.mc-slot b{grid-row:span 2;font:900 26px var(--f-display);color:var(--e2)}
.mc-slot small{font-size:12px;color:#dfe4f0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-pick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.mc-b{display:grid;gap:2px;justify-items:center;padding:10px 4px;border-radius:8px;border:1px solid var(--e2);background:#ffffff10;color:#f4f1ea;cursor:pointer}
.mc-b span{font:600 10px var(--f-body);letter-spacing:.06em;text-transform:uppercase}.mc-b b{font:900 28px/1 var(--f-display)}
.mc-b.off{opacity:.35;border-color:#ffffff22;cursor:default}
.mc-offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.mc-offer{background:#ffffff10;border:1px solid #ffffff2a;border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.mc-offer b{font:900 24px var(--f-display);text-transform:uppercase;display:block}.mc-offer small{color:#c9cfe0}.mc-offer p{font-size:14px;margin:0}
.mc-offer .start{font-size:15px;padding:10px 14px}
#mc .news li,#mc .news li b{background:#ffffff10;color:#f4f1ea}
@media (max-width:760px){.mc-pick{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* ===== broadcast look (matches the main menu) ===== */
.tabs{position:static;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));overflow:visible;border-radius:16px;gap:6px;padding:8px}
.tabs button{padding:9px 4px;font-size:12px;letter-spacing:.04em;white-space:nowrap}

    const pkg=[];let v=0;for(const x of pool){if(v>=want*.7||pkg.length>=3)break;if(value(x)>want*1.2)continue;pkg.push(x);v+=value(x)}

function syncCareerTeam(){

function autoFill(){const u=user();const fas=()=>Object.values(G.players).filter(p=>p.tid===-1&&p.pid!==G.career?.pid).sort((a,b)=>value(b)-value(a));
  while(u.roster.length<13){let p=fas()[0];if(!p)p=genPlayer(ri(50,58),ri(22,30),pick(POS),-1);p.tid=u.tid;setContract(p,MINSAL,1);u.roster.push(p.pid)}
  while(u.roster.length>RMAX)toFA(best(u.roster.map(P),p=>-value(p)));autoLineup()}
function autoResign(){(G.resign||[]).forEach(r=>{const p=P(r.pid);if(!p||p.tid!==G.userTid||r.refuse)return;if(p.ovr>=64)setContract(p,r.ask,r.yrs)})}
async function autoAdvance(stop,onTick){
  let n=0;const tick=async()=>{if(++n%6===0){onTick&&onTick();await new Promise(r=>setTimeout(r,0))}};
  for(let guard=0;guard<6000&&!stop();guard++){
    switch(G.phase){
      case"preseason":case"fa":autoFill();startSeason();break;
      case"season":simDay();break;
      case"playoffs":playoffDay();break;
      case"draft":revealLottery(true);G.draft.started=true;while(G.draft.i<nPicks())draftPick(G.draft.order[G.draft.i],aiChoice());finishDraft();break;
      case"resign":autoResign();resignDone();break;
      case"fired":G.owner=50;G.phase="fa";break;
      default:return}
    await tick()}
  G.showRecap=false;
}

const CL={db:null,uid:null,on:false,at:0,t:null,state:"checking"};
const CHUNK=180000;
async function gz(str){
  if(!window.CompressionStream)return"R:"+str;
  const buf=await new Response(new Blob([str]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer();
  const b=new Uint8Array(buf);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return"G:"+btoa(s);
}
async function ungz(s){
  if(s.startsWith("R:"))return s.slice(2);
  const bin=atob(s.slice(2)),b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}
const cdoc=k=>CL.db.doc(`data/users/${CL.uid}/${k}`);
async function cloudInit(){
  try{if(!window.claude?.use){CL.state="off";return}
    const [db,us]=await Promise.all([claude.use("db"),claude.use("user")]);const id=us?await us.id():null;
    if(!db||!id){CL.state="off";return}CL.db=db;CL.uid=id;CL.on=true;CL.state="on"}catch(e){CL.state="off"}
}
function cloudSoon(){if(!CL.on)return;clearTimeout(CL.t);CL.t=setTimeout(()=>cloudPush().catch(()=>{}),4000)}
async function cloudPush(){
  if(!CL.on)return;const at=Date.now();
  const s=await gz(JSON.stringify({G,C,at}));const n=Math.ceil(s.length/CHUNK);
  try{for(let i=0;i<n;i++)await cdoc("save_"+i).set({d:s.slice(i*CHUNK,(i+1)*CHUNK)});
    await cdoc("save").set({n,at,v:1,team:G?.userTid!=null?`${user().city} ${user().name}`:null,year:G?.year??null,career:C?.name||null});
    CL.at=at;CL.state="on"}
  catch(e){CL.state=e?.code==="quota_exceeded"?"full":"error"}
  if(G?.tab==="league"&&$("menu").hidden)renderView();
}
async function cloudPull(){
  if(!CL.on)return null;
  const m=await cdoc("save").get();if(!m.exists)return null;const meta=m.data();
  const parts=[];for(let i=0;i<meta.n;i++){const d=await cdoc("save_"+i).get();if(!d.exists)return null;parts.push(d.data().d)}
  const obj=JSON.parse(await ungz(parts.join("")));CL.at=meta.at;return obj;
}
async function cloudBoot(){
  await cloudInit();if(!CL.on){if(!$("menu").hidden)openMenu();return}
  try{const o=await cloudPull();const local=Math.max(G?.savedAt||0,C?.savedAt||0);
    if(o&&o.at>local+2000){if(o.G)G=o.G;if(o.C)C=o.C;saveNow();if(o.C)idbPut(CKEY,JSON.stringify(C)).catch(()=>{});
      if(G.hist)loadDB().catch(()=>{});toast("Loaded your newest save from the cloud.");if(!$("menu").hidden)openMenu();else render()}
    else if(local>(o?.at||0))cloudPush().catch(()=>{});
  }catch(e){CL.state="error"}
  if(!$("menu").hidden)openMenu();
}
function cloudLine(){
  const tm=CL.at?new Date(CL.at).toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"}):null;
  return CL.state==="on"?`☁ Cloud save on${tm?` · last synced ${tm}`:""}. Sign in to Claude on any device to keep playing.`
    :CL.state==="checking"?"☁ Checking cloud save…":CL.state==="full"?"☁ Cloud storage is full. Your league still saves on this device."

    :window.HOOPS_APP?"📱 Saves live on this phone. Use Saves → Back up saves to copy them to another device."
    :"☁ Cloud save is off here. It works when the game is opened in Claude while signed in. Saves stay on this device.";
}

function tradeEval(){
  const tr=G.trade;if(tr.tid==null)return null;
  const give=tr.give.map(P),get=tr.get.map(P);
  const vg=give.reduce((a,p)=>a+value(p),0),vr=get.reduce((a,p)=>a+value(p),0);
  const so=give.reduce((a,p)=>a+(p.contract?.amt||0),0),si=get.reduce((a,p)=>a+(p.contract?.amt||0),0);
  const upay=r1(payroll(G.userTid)-so+si),tpay=r1(payroll(tr.tid)-si+so);
  const ur=user().roster.length-give.length+get.length,trr=T(tr.tid).roster.length+give.length-get.length;
  const problems=[];
  if(ur>RMAX)problems.push(`You would have ${ur} players. The limit is ${RMAX}.`);
  if(trr>RMAX)problems.push(`They would have ${trr} players. The limit is ${RMAX}.`);
  if(trr<10)problems.push(`They would be left with only ${trr} players.`);
  const need=vr*1.05+.5,interest=give.length+get.length?clamp(vg/need,0,1.5):0;
  return{vg,vr,so,si,upay,interest,problems,ok:!problems.length&&(give.length+get.length)>0&&vg>=need};
}
function proposeTrade(){
  if(!tradeOpen())return toast("Trades are closed until after the playoffs.");
  const e=tradeEval();if(!e)return;
  if(e.problems.length)return toast(e.problems[0]);
  if(!e.ok)return toast(e.interest>=.8?"They say it's close. Add a little more.":"They turned it down.");
  const tr=G.trade,u=user(),t=T(tr.tid);
  tr.give.forEach(pid=>{u.roster=u.roster.filter(x=>x!==pid);t.roster.push(pid);P(pid).tid=t.tid});
  tr.get.forEach(pid=>{t.roster=t.roster.filter(x=>x!==pid);u.roster.push(pid);const p=P(pid);p.tid=u.tid;p.everUser=true});
  (G.seasonTrades??=[]).push({v:tr.get.concat(tr.give).reduce((a,id)=>a+P(id).ovr,0),t:`You traded ${tr.give.map(p=>P(p).name).join(", ")||"nothing"} to the ${t.name} for ${tr.get.map(p=>P(p).name).join(", ")||"nothing"}.`});
  news(`Trade with ${t.city}: you sent ${tr.give.map(p=>P(p).name).join(", ")||"nothing"} for ${tr.get.map(p=>P(p).name).join(", ")||"nothing"}.`);
  G.trade={tid:tr.tid,give:[],get:[]};toast("Trade accepted.");
}

// Approximate: maps one season of per-game stats to ratings. Tune freely.
function ratingsFromStats(s,pos,age){
  const mpg=Math.max(s.mpg||24,8),f=36/mpg,p36=(x)=>(x||0)*f;
  const fg=s.fg??.45,tp=s.tp??.30,tpa36=p36(s.tpa);
  const a={
    SHT:40+(tp-.30)*160+Math.min(tpa36,9)*3.2,FIN:42+(fg-.42)*170+p36(s.ppg)*.9,PLY:34+p36(s.apg)*6.2,
    DEF:40+p36(s.spg)*10+p36(s.bpg)*7.5,REB:30+p36(s.rpg)*4.1,ATH:52+(p36(s.spg)+p36(s.bpg))*4+p36(s.ppg)*.5-Math.max(0,(age||27)-30)*1.5,
    IQ:50+p36(s.apg)*1.8+mpg*.55+(fg-.45)*50,DUR:40+((s.gp??70)/82)*55};
  K.forEach(k=>a[k]=clamp(Math.round(a[k]),25,99));
  const impact=(s.ppg||0)+(s.rpg||0)*.7+(s.apg||0)*1+((s.spg||0)+(s.bpg||0))*1.5;
  return fitAttrs(a,pos,clamp(Math.round(48+impact*1.05),40,97));
}

function runSim(n){
  const stop=n==="end"?()=>G.phase!=="season":n==="deadline"?()=>G.phase!=="season"||G.day>=deadline():null;
  if(n==="all"){while(G.phase==="season")simDay();while(G.phase==="playoffs")playoffDay();G.tab="home";return}
  if(stop){while(!stop())simDay()}else if(n===1){let g=null;while(!g&&G.phase==="season")g=simDay()}else for(let i=0;i<n&&G.phase==="season";i++)simDay();
  G.tab="home";
}
function runPO(n){

  else if(n==="round"){const r=G.po.round;while(G.phase==="playoffs"&&G.po.round===r)playoffDay()}
  else playoffDay();
  G.tab="home";
}

    case"lvoff":LV.ctl.off=d.v;lvCoach();return;
    case"lvdef":LV.ctl.def=d.v;lvCoach();return;
    case"lvto":if(LV.ctl.to>0){LV.ctl.to--;LV.ctl.boost=5;lvPop("TIMEOUT",LV.ctl.side);toast("Timeout. Your guys get a lift for the next few trips.")}lvCoach();return;
    case"lvsubout":LV.subOut=String(LV.subOut)===String(d.v)?null:d.v;lvCoach();return;
    case"lvsubin":lvSubIn(d.v);LV.ctl.subNow=true;return;
    case"cltap":clutchTap(false);return;
    case"lvera":{const on=!eraLookOn();if(LV.college)C.eraLook=on;else G.settings.eraLook=on;const ct=document.querySelector(".lv-court");ct.className="lv-court "+(on?ct.dataset.era:"");b.textContent=on?"Era look: on":"Era look: off";return}
    case"lvagain":{const s=LV.src;LV=null;openReel(s.store,s.idx);return}
    case"reel":openReel(G.reel,+d.v);return;
    case"creel":openReel(C.reel,+d.v);return;
    case"lvmine":LV.feedMine=!LV.feedMine;b.className="btn xs"+(LV.feedMine?"":" ghost");document.querySelectorAll("#lv-feed li").forEach(li=>li.hidden=LV.feedMine&&!li.dataset.mine);return;
    case"po":runPO(d.n==="1"?1:d.n);break;
    case"simdraft":simDraft();break;
    case"draftpick":if(userOnClock()){draftPick(G.userTid,pid);if(G.draft.i>=nPicks())finishDraft()}break;
    case"autopick":if(userOnClock()){draftPick(G.userTid,aiChoice());if(G.draft.i>=nPicks())finishDraft()}break;
    case"reveal":revealLottery(d.all==="1");break;
    case"propose":proposeTrade();break;
    case"tclear":G.trade.give=[];G.trade.get=[];break;
    case"tradewith":G.trade={tid:+d.tid,give:[],get:[]};G.tab="trade";break;
    case"tradefor":{const p=P(pid);G.trade={tid:p.tid,give:[],get:[pid]};G.tab="trade";closeModal();break}
    case"viewroster":G.viewTid=+d.tid;G.tab="roster";break;
    case"newleague-ask":$("newleague-zone").innerHTML=`<div class="confirm" style="width:100%"><p>Start over? This deletes your current league and its history.</p><div class="actions"><button class="btn" data-act="newleague">Delete and start over</button><button class="btn ghost" data-act="tab" data-v="league">Keep my league</button></div></div>`;return;
    case"newleague":openEras();return;
    default:return;
  }
  render();
});

(()=>{let ht=null,held=false,sx=0,sy=0,st=0,sheetY=null;

  ["pointerup","pointercancel","pointerleave"].forEach(t=>document.addEventListener(t,()=>clearTimeout(ht)));

  const skip=t=>t.closest(".tw,.segs,.fid,.bgrid,.actions,input,select,canvas,.lead-grid,.strip,.cards");
  document.addEventListener("touchstart",e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();sheetY=e.target.closest("#sheet")&&$("sheet").scrollTop<=0?t.clientY:null},{passive:true});
  document.addEventListener("touchend",e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(sheetY!=null&&!$("modal").hidden&&dy>110&&Math.abs(dx)<60){closeModal();return}
    if(Date.now()-st>600||Math.abs(dx)<70||Math.abs(dy)>45||skip(e.target))return;
    if(e.target.closest("#view")&&$("modal").hidden&&G?.userTid!=null){swipeTab(dx<0?1:-1);return}
    if(e.target.closest("#mc .cl-body")&&C?.stage==="college")clSwipe(dx<0?1:-1)},{passive:true});
})();

(async()=>{
G=await loadAsync();
const firstRun=!G||G.v!==1;
if(firstRun)newLeague();
if(!G.settings)G.settings={inj:"real"};
G.settings.lottery??="era";
if(!G.ovrV2){Object.values(G.players).forEach(p=>{const o=calcOvr(p.a,p.pos);p.pot=Math.max(o,p.pot+(o-p.ovr));p.ovr=o});G.ovrV2=true}
if(!G.durV2){Object.values(G.players).forEach(p=>{if(!p.lab)p.a.DUR=clamp(Math.round(92+(p.a.DUR-72)*.58),55,99)});G.durV2=true}
render();

openMenu();
cloudBoot();
if(G.hist)loadDB().then(render).catch(()=>toast("Couldn't load the history file. Some real-player details are hidden until it loads."));
window.__hoopsState=()=>G;window.__C=()=>C;window.__clSim=v=>clSim(v);window.__ctab=v=>{C.ctab=v;mcRender()};window.__swipe=d=>swipeTab(d);window.__lvc=()=>{LV.wait={pid:Object.keys(LV.ps)[0],sht:70,need:'Down 2 · 0:12 left'};openClutch()};window.__clutchTest=n=>{let prompts=0,made=0,att=0;for(let i=0;i<n;i++){const ids=shuffle([...Array(G.teams.length).keys()]);const ctl=mkCtl(0,null);const g=liveGen(nbaSD(ids[0],ids[1]),nbaOpt(),ctl);let r,arg;while(!(r=g.next(arg)).done){arg=undefined;if(r.value&&r.value.clutch){prompts++;arg=1}}r.value.ev.filter(e=>e.clutch).forEach(e=>{att++;if(e.type==="make")made++})}return{prompts,att,made}};window.__lv=()=>LV;window.__dp=(c,p)=>drawPlayer(c,p,null);
window.__liveTest=n=>{const out={pts:0,fga:0,fgm:0,tpa:0,fta:0,ast:0,reb:0,stl:0,blk:0,ot:0,g:0,top:[]};
  for(let i=0;i<n;i++){const ids=shuffle([...Array(G.teams.length).keys()]);const r=liveGame(ids[0],ids[1],true);out.g++;if(r.ot)out.ot++;
    for(const k in r.box)r.box[k].forEach(x=>{out.pts+=x.pts;out.fga+=x.fga;out.fgm+=x.fgm;out.tpa+=x.tpa;out.ast+=x.ast;out.reb+=x.reb;out.stl+=x.stl;out.blk+=x.blk;out.top.push(x.pts)})}
  const tg=out.g*2;return{teamPts:out.pts/tg,fgPct:out.fgm/out.fga,tpa:out.tpa/tg,ast:out.ast/tg,reb:out.reb/tg,stl:out.stl/tg,blk:out.blk/tg,otRate:out.ot/out.g,max:Math.max(...out.top),events:0}};
})();
})();
