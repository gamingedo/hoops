</head><body><title>Hoops Dynasty</title>
<meta name="theme-color" content="#121a33">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@500;600;700;800&family=Silkscreen&display=swap">
<style>/* single dark game look: twilight, ivory, gold */
:root{--tw:#121a33;--tw2:#0b1024;--dusk:#1d2747;--dusk2:#26325a;--line:#34416e;--ivory:#f6efe0;--seam:#e3d5b4;--ink:#2a2d48;--brown:#6d6656;--gold:#e2b660;--gold2:#b8893a;--goldlt:#f6dca0;--up:#2f7fd6;--upd:#6cb8ff;--dn:#c8641c;--dnd:#ffa24c;--mut:#9fb0d8;
  --r1:#9ba1b0;--r2:#3fb6a4;--r3:#4f8ff0;--r4:#a07cf0;--r5:#f0c060;
  --f-d:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--f-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--f-p:"Silkscreen",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 600px at 70% -10%,#2c3a7a 0,transparent 60%),linear-gradient(180deg,var(--tw),var(--tw2));background-attachment:fixed;color:var(--ivory);font:500 16px/1.4 var(--f-b)}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 max(12px,env(safe-area-inset-left)) calc(84px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));margin:0 calc(-1 * max(12px,env(safe-area-inset-left))) 4px;background:#121a33;box-shadow:0 8px 16px -10px #000c}
.top h1{margin:0;font:900 24px/1 var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.top h1 small{display:block;font:700 13px var(--f-b);letter-spacing:.12em;color:var(--mut)}
.coins{display:flex;align-items:center;gap:6px;background:#05070f;border:1px solid #2a3460;border-radius:999px;padding:5px 12px;font:800 16px var(--f-b);color:var(--goldlt)}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#e2b660 55%,#a8782c);box-shadow:0 0 0 1px #7a5a22}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#070b18f2;border-top:1px solid #222c52;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{background:none;border:0;padding:9px 0 10px;display:grid;justify-items:center;gap:3px;font:700 13px var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--goldlt)}
.dot{position:relative}.dot::after{content:"";position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--dnd)}
.panel{background:linear-gradient(180deg,#1b2446,#141b38);border:1px solid #2c386a;border-radius:16px;padding:14px;margin:10px 0}
.panel.iv{background:linear-gradient(180deg,#26305a,#18203f);color:var(--ivory);border-color:#e2b66070;box-shadow:inset 0 3px 0 var(--gold),0 10px 24px -14px #000}
.kick{font:700 13px var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.iv .kick{color:var(--goldlt)}
h2{margin:2px 0 6px;font:900 28px/1.05 var(--f-d);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{margin:0 0 6px;font:900 20.5px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.03em}
p{margin:6px 0}.mut{color:var(--mut)}.iv .mut{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{appearance:none;border:1px solid #3a4777;background:#222c55;border-radius:12px;padding:10px 14px;font:800 16px var(--f-b);color:var(--ivory)}
.btn:active{transform:translateY(1px)}
.btn.go{border-color:#fff3d0;background:linear-gradient(180deg,#f8e3ad,var(--gold) 60%,#d4a04c);color:var(--ink);font:900 20.5px var(--f-d);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 0 1px var(--gold2),0 6px 16px -8px #e2b66088}
.btn.ghost{background:transparent}.btn.sm{padding:6px 10px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus-visible,.nav button:focus-visible,.mc:focus-visible{outline:3px solid var(--upd);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font:700 14px var(--f-b);padding:3px 9px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff1c}
.chip.up{color:var(--upd)}.chip.dn{color:var(--dnd)}.chip.gold{color:var(--goldlt);border-color:#e2b66055}
.seg{display:flex;background:#0a0f22;border:1px solid #2a3460;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font:800 15px var(--f-b);color:var(--mut)}
.seg button.on{background:#26325a;color:var(--ivory)}
/* mini card */
.mc{--t:var(--r1);position:relative;border:0;padding:2px;border-radius:12px;background:var(--t);text-align:left;color:var(--ivory);min-width:0}
.mc .in{border-radius:10px;background:linear-gradient(180deg,#1f2a50,#0d1228);padding:6px 6px 7px;display:grid;gap:3px;height:100%;min-width:0}
.mc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.mc .o{font:900 24px/.9 var(--f-d);color:var(--t);padding-top:2px}.mc .o.d3{font-size:20px}.mc .o.hi{color:var(--goldlt)}
.mc .st{font:700 10px/1 var(--f-b);color:var(--t);letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.art{position:relative;display:grid;place-items:center;flex:none;width:34px;height:30px;border-radius:7px;overflow:hidden;background:#0b1024}
.art .jz{width:100%;height:100%;display:grid;place-items:center;background:var(--tc,#335);font:900 14px var(--f-d);color:#fff;text-shadow:0 1px 0 #0006}
.art .jz.sm{font-size:10px;letter-spacing:.02em}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;background:#0b1024}
.mc .nm{font:900 13px/1.05 var(--f-d);text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .sb{font:600 10px/1.2 var(--f-b);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mc .sb b{color:var(--t);font-weight:800}
.mc.sel{outline:3px solid var(--upd);outline-offset:2px}
.mc .new{position:absolute;top:-5px;left:-5px;z-index:2;background:var(--dnd);color:#1b0f05;font:900 9px var(--f-b);padding:1px 5px;border-radius:6px;letter-spacing:.06em}
.s1{--t:var(--r1)}.s2{--t:var(--r2)}.s3{--t:var(--r3)}.s4{--t:var(--r4)}.s5{--t:var(--r5)}.s6{--t:#f6dca0}
.mc.kL{background:linear-gradient(135deg,#f6efe0,#e2b660,#f6efe0,#c8a24a)}.mc.kL .o{color:var(--goldlt)}
.mc.kM{background:linear-gradient(135deg,#f0c060,#fff1b8 40%,#d49a2a 60%,#f0c060)}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:#03050ccc;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet>.box{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#1b2446,#0f1530);border:1px solid #2c386a;border-bottom:0;border-radius:20px 20px 0 0;padding:14px max(14px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom));animation:up .2s}
.sheet .x{float:right;border:0;background:#ffffff14;border-radius:50%;width:34px;height:34px;font:800 19.5px var(--f-b)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.5}}
/* big card */
.bc{border-radius:18px;padding:3px;background:var(--t);margin:2px auto 12px;max-width:360px;clear:both}
.bc .in{border-radius:15px;background:linear-gradient(180deg,#1f2a50,#0b1024);padding:14px 16px 14px;display:grid;gap:6px}
.bc .bt2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bc .bo b{display:block;font:900 69px/.82 var(--f-d);color:var(--t)}.bc .bo b.hi{color:var(--goldlt)}
.bc .bo span{display:block;margin-top:6px;font:700 13px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.bc .art{width:132px;height:100px;border-radius:12px}.bc .art .jz{font-size:40px}.bc .art .jz.sm{font-size:26px}
.bc .tg{font:800 14px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--t);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.bc .stars{letter-spacing:.06em}.bc .evo,.bc .now{font:700 12px var(--f-b);letter-spacing:.08em;color:var(--mut);border:1px solid #ffffff26;border-radius:6px;padding:1px 6px}
.bc .nm{font:900 32.5px/1 var(--f-d);text-transform:uppercase;letter-spacing:.01em}
.bc .sub{font:700 15px var(--f-b);color:var(--mut)}
.bc .bl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:4px;padding:8px 0 0;border-top:1px solid #ffffff14;font:700 12px var(--f-b);letter-spacing:.08em;color:var(--mut);text-align:center}
.bc .bl b{display:block;font:900 21.5px/1 var(--f-d);color:var(--ivory);letter-spacing:.01em;margin-bottom:2px}.bc .bl span:only-child{grid-column:1/-1;font-size:14px}
.bc.kL{background:linear-gradient(135deg,#f6efe0,#e2b660,#f6efe0,#c8a24a)}.bc.kM{background:linear-gradient(135deg,#f0c060,#fff1b8 40%,#d49a2a 60%,#f0c060)}
.stamp{display:inline-block;border:1.5px solid var(--goldlt);color:var(--goldlt);border-radius:6px;padding:0 6px;font:900 13px/1.6 var(--f-d);letter-spacing:.1em}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:92px 1fr 40px;gap:10px;align-items:center;font:700 15px var(--f-b)}
.bar i{height:8px;border-radius:4px;background:#ffffff14;overflow:hidden;display:block}.bar i b{display:block;height:100%;border-radius:4px}
.bar em{font-style:normal;text-align:right;font:900 19.5px/1 var(--f-d);font-variant-numeric:tabular-nums}
.bar em.hi{color:var(--goldlt)}
.bts{margin-top:12px;padding-top:10px;border-top:1px solid #ffffff14}.bts ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px;font:500 15px/1.35 var(--f-b);color:#d9def0}.bts b{color:var(--goldlt);font-weight:800}
.xpb{height:8px;border-radius:4px;background:#ffffff14;overflow:hidden}.xpb b{display:block;height:100%;background:linear-gradient(90deg,#6cb8ff,#a07cf0)}
.pips{display:flex;gap:4px}.pips i{width:16px;height:16px;border-radius:4px;background:#ffffff14;display:grid;place-items:center;font:800 11px var(--f-b);font-style:normal}.pips i.on{background:var(--gold);color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{border:1px dashed #3a4777;border-radius:10px;padding:7px;background:#0a0f22;text-align:left;min-height:56px}
.slot b{display:block;font:800 14px var(--f-b)}.slot small{display:block;font:600 13px var(--f-b);color:var(--mut)}
.slot.f{border-style:solid;border-color:var(--rc,#3a4777)}
table.box{width:100%;border-collapse:collapse;font:600 14px var(--f-b)}
table.box th{font:700 12px var(--f-b);letter-spacing:.08em;color:var(--mut);text-align:right;padding:4px 3px;border-bottom:1px solid #2c386a}
table.box td{text-align:right;padding:5px 3px;border-bottom:1px solid #ffffff0d;font-variant-numeric:tabular-nums}
table.box th:first-child,table.box td:first-child{text-align:left}

/* scoreboard and court */
.sbd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#05070f;border:1px solid #2a3460;border-radius:12px;padding:8px 12px}
.sbd .tm b{font:900 34.5px/1 var(--f-d)}.sbd .tm small{display:flex;gap:6px;align-items:center;font:800 14px var(--f-b);letter-spacing:.08em;color:var(--mut)}.sbd .tm.r{text-align:right}.sbd .tm.r small{justify-content:flex-end}
.sbd .mid{text-align:center}.sbd .mid b{font:400 15px var(--f-p);color:var(--goldlt)}.sbd .mid small{display:block;font:700 12px var(--f-b);color:var(--mut);letter-spacing:.08em}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.court{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid #2a3460}
.court canvas{display:block;width:100%;height:auto}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);font:900 clamp(22px,7vw,34px)/1 var(--f-d);letter-spacing:.05em;text-transform:uppercase;color:var(--goldlt);text-shadow:0 3px 0 #0b1024,0 0 18px #000;opacity:0;transition:.2s;pointer-events:none;text-align:center;white-space:nowrap}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.banner.good{color:#9cc8ff}.banner.bad{color:var(--dnd)}
.ticker{margin-top:8px;max-height:30vh;overflow:auto;display:grid;gap:4px}
.tk{display:grid;grid-template-columns:52px 1fr auto;gap:8px;font:600 15px var(--f-b);padding:5px 8px;border-radius:8px;background:#ffffff08}
.tk .c{font:400 12px var(--f-p);color:var(--mut);padding-top:2px}.tk .s{font:800 14px var(--f-b);color:var(--mut)}
.tk.me{border-left:3px solid var(--upd)}.tk.them{border-left:3px solid var(--dnd)}.tk.perk{background:#e2b6601f;color:var(--goldlt)}.tk.q{background:none;color:var(--mut);font-weight:800}
/* reveal */
.reveal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:420px){.reveal{grid-template-columns:repeat(4,minmax(0,1fr))}}
.flip{perspective:600px}.flip .fc{transition:transform .45s;transform-style:preserve-3d;position:relative}.flip.open .fc{transform:rotateY(180deg)}
.flip .back,.flip .front{backface-visibility:hidden}.flip .front{transform:rotateY(180deg)}
.flip .back{position:absolute;inset:0;border-radius:12px;background:repeating-linear-gradient(45deg,#26325a 0 6px,#1d2747 6px 12px);border:2px solid #3a4777;display:grid;place-items:center;font:900 21.5px var(--f-d);color:#3a4777}
.flip .back.h5{box-shadow:0 0 18px 4px #f0c060aa;border-color:#f0c060}.flip .back.h4{box-shadow:0 0 14px 2px #a07cf0aa;border-color:#a07cf0}
.list{display:grid;gap:6px}
.li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff10;text-align:left;width:100%;color:inherit}
.li .sp{min-width:0}.li b{display:block;font:800 15px var(--f-b)}.li small{display:block;color:var(--mut);font:600 14px var(--f-b)}
.gem{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:900 14px var(--f-d);color:#0b1024;flex:none}
.floor{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.floor button{border:1px solid #3a4777;background:#0a0f22;border-radius:10px;padding:8px 0;font:900 19.5px var(--f-d)}
.floor button.cl{background:#1f3a6a;border-color:#4f8ff0}.floor button.lk{opacity:.35}.floor button.boss{border-color:var(--gold);color:var(--goldlt)}
.feat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.days div{background:#0a0f22;border:1px solid #2a3460;border-radius:9px;padding:5px 3px;text-align:center;font:700 10px var(--f-b);color:var(--mut)}.days div b{display:block;font:900 12px var(--f-d);color:var(--ivory);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.teamgrid button{border:1px solid #2a3460;background:#0e1430;border-radius:12px;padding:10px 6px;display:grid;justify-items:center;gap:6px;font:800 15px var(--f-b)}
.teamgrid button i{width:28px;height:28px;border-radius:8px}
.teamgrid button small{font:600 12px var(--f-b);color:var(--mut)}
.title{min-height:90vh;display:grid;place-items:center;text-align:center}
.title h1{font:900 clamp(44px,13vw,72px)/.9 var(--f-d);letter-spacing:.03em;margin:0;text-transform:uppercase;background:linear-gradient(180deg,#fff6dc,#e2b660 70%,#b8893a);-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{color:var(--mut);max-width:30ch;margin:10px auto 22px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#05070f;border:1px solid var(--gold);color:var(--goldlt);padding:9px 14px;border-radius:12px;font:800 15px var(--f-b);box-shadow:0 10px 30px #000a;animation:up .2s;max-width:90vw;text-align:center}
.grade{font:900 24px var(--f-d)}.gA{color:var(--upd)}.gB{color:#8fd0ff}.gC{color:var(--ivory)}.gD{color:#ffc58a}.gF{color:var(--dnd)}
.empty{text-align:center;color:var(--mut);padding:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.grid5 .mc .art{display:none}.grid5 .mc .nm{font-size:12px}.grid5 .mc .o{font-size:22px}.grid5 .mc .o.d3{font-size:19px}.grid5 .mc .sb{display:none}
.sheet .x{float:right;margin:0 0 6px 10px}

.sheet>.box{font-size:15px}.panel p{font-size:15px}

.art .jz{clip-path:polygon(18% 0,36% 0,50% 12%,64% 0,82% 0,100% 14%,88% 38%,88% 100%,12% 100%,12% 38%,0 14%)}.art .jz.lt{color:#1b2140;text-shadow:none}
.bc .art .jz{clip-path:none;border-radius:12px}.bc .art{background:var(--tc)}
.mc .nm .ln{display:none}.grid5 .mc .nm .fn{display:none}.grid5 .mc .nm .ln{display:inline}.grid5 .mc .nm{font-size:11px}
.days{grid-template-columns:repeat(6,minmax(0,1fr))}
.feat{grid-template-columns:104px 1fr;align-items:start}
.pk{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:10px}
.pk .btn{display:grid;justify-items:center;align-content:center;gap:1px;padding:9px 8px;font:800 16px var(--f-b);letter-spacing:0;text-transform:none}
.pk .btn b{font:900 21.5px/1 var(--f-d);letter-spacing:.04em}.pk .btn span{font:800 15px var(--f-b);display:flex;align-items:center;gap:4px}.pk .btn small{font:700 13px var(--f-b);opacity:.8}
.toast{bottom:auto;top:calc(env(safe-area-inset-top) + 64px)}
.ticker{align-content:start}
.gl summary{cursor:pointer;list-style:none}.gl summary::-webkit-details-marker{display:none}.gl summary::after{content:"＋";float:right;color:var(--mut)}.gl[open] summary::after{content:"－"}
.glist{display:grid;gap:10px;margin-top:10px}.glist b{font:900 18.5px var(--f-d);text-transform:uppercase;letter-spacing:.03em}.glist b span{color:var(--mut);font:700 14px var(--f-b);margin-left:4px}
.glist p{margin:2px 0;font-size:15px;color:#d9def0}.glist .gj{color:var(--goldlt)}
.unown{filter:saturate(.3) brightness(.78)}

/* live game card */

  const mk=p=>box[p.id+"|"+p.team]||(box[p.id+"|"+p.team]={id:p.id,team:p.team,name:p.name,num:p.num,pts:0,reb:0,ast:0,stl:0,blk:0,tov:0,fgm:0,fga:0,tpm:0,tpa:0,ftm:0,fta:0,min:0,clutchA:0,clutchM:0,pm:0});

  const basePoss=fmt==="3v3"?60:25.5;

    const late=q===nQ-1&&clock<=120&&Math.abs(margin)<=10;const frac=k/possPerQ;
    if(!late&&q===nQ-1&&Math.abs(margin)>=22&&frac>.4&&pl.length>=10)return pl.slice(5,10);
    let st=pl.slice(0,5);const bench=pl.slice(5,8);if(bench.length<3||late)return st;
    const stint=(nQ===4&&((q===0||q===2)&&frac>.62||(q===1||q===3)&&frac<.3))||(nQ===2&&(q===0&&frac>.7||q===1&&frac<.2));
    if(stint){const rk=[...st].sort((a,b)=>b.ovr-a.ovr);const firstHalfStint=(nQ===4&&(q===0||q===2))||(nQ===2&&q===0);const keep=firstHalfStint?rk.slice(0,2):rk.slice(2,4);st=[...keep,...bench]}
    return st}
  const offR=p=>Math.max(eff(p.R[0]),eff(p.R[1]))*.6+eff(p.R[2])*.15+eff(p.R[6])*.25;
  const GA=(A.pl.slice(0,5).reduce((s,p)=>s+p.ovr,0)+B.pl.slice(0,5).reduce((s,p)=>s+p.ovr,0))/Math.max(1,Math.min(5,A.pl.length)+Math.min(5,B.pl.length));const LV=clamp(GA-74,-25,25);

    for(let k=0;k<possPerQ*2;k++){

      const late=q===nQ-1&&clock<=120;const close=Math.abs(score[0]-score[1])<=6;
      const OP=onCourt(oi,q,k>>1,clock,score[oi]-score[di]),DP=onCourt(di,q,k>>1,clock,score[di]-score[oi]);

      const oS=sortH(OP),dS=sortH(DP);const matchOf=p=>dS[oS.indexOf(p)]||dS[0];
      const tO=T[oi],tD=T[di],tacO=TACTICS[tO.tactic]||{},tacD=TACTICS[tD.tactic]||{};
      const e={q,clock,o:oi,on:OP.map(p=>p.id),dn:DP.map(p=>p.id)};
      /* Lockdown / Clamps: who guards their best */
      const best=[...OP].sort((a,b)=>b.ovr-a.ovr)[0];const stopper=DP.find(p=>p.k==="D"||p.sig==="Clamps"||(p.sets.Lockdown));
      /* takeover */
      const tk=takeover[oi];if(!tk.used&&q===nQ-1&&nQ===4&&margin<0&&margin>=-12&&clock<480){const mvp=OP.find(p=>p.k==="M");if(mvp){tk.used=true;tk.left=7;tk.who=mvp;perkLog.push({t:oi,txt:"TAKEOVER: "+mvp.name,q,clock});ev.push({...e,type:"perk",txt:"TAKEOVER: "+mvp.name,who:mvp.id})}}

      let to=.125+(62-eff(bh.R[2]))*.0012+(avg(DP,3)-62)*.0013-(avg(OP,6)-62)*.0009+(tacO.to||0);
      if(OP.some(p=>p.bt.IQ===2))to*=.8;if(bh.sets.Handle)to*=.85;
      if(tD.gimmick==="runout"&&!OP.some(p=>p.bt.IQ))to*=1.08;
      to=clamp(to,.05,.22);
      if(rnd()<to){const thief=wpick(DP,p=>Math.pow(eff(p.R[3])+eff(p.R[5])*.5,2)*(p.sets.Thief?1.4:1));const stl=rnd()<.55;mk(bh).tov++;stat[oi].tov++;
        if(stl){mk(thief).stl++;const runout=thief.k==="D"||tD.gimmick==="runout"&&!bh.bt.IQ;
          if(runout&&rnd()<.6){score[di]+=2;mk(thief).pts+=2;mk(thief).fgm++;mk(thief).fga++;stat[di].fb+=2;if(thief.k==="D"){perkPts[di]+=2;perkLog.push({t:di,txt:"PICK-SIX: "+thief.name,q,clock})}
            ev.push({...e,type:"runout",who:thief.id,vic:bh.id,pts:2,s:[...score],txt:`${thief.name} steals it from ${bh.last} and finishes the run-out.`,perk:thief.k==="D"?"PICK-SIX":tD.gimmick==="runout"?"RUN-OUT":null});continue}
          ev.push({...e,type:"stl",who:thief.id,vic:bh.id,s:[...score],txt:`${thief.name} steals it from ${bh.last}.`})}
        else ev.push({...e,type:"to",who:bh.id,s:[...score],txt:`Turnover, ${bh.name}.`});

      else if(late&&close&&clock<=24){const m=OP.find(p=>p.k==="M");shooter=m||wpick(OP,p=>Math.pow(Math.max(5,p.ovr-38),2.6)*(p.k==="P"?1.5:1))}
      else shooter=wpick(OP,p=>Math.pow(Math.max(5,offR(p)-40),1.6)/(1+mk(p).fga/14)*(late&&p.k==="P"?1.4:1)*(p.sets.Spotlight?1.2:1));

      const type=rnd()<tr?3:rnd()<rimR?"rim":"mid";
      const rimProt=Math.max(...DP.map(p=>eff(p.R[3])*.6+eff(p.R[4])*.2+p.ht*.5-38));
      let pm;

      else pm=.41+(sS-LV-70)*.0036-(dD-LV-62)*.0022;

      pm+=(tacD.dmake||0);
      if(fast[oi]){pm+=.04+(OP.some(p=>p.bt.ATH===2)?.02:0);fast[oi]=0}
      const perkTags=[];

      if(DP.some(p=>p.sig==="Paint Patrol")&&type==="rim")pm-=.05;
      const film=shooter.bt.IQ;
      if(def===stopper&&shooter===best&&!film){pm-=def.sig==="Clamps"?.05:0;if(late){pm-=def.k==="D"||def.sig==="Clamps"?.15*(def.pk||1):0;if(def.sets.Lockdown)pm-=.12;if(def.k==="D"||def.sig==="Clamps"||def.sets.Lockdown)perkTags.push({t:di,txt:"LOCKDOWN: "+def.name})}}
      if(q===nQ-1&&shooter.k==="P"){pm+=.05*shooter.pk;if(late){pm+=.08*shooter.pk;perkTags.push({t:oi,txt:"PRIME TIME: "+shooter.name})}}
      if(late&&close&&clock<=24&&shooter.k==="M"){pm+=.10*shooter.pk;perkTags.push({t:oi,txt:"SPOTLIGHT: "+shooter.name})}
      if(tkOn===shooter){pm+=.06*shooter.pk}
      if(late&&shooter.sig==="Unstoppable"){pm+=.12*shooter.pk;perkTags.push({t:oi,txt:"UNSTOPPABLE: "+shooter.name})}
      if(late&&(shooter.sets.Closer))pm+=.10;
      if(shooter.sets["Heat Check"])pm+=.02*Math.min(3,heat[oi]);
      if(tO.gimmick==="heat"&&type===3)pm+=.05*Math.min(3,heat[oi]);
      if(tD.gimmick==="switch"&&shooter===best&&!film)pm-=.03;
      if(tD.gimmick==="read"&&lastType[oi]===type&&!film)pm-=.03;
      if(type===3&&shooter.sets.Shooter)pm+=.018*shooter.sets.Shooter;
      if(type==="rim"&&shooter.sets.Paint)pm+=.03*shooter.sets.Paint;
      if(late&&OP.some(p=>p.bt.PLY===2&&p!==shooter))pm+=.04;if(OP.some(p=>p.bt.PLY&&p!==shooter))pm+=.02;if(q===nQ-1&&shooter.bt.ATH)pm+=.015;
      if(tO.gimmick==="bully"&&type==="rim"){const big=sortH(DP).pop();if(big&&!big.bt.IQ)big.R[3]=Math.max(25,big.R[3]-.4)}
      if(fmt!=="3v3"&&tO.home)pm+=.008;

      const foul=type==="rim"?.15:type===3?.025:.05;const fouled=rnd()<foul*(shooter.bt.FIN?1.4:1);
      const made=rnd()<pm;
      if(late&&close){sb.clutchA++;if(made)sb.clutchM++}
      for(const pt of perkTags){perkLog.push({...pt,q,clock});}

      if(made){score[oi]+=pts;sb.pts+=pts;sb.fgm++;sb.fga++;if(pts===3){sb.tpm++;sb.tpa++;stat[oi].tpm++}if(type==="rim")stat[oi].paint+=2;heat[oi]++;
        if(perkTags.length&&perkTags[0].t===oi)perkPts[oi]+=pts;

          mk(blocker).blk++;ev.push({...e,type:"blk",who:shooter.id,def:blocker.id,shot:type,s:[...score],perk:tag&&perkTags[0].t===di?tag:null,txt:`${blocker.name} blocks ${shooter.last}.`})}

/* meta.js: save, collection, packs, progression, seasons, gyms */
const SAVEKEY="hoopsCards1";
let S=null;
function save(){try{if(S&&S.own){/* remember which player each card id is, so ids can be checked if the card list ever changes */S.ck=S.ck||{};for(const id in S.own)if(!S.ck[id])S.ck[id]=cardKey(+id);for(const id in S.ck)if(!S.own[id])delete S.ck[id]}localStorage.setItem(SAVEKEY,JSON.stringify(S))}catch(e){}}
function load(){try{const t=localStorage.getItem(SAVEKEY);if(t)S=JSON.parse(t)}catch(e){S=null}return S}
const COST={pull:50,pull10:450,gear:30,gear10:270};
const TEAMNAME=ti=>{const e=DB.t[ti].eras[DB.t[ti].eras.length-1];return e[2]+" "+e[3]};
const TEAMNICK=ti=>{const e=DB.t[ti].eras[DB.t[ti].eras.length-1];return e[3]};

const seasonLabel=y=>`${y}-${String((y+1)%100).padStart(2,"0")}`;
/* ---- pools ---- */
let POOL=null;
function buildPools(){POOL={byStar:{1:[],2:[],3:[],4:[],5:[]},byTeam:{},legends:[],fiveStar:[]};
  DB.c.forEach((c,i)=>{POOL.byStar[c.s].push(i);if(c.k==="L")POOL.legends.push(i);if(c.s===5)POOL.fiveStar.push(i);for(const t of DB.p[c.p][4]){(POOL.byTeam[t]=POOL.byTeam[t]||[]).push(i)}})}
function ties(i,ti){return DB.p[DB.c[i].p][4].includes(ti)}
/* ---- new game ---- */
function newGame(fr){S={v:1,fr,coins:500,own:{},roster:[],gear:{},pity:{p5:0,p4:0,p10:0,guar:false},season:null,gyms:{},banners:[],bossesBeaten:[],tactic:null,made:Date.now(),firstClears:{},log:[]};
  const pos=p=>/C/.test(p)&&!/^G/.test(p)?"C":/G/.test(p)&&!/^F/.test(p)?"G":"F";
  let cands=(POOL.byTeam[fr]||[]).filter(i=>DB.c[i].k==="R"&&DB.c[i].s===1);
  if(cands.length<20)cands=cands.concat((POOL.byTeam[fr]||[]).filter(i=>DB.c[i].k==="R"&&DB.c[i].s===2).sort((a,b)=>DB.c[a].o-DB.c[b].o).slice(0,20));
  cands=cands.sort(()=>rnd()-.5);const need={G:4,F:4,C:2},got=[],usedP=new Set();
  for(const g of["C","G","F"])for(const i of cands){if(got.length>=12)break;const c=DB.c[i];if(usedP.has(c.p))continue;if(pos(DB.p[c.p][1])===g&&got.filter(x=>pos(DB.p[DB.c[x].p][1])===g).length<need[g]){got.push(i);usedP.add(c.p)}}
  for(const i of cands){if(got.length>=12)break;if(!usedP.has(DB.c[i].p)){got.push(i);usedP.add(DB.c[i].p)}}
  for(const i of got)addCard(i,true);
  S.roster=autoLineup(got);newSeason();save()}
function blankOwn(i){const c=DB.c[i];return{lv:1,xp:0,st:c.s,j:0,gear:[null,null,null,null,null,null],stats:{s:{},x:{gp:0,pts:0},hi:{pts:0,reb:0,ast:0},td:0,clA:0,clM:0,aw:[],ms:[]},got:Date.now(),isNew:true}}
function addCard(i,quiet){const c=DB.c[i];if(S.own[i]){const o=S.own[i];if(o.j<5){o.j++;return{dup:true,j:o.j}}const xp=200*c.s;giveXP(i,xp);return{dup:true,xp}}
  /* same player, different card: fine, separate card */
  S.own[i]=blankOwn(i);if(quiet)S.own[i].isNew=false;return{dup:false}}
/* ---- ratings of owned cards ---- */
function cardR(i){return ownedRatings(i,S.own[i],S.gear)}
function cardOvr(i){return ovrOf(cardR(i).R)}
function maxLv(i){return MAXLV[S.own[i].st]}
function giveXP(i,x){const o=S.own[i];if(!o)return 0;let ups=0;o.xp+=x;while(o.lv<maxLv(i)&&o.xp>=xpNeed(o.lv)){o.xp-=xpNeed(o.lv);o.lv++;ups++}if(o.lv>=maxLv(i))o.xp=Math.min(o.xp,xpNeed(o.lv));return ups}
function feedValue(i){const o=S.own[i],c=DB.c[i];return Math.round(60*c.s*c.s*(1+(o.lv-1)/10)*(1+o.j*.5))}
function canEvolve(i){const o=S.own[i];return o.st<6&&o.lv>=maxLv(i)}
function evolveFodder(i){const o=S.own[i];return Object.keys(S.own).map(Number).filter(k=>k!==i&&!S.roster.includes(k)&&S.own[k].st>=Math.min(o.st,3))}
function evolve(i,fodder){const o=S.own[i];if(!canEvolve(i)||fodder.length<o.st)return false;for(const f of fodder.slice(0,o.st))removeCard(f);o.st++;return true}
function removeCard(i){const o=S.own[i];if(!o)return;for(const g of o.gear)if(g&&S.gear[g])S.gear[g].on=null;delete S.own[i];S.roster=S.roster.filter(x=>x!==i)}
function feed(target,list){let x=0;for(const f of list){if(f===target||S.roster.includes(f))continue;x+=feedValue(f);removeCard(f)}return giveXP(target,x)}
/* ---- lineup ---- */
const posG=p=>{const q=posList(p)[0];return q==null?"F":q<=1?"G":q===4?"C":"F"};
const posQ=i=>{const q=posList(DB.p[DB.c[i].p][1]);return q.length?q:[2]};
const fitD=(i,k)=>Math.min(...posQ(i).map(q=>Math.abs(q-k)));
function slotOvr(i,k,R){const pen=FITPEN[fitD(i,k)];return posOvr((R||cardR(i).R).map(v=>v-pen),k)}
/* best five in spot order: tries every way to fill PG-SG-SF-PF-C from the top 12 */
function bestFive(ids){const cand=[...new Set(ids)].filter(i=>S.own[i]).sort((a,b)=>cardOvr(b)-cardOvr(a)).slice(0,12);

/* reveal.js: pack opening. Low cards flip fast in a cascade. Every 3★ and up gets the spotlight:

const POSL=["PG","SG","SF","PF","C"];
function revealCards(res,title){
  const n=res.length,cs=res.map(r=>DB.c[r.id]);
  const big=k=>cs[k].s>=3||cs[k].k==="L"||cs[k].k==="M";
  const order=res.map((_,k)=>k).filter(big).sort((a,b)=>cs[a].s-cs[b].s||cs[a].o-cs[b].o);
  const ov=document.createElement("div");ov.className="pko";
  const tag=r=>r.dup?`<em class="dp">${r.j?"Dupe · J"+r.j:"Dupe · +"+r.xp+" XP"}</em>`:`<em class="nw">New</em>`;
  ov.innerHTML=`<div class="pkh"><div><span class="kick">${esc(title)}</span><b>${n} card${n>1?"s":""}</b></div><button class="btn sm dk" id="pkSkip">Skip</button></div>
   <div class="pkg ${n>5?"n10":""}">${res.map((r,k)=>`<div class="pf" data-k="${k}"><div class="fc"><div class="back h${Math.min(cs[k].s,5)}${big(k)?" glow":""}"><span>★</span></div><div class="front">${mcHTML(r.id,{act:"peek",noNew:true})}</div></div>${tag(r)}</div>`).join("")}</div>
   <div class="pkf"><button class="btn go" id="pkDone" style="width:100%;visibility:hidden">Done</button></div>
   <div class="spot" hidden></div>`;
  document.body.appendChild(ov);
  const $p=s=>ov.querySelector(s),slot=k=>ov.querySelector(`.pf[data-k="${k}"]`);
  let alive=true,skipAll=false,spotDone=null;
  const wait=ms=>new Promise(r=>{const t=setTimeout(r,ms);ov._t=t});
  const flipSlot=k=>slot(k).classList.add("open");
  async function run(){
    await wait(350);
    /* cascade the small ones */
    const small=res.map((_,k)=>k).filter(k=>!big(k));
    for(const k of small){if(!alive)return;flipSlot(k);if(!skipAll)await wait(n>5?110:220)}
    if(small.length&&order.length&&!skipAll)await wait(450);
    for(const k of order){if(!alive)return;if(skipAll){flipSlot(k);continue}await spotlight(k);flipSlot(k);await wait(200)}
    finish()}
  function finish(){if(!alive)return;res.forEach((_,k)=>flipSlot(k));$p("#pkSkip").style.visibility="hidden";const d=$p("#pkDone");d.style.visibility="visible";d.focus()}
  function reel(label,items,finalHTML,ms){
    const strip=[...items,finalHTML];
    return`<div class="reel"><small>${label}</small><div class="win"><div class="strip" style="--n:${strip.length-1};--ms:${ms}ms">${strip.map(x=>`<div>${x}</div>`).join("")}</div></div></div>`}
  function spotlight(k){return new Promise(resolve=>{
    const r=res[k],c=cs[k],p=DB.p[c.p];const top=Math.min(c.s,5);const legend=c.k==="L",mvp=c.k==="M";
    const sp=$p(".spot");sp.hidden=false;
    const rnd=a=>a[Math.floor(Math.random()*a.length)];
    const nClue=top>=5||legend||mvp?3:top===4?2:1;
    const teams=DB.t.map((_,i)=>i).filter(i=>i!==c.t);
    const yrs=[];for(let y=1980;y<=2026;y++)if(y!==c.y)yrs.push(y);
    const reels=[reel("Position",[...Array(9)].map(()=>rnd(POSL.filter(x=>x!==p[1].split("/")[0]))),esc(p[1]),1300)];
    if(nClue>=2)reels.push(reel("Team",[...Array(9)].map(()=>logoHTML(rnd(teams),34)),logoHTML(c.t,34),1500));
    if(nClue>=3)reels.push(reel("Season",[...Array(9)].map(()=>`'${String(rnd(yrs)+1).slice(2)}`),c.k==="K"?"'27":`'${String(c.y+1).slice(2)}`,1700));
    sp.innerHTML=`<div class="rays t1"></div><div class="stage">
      <div class="tierlab"><span class="st">★</span></div>
      <div class="bigback t1"><div class="shine"></div><span>★</span></div>
      <div class="reels">${reels.join("")}</div>
      <div class="flash"></div><div class="burst"></div>
      <p class="tap">Tap to skip</p></div>`;
    const back=sp.querySelector(".bigback"),rays=sp.querySelector(".rays"),lab=sp.querySelector(".tierlab");
    let done=false,stage="build";
    const setTier=t=>{back.className="bigback t"+t+(back.classList.contains("rumble")?" rumble":"");rays.className="rays t"+t;lab.innerHTML=`<span class="st">${"★".repeat(t)}</span>${t===5?`<b>${legend?"Legend":mvp?"MVP":c.k==="D"?"DPOY":c.k==="P"?"Prime":""}</b>`:""}`;lab.classList.remove("pop");void lab.offsetWidth;lab.classList.add("pop")};
    const T=[];const at=(ms,f)=>T.push(setTimeout(()=>{if(!done&&alive)f()},ms));
    function reveal(){if(done)return;done=true;T.forEach(clearTimeout);stage="shown";
      setTier(top);sp.querySelectorAll(".strip").forEach(s=>s.classList.add("go","now"));
      const fl=sp.querySelector(".flash");fl.classList.remove("on");void fl.offsetWidth;fl.classList.add("on");
      back.classList.remove("rumble");
      const bst=sp.querySelector(".burst");const col=top>=5||legend||mvp?["#f6dca0","#f0c060","#fff","#ffe9a8"]:top===4?["#c9b2ff","#a07cf0","#fff"]:["#9cc4ff","#4f8ff0","#fff"];
      bst.innerHTML=[...Array(top>=4?34:18)].map((_,i)=>{const a=i/(top>=4?34:18)*Math.PI*2+Math.random()*.3,d=120+Math.random()*(top>=4?160:90);return`<i style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--c:${col[i%col.length]};--r:${Math.random()*360}deg"></i>`}).join("");
      sp.querySelector(".stage").insertAdjacentHTML("beforeend",`<div class="land">${bigCardHTML(r.id)}<div class="ltag">${tag(r)}</div></div>`);
      sp.querySelector(".tap").textContent="Tap to continue";
      setTimeout(()=>{stage="ready"},450)}
    sp.onclick=()=>{if(stage==="build")reveal();else if(stage==="ready"){stage="out";sp.hidden=true;sp.innerHTML="";resolve()}};
    spotDone=()=>{done=true;T.forEach(clearTimeout);sp.hidden=true;sp.innerHTML="";resolve()};
    /* build: light climbs one tier at a time, each reel lands, then the rumble */
    let t=250;
    for(let s=2;s<=top;s++){const ss=s;at(t,()=>setTier(ss));t+=ss>=4?700:420}
    sp.querySelectorAll(".strip").forEach((s,i)=>{at(t,()=>s.classList.add("go"));t+=+s.style.getPropertyValue("--ms").replace("ms","")*.75})
    t+=250;

    at(t,reveal)})}
  $p("#pkSkip").onclick=()=>{skipAll=true;clearTimeout(ov._t);if(spotDone)spotDone();res.forEach((_,k)=>flipSlot(k));finish()};

/* game.js: playing games, recaps, reports, seasons, gyms, actions */
/* ---------- run a game of any kind ---------- */
function runGame(kind,mode,ctx){ctx=ctx||{};let A,B,fmt="full";const s=S.season;

  else if(kind==="boss"){const b=BOSSES[(s.n-1)%BOSSES.length];A=myTeam();B=bossTeam(b,tgt(s.n,48)+8)}
  else if(kind==="gym"){const gym=GYMS.find(g=>g.id===ctx.gym);const tier=gymTier(ctx.floor);fmt=tier===1?"3v3":tier===2?"half":"full";A=myTeam(ctx.ids);B=gymTeam(gym,ctx.floor)}
  else if(kind==="prac"){fmt="q";A=myTeam(ctx.ids);B=scaledTeam(teamRosterIds((S.fr+5)%30,77),A.ovr,{name:"Scout team",abbr:"SCT",color:"#5a6a8a"})}
  B.pl.forEach(p=>p.team=1);A.pl.forEach(p=>p.team=0);
  const res=simGame(A,B,{fmt});res.A=A;res.B=B;res.kind=kind;res.ctx=ctx;
  if(mode==="watch")watchGame(res,()=>finishGame(res));else finishGame(res)}
function finishGame(res){const kind=res.kind,s=S.season,won=res.score[0]>res.score[1];const out=applyGame(res,kind==="gym"?"gym":kind,res.ctx);out.drops=[];out.notes=[];
  if(kind==="reg"){s.stand[S.fr][won?0:1]++;s.stand[s.sched[s.g]][won?1:0]++;leagueRound(s.sched[s.g]);s.games.push({o:s.sched[s.g],s:res.score});s.g++;if(s.g>=48)startPlayoffs(out)}
  else if(kind==="po")playoffGame(res,won,out);
  else if(kind==="boss"&&won){S.bossesBeaten.push(s.n);out.bossWin=true}
  else if(kind==="gym"&&won){const gym=GYMS.find(g=>g.id===res.ctx.gym);out.drops=gymDrops(gym,res.ctx.floor);const key=gym.id+res.ctx.floor;if(!S.firstClears[key]){S.firstClears[key]=1;S.coins+=60+res.ctx.floor*20;out.coins+=60+res.ctx.floor*20;out.notes.push("First clear bonus")}S.gyms[gym.id]=Math.max(S.gyms[gym.id]||0,res.ctx.floor)}
  save();report(res,out)}
function startPlayoffs(out){const s=S.season;const st=standings();const top=st.slice(0,8);
  if(!top.includes(S.fr)){s.phase="done";S.banners.push({n:s.n,w:s.stand[S.fr][0],l:s.stand[S.fr][1],po:false,champ:false});seasonAwards(false);out.notes.push("Missed the playoffs. Season boss unlocked.");return}
  S.coins+=300;out.coins+=300;out.notes.push("Made the playoffs: +300 coins");
  const order=[0,7,3,4,1,6,2,5].map(k=>top[k]);s.po={br:order,round:0,w:0,l:0,out:false,champ:false,fin:{}};s.po.opp=poOpp();s.phase="po"}
function poOpp(){const po=S.season.po;const k=po.br.indexOf(S.fr);return po.br[k^1]}
function playoffGame(res,won,out){const s=S.season,po=s.po;if(won)po.w++;else po.l++;

  const has3=res.fmt==="3v3";
  const tOf=(e,k)=>has3?k/Math.max(1,ev.length)*qLen:(Math.min(e.q,nQ-1)*qLen+(qLen-(e.clock||0)))+(e.q>=nQ?60:0);
  const T=has3?qLen:nQ*qLen;ev.forEach((e,k)=>e.t=tOf(e,k));const tEnd=Math.max(T,...ev.map(e=>e.t));
  const DUR=res.fmt==="full"?9.5:res.fmt==="half"?6:4.5;
  const edge=A.ovr-B.ovr;const p0=winProb(0,T,T,edge);
  const top3=t=>[...t.pl].slice(0,has3?3:5).sort((a,b)=>b.ovr-a.ovr);
  const qLab=nQ===4?["1ST","HALF","3RD","FINAL"]:nQ===2?["HALF","FINAL"]:["FINAL"];
  const kind=res.kind==="reg"?`Game ${S.season.g+1} of 48`:res.kind==="po"?"Playoffs":res.kind==="boss"?"Season boss":res.kind==="gym"?"Gear gym":"Practice";
  const logo=t=>t.ti!=null?logoHTML(t.ti,40):`<span class="lgo" style="background:${t.color}"><b style="color:${lumOf(t.color)>.6?"#1b2140":"#fff"}">${esc(t.abbr)}</b></span>`;
  const ov=document.createElement("div");ov.className="sheet lvs";
  ov.innerHTML=`<div class="box lv">
   <div class="lvh"><span class="kick">${kind}</span><div class="lvm"><div>${logo(A)}<span><b>${esc(A.name)}</b><small>OVR ${A.ovr}</small></span></div><i>vs</i><div class="r"><span><b>${esc(B.name)}</b><small>OVR ${B.ovr}</small></span>${logo(B)}</div></div></div>
   <div class="lvp" id="lvTape"><span class="kick c">Tale of the tape</span><div class="tape"><div>${top3(A).map(p=>`<p><span>${esc(p.last)}</span><b>${p.ovr}</b></p>`).join("")}</div><div class="mid"><b>${A.ovr}</b><i>v</i><b>${B.ovr}</b></div><div class="r">${top3(B).map(p=>`<p><b>${p.ovr}</b><span>${esc(p.last)}</span></p>`).join("")}</div></div>
     <div class="fav ${p0>=.5?"up":"dn"}">${p0>=.5?"You're the favorite":"You're the underdog"} · ${Math.round(p0*100)}%</div></div>
   <div class="lvp"><span class="kick c" id="lvLab">TIP-OFF</span><div class="sc"><b id="lvA">0</b><i>–</i><b id="lvB">0</b></div>
     <div class="qs" id="lvQ" style="grid-template-columns:repeat(${qLab.length},1fr)">${qLab.map(l=>`<div><small>${l}</small><b>–</b></div>`).join("")}</div>
     <div class="ld"><p id="lvLA"><span class="sw" style="background:${A.color}"></span> ${esc(A.name)}</p><p id="lvLB"><span class="sw" style="background:${B.color}"></span> ${esc(B.name)}</p></div></div>
   <div class="lvp"><div class="row"><span class="kick">Win probability</span><span class="sp"></span><span class="wp ${p0>=.5?"up":"dn"}" id="lvWP">You ${Math.round(p0*100)}%</span></div>
     <svg viewBox="0 0 300 80" class="wpc" role="img" aria-label="Your win probability over the game"><line x1="0" x2="300" y1="40" y2="40" class="mid"/>${[...Array(nQ-1)].map((_,k)=>`<line x1="${(k+1)*300/nQ}" x2="${(k+1)*300/nQ}" y1="0" y2="80" class="qd"/>`).join("")}
     <path id="lvArea" class="ar" d=""/><polyline id="lvLine" points="" class="ln"/><circle id="lvDot" r="3.5" cx="0" cy="${80-p0*80}"/></svg></div>
   <p class="mom" id="lvMom">&nbsp;</p>
   <div class="row lvc"><div class="seg" style="flex:1"><button class="on" data-sp="1">1x</button><button data-sp="2">2x</button></div><button class="btn sm" id="lvSkip">Skip</button></div>
   <button class="btn go" id="lvDone" style="display:none;width:100%">See the recap</button></div>`;
  document.body.appendChild(ov);
  const $$=id=>ov.querySelector(id);let SPD=1,gt=0,last=performance.now(),started=false,ended=false,i=0;
  ov.querySelectorAll("[data-sp]").forEach(b=>b.onclick=()=>{SPD=+b.dataset.sp;ov.querySelectorAll("[data-sp]").forEach(x=>x.classList.toggle("on",x===b))});
  $$("#lvSkip").onclick=()=>{started=true;gt=tEnd+1};$$("#lvDone").onclick=()=>{ov.remove();done()};
  const pts={0:{},1:{}};const pl={};for(const t of[A,B])for(const p of t.pl)pl[p.id+"|"+p.team]=p;
  const wp=[[0,p0]];let sA=0,sB=0,qDone=0,lastLead=0;
  const X=t=>Math.min(300,t/T*300),Y=p=>80-p*80;
  function moment(t,cls){const m=$$("#lvMom");m.textContent=t;m.className="mom on "+(cls||"")}
  function leaders(){for(const s of[0,1]){const e=Object.entries(pts[s]).sort((a,b)=>b[1]-a[1])[0];if(!e)continue;const p=pl[e[0]+"|"+s];$$(s?"#lvLB":"#lvLA").innerHTML=`<span class="sw" style="background:${s?B.color:A.color}"></span> ★ ${esc(p?p.last:"")} <b>${e[1]}</b> PTS`}}
  function apply(e){if(e.type==="q"){if(qDone<qLab.length&&e.s){const box=$$("#lvQ").children[qDone];box.querySelector("b").textContent=`${e.s[0]}-${e.s[1]}`;box.classList.add("on");qDone++}return}
    if(e.s){sA=e.s[0];sB=e.s[1]}if(e.pts&&e.who!=null){const k=e.o;pts[k][e.who]=(pts[k][e.who]||0)+e.pts}
    if(e.type==="perk")moment(e.txt,"gold");else if(e.perk&&(e.type==="make"||e.type==="runout"))moment(`${e.perk}: ${(pl[e.who+"|"+e.o]||{}).last||""}`,"gold");
    const lead=Math.sign(sA-sB);if(lead&&lastLead&&lead!==lastLead&&e.t>T*.75)moment(lead>0?"You take the lead.":"They take the lead.",lead>0?"up":"dn");if(lead)lastLead=lead;
    {const raw=winProb(sA-sB,Math.max(0,T-e.t),T,edge),prev=wp[wp.length-1][1];wp.push([Math.min(e.t,T),prev*.65+raw*.35])}}
  function drawWP(){const pts2=wp.map(([t,p])=>`${X(t).toFixed(1)},${Y(p).toFixed(1)}`).join(" ");$$("#lvLine").setAttribute("points",pts2);
    const lp=wp[wp.length-1];$$("#lvArea").setAttribute("d",`M0,80 L${pts2.split(" ").join(" L")} L${X(lp[0]).toFixed(1)},80 Z`);
    $$("#lvDot").setAttribute("cx",X(lp[0]));$$("#lvDot").setAttribute("cy",Y(lp[1]));const pc=Math.round(lp[1]*100);$$("#lvWP").textContent=`You ${pc}%`;$$("#lvWP").className="wp "+(pc>=50?"up":"dn")}
  const clk=c=>`${Math.floor(c/60)}:${String(c%60).padStart(2,"0")}`;
  function frame(now){if(ended)return;const dt=Math.min(.1,(now-last)/1000);last=now;
    if(started){gt+=dt*SPD*tEnd/DUR;while(i<ev.length&&ev[i].t<=gt){apply(ev[i]);i++}
      $$("#lvA").textContent=sA;$$("#lvB").textContent=sB;leaders();drawWP();
      if(gt<T)$$("#lvLab").textContent=nQ===1?"LIVE":`Q${Math.min(nQ,Math.floor(gt/qLen)+1)} · ${clk(Math.max(0,Math.round(qLen-(gt%qLen))))}`;else if(gt>=T&&i<ev.length)$$("#lvLab").textContent="OVERTIME";
      if(i>=ev.length){finish();return}}
    requestAnimationFrame(frame)}
  function finish(){ended=true;sA=res.score[0];sB=res.score[1];$$("#lvA").textContent=sA;$$("#lvB").textContent=sB;$$("#lvLab").textContent="FINAL";
    wp.push([T,sA>sB?1:0]);drawWP();$$("#lvWP").textContent=sA>sB?"Won":"Lost";
    const best=s=>Object.values(res.box).filter(b=>b.team===s).sort((a,b)=>(b.pts+b.reb*.7+b.ast*.7)-(a.pts+a.reb*.7+a.ast*.7))[0];
    const col=(t,s)=>top3(t).map(p=>{const b=res.box[p.id+"|"+s]||{pts:0};return`<p><span>${esc(p.last)}</span><b>${b.pts}</b></p>`}).join("");
    ov.querySelector(".ld").outerHTML=`<div class="fin"><div><span class="kick">${esc(A.abbr)} pts</span>${col(A,0)}</div><div class="r"><span class="kick">${esc(B.abbr)} pts</span>${col(B,1)}</div></div>`;
    const won=sA>sB;moment(won?"Final. You win.":"Final. You lose.",won?"up":"dn");$$("#lvA").classList.toggle("w",won);$$("#lvB").classList.toggle("w",!won);
    ov.querySelector(".lvc").style.display="none";$$("#lvDone").style.display="block";$$("#lvDone").focus()}
  ov.querySelector("#lvTape").onclick=()=>{started=true};
  setTimeout(()=>{started=true},1800);
  requestAnimationFrame(frame)}

boot();
</script>
<script>const BUILD="b47a4c8dc0";
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{}));
/* auto-update: check for a newer build on launch and whenever the app comes back to the front; reload when nothing is open */
async function checkUpdate(){try{const r=await fetch("version.json?t="+Date.now(),{cache:"no-store"});if(!r.ok)return;const j=await r.json();if(j.v&&j.v!==BUILD){if(typeof SHEET!=="undefined"&&SHEET||document.querySelector(".lvs")){window._pendingUpdate=true;return}location.reload()}}catch(e){}}
addEventListener("load",()=>setTimeout(checkUpdate,1500));document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate()});setInterval(()=>{if(window._pendingUpdate&&!(typeof SHEET!=="undefined"&&SHEET)&&!document.querySelector(".lvs"))location.reload()},3000);
</script></body></html>
