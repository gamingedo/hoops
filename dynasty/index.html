</head><body><title>Hoops Dynasty</title>
<meta name="theme-color" content="#121a33">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800;900&family=Barlow:wght@500;600;700;800&family=Silkscreen&display=swap">
<style>/* single dark game look: twilight, ivory, gold */
:root{--tw:#121a33;--tw2:#0b1024;--dusk:#1d2747;--dusk2:#26325a;--line:#34416e;--ivory:#f6efe0;--seam:#e3d5b4;--ink:#2a2d48;--brown:#6d6656;--gold:#e2b660;--gold2:#b8893a;--goldlt:#f6dca0;--up:#2f7fd6;--upd:#6cb8ff;--dn:#c8641c;--dnd:#ffa24c;--mut:#9fb0d8;
  --r1:#9ba1b0;--r2:#3fb6a4;--r3:#4f8ff0;--r4:#a07cf0;--r5:#f0c060;
  --f-d:"Big Shoulders Display",Impact,"Arial Narrow",sans-serif;--f-b:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--f-p:"Silkscreen",ui-monospace,Menlo,monospace;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:radial-gradient(900px 600px at 70% -10%,#2c3a7a 0,transparent 60%),linear-gradient(180deg,var(--tw),var(--tw2));background-attachment:fixed;color:var(--ivory);font:500 16px/1.4 var(--f-b)}
button{font:inherit;color:inherit;cursor:pointer}
.app{max-width:560px;margin:0 auto;min-height:100vh;padding:0 max(12px,env(safe-area-inset-left)) calc(84px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-right))}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) max(12px,env(safe-area-inset-right)) 10px max(12px,env(safe-area-inset-left));margin:0 calc(-1 * max(12px,env(safe-area-inset-left))) 4px;background:#121a33;box-shadow:0 8px 16px -10px #000c}
.top h1{margin:0;font:900 24px/1 var(--f-d);letter-spacing:.04em;text-transform:uppercase}
.top h1 small{display:block;font:700 13px var(--f-b);letter-spacing:.12em;color:var(--mut)}
.coins{display:flex;align-items:center;gap:6px;background:#05070f;border:1px solid #2a3460;border-radius:999px;padding:5px 12px;font:800 16px var(--f-b);color:var(--goldlt)}
.coin{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3c4,#e2b660 55%,#a8782c);box-shadow:0 0 0 1px #7a5a22}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#070b18f2;border-top:1px solid #222c52;padding-bottom:env(safe-area-inset-bottom);backdrop-filter:blur(8px)}
.nav div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{background:none;border:0;padding:9px 0 10px;display:grid;justify-items:center;gap:3px;font:700 13px var(--f-b);letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--goldlt)}
.dot{position:relative}.dot::after{content:"";position:absolute;top:6px;right:calc(50% - 16px);width:8px;height:8px;border-radius:50%;background:var(--dnd)}
.panel{background:linear-gradient(180deg,#1b2446,#141b38);border:1px solid #2c386a;border-radius:16px;padding:14px;margin:10px 0}
.panel.iv{background:linear-gradient(180deg,#26305a,#18203f);color:var(--ivory);border-color:#e2b66070;box-shadow:inset 0 3px 0 var(--gold),0 10px 24px -14px #000}
.kick{font:700 13px var(--f-b);letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.iv .kick{color:var(--goldlt)}
h2{margin:2px 0 6px;font:900 28px/1.05 var(--f-d);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
h3{margin:0 0 6px;font:900 20.5px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.03em}
p{margin:6px 0}.mut{color:var(--mut)}.iv .mut{color:var(--mut)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.btn{appearance:none;border:1px solid #3a4777;background:#222c55;border-radius:12px;padding:10px 14px;font:800 16px var(--f-b);color:var(--ivory)}
.btn:active{transform:translateY(1px)}
.btn.go{border-color:#fff3d0;background:linear-gradient(180deg,#f8e3ad,var(--gold) 60%,#d4a04c);color:var(--ink);font:900 20.5px var(--f-d);letter-spacing:.06em;text-transform:uppercase;box-shadow:0 0 0 1px var(--gold2),0 6px 16px -8px #e2b66088}
.btn.ghost{background:transparent}.btn.sm{padding:6px 10px;font-size:15px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn:focus-visible,.nav button:focus-visible,.mc:focus-visible{outline:3px solid var(--upd);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{font:700 14px var(--f-b);padding:3px 9px;border-radius:999px;background:#ffffff12;border:1px solid #ffffff1c}
.chip.up{color:var(--upd)}.chip.dn{color:var(--dnd)}.chip.gold{color:var(--goldlt);border-color:#e2b66055}
.seg{display:flex;background:#0a0f22;border:1px solid #2a3460;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:7px 4px;font:800 15px var(--f-b);color:var(--mut)}
.seg button.on{background:#26325a;color:var(--ivory)}
/* mini card */
.mc{--t:var(--r1);position:relative;border:0;padding:2px;border-radius:12px;background:var(--t);text-align:left;color:var(--ivory);min-width:0}
.mc .in{border-radius:10px;background:linear-gradient(180deg,#1f2a50,#0d1228);padding:6px 6px 7px;display:grid;gap:3px;height:100%;min-width:0}
.mc .hd{display:flex;justify-content:space-between;align-items:flex-start;gap:4px}
.mc .o{font:900 24px/.9 var(--f-d);color:var(--t);padding-top:2px}.mc .o.d3{font-size:20px}.mc .o.hi{color:var(--goldlt)}
.mc .st{font:700 10px/1 var(--f-b);color:var(--t);letter-spacing:.04em;white-space:nowrap;overflow:hidden}
.art{position:relative;display:grid;place-items:center;flex:none;width:34px;height:30px;border-radius:7px;overflow:hidden;background:#0b1024}
.art .jz{width:100%;height:100%;display:grid;place-items:center;background:var(--tc,#335);font:900 14px var(--f-d);color:#fff;text-shadow:0 1px 0 #0006}
.art .jz.sm{font-size:10px;letter-spacing:.02em}
.art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 12%;background:#0b1024}
.mc .nm{font:900 13px/1.05 var(--f-d);text-transform:uppercase;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mc .sb{font:600 10px/1.2 var(--f-b);color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mc .sb b{color:var(--t);font-weight:800}
.mc.sel{outline:3px solid var(--upd);outline-offset:2px}
.mc .new{position:absolute;top:-5px;left:-5px;z-index:2;background:var(--dnd);color:#1b0f05;font:900 9px var(--f-b);padding:1px 5px;border-radius:6px;letter-spacing:.06em}
.s1{--t:var(--r1)}.s2{--t:var(--r2)}.s3{--t:var(--r3)}.s4{--t:var(--r4)}.s5{--t:var(--r5)}.s6{--t:#f6dca0}
.mc.kL{background:linear-gradient(135deg,#f6efe0,#e2b660,#f6efe0,#c8a24a)}.mc.kL .o{color:var(--goldlt)}
.mc.kM{background:linear-gradient(135deg,#f0c060,#fff1b8 40%,#d49a2a 60%,#f0c060)}
.grid5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;background:#03050ccc;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet>.box{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:linear-gradient(180deg,#1b2446,#0f1530);border:1px solid #2c386a;border-bottom:0;border-radius:20px 20px 0 0;padding:14px max(14px,env(safe-area-inset-left)) calc(20px + env(safe-area-inset-bottom));animation:up .2s}
.sheet .x{float:right;border:0;background:#ffffff14;border-radius:50%;width:34px;height:34px;font:800 19.5px var(--f-b)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.5}}
/* big card */
.bc{border-radius:18px;padding:3px;background:var(--t);margin:2px auto 12px;max-width:360px;clear:both}
.bc .in{border-radius:15px;background:linear-gradient(180deg,#1f2a50,#0b1024);padding:14px 16px 14px;display:grid;gap:6px}
.bc .bt2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.bc .bo b{display:block;font:900 69px/.82 var(--f-d);color:var(--t)}.bc .bo b.hi{color:var(--goldlt)}
.bc .bo span{display:block;margin-top:6px;font:700 13px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
.bc .art{width:132px;height:100px;border-radius:12px}.bc .art .jz{font-size:40px}.bc .art .jz.sm{font-size:26px}
.bc .tg{font:800 14px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--t);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.bc .stars{letter-spacing:.06em}.bc .evo,.bc .now{font:700 12px var(--f-b);letter-spacing:.08em;color:var(--mut);border:1px solid #ffffff26;border-radius:6px;padding:1px 6px}
.bc .nm{font:900 32.5px/1 var(--f-d);text-transform:uppercase;letter-spacing:.01em}
.bc .sub{font:700 15px var(--f-b);color:var(--mut)}
.bc .bl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:4px;padding:8px 0 0;border-top:1px solid #ffffff14;font:700 12px var(--f-b);letter-spacing:.08em;color:var(--mut);text-align:center}
.bc .bl b{display:block;font:900 21.5px/1 var(--f-d);color:var(--ivory);letter-spacing:.01em;margin-bottom:2px}.bc .bl span:only-child{grid-column:1/-1;font-size:14px}
.bc.kL{background:linear-gradient(135deg,#f6efe0,#e2b660,#f6efe0,#c8a24a)}.bc.kM{background:linear-gradient(135deg,#f0c060,#fff1b8 40%,#d49a2a 60%,#f0c060)}
.stamp{display:inline-block;border:1.5px solid var(--goldlt);color:var(--goldlt);border-radius:6px;padding:0 6px;font:900 13px/1.6 var(--f-d);letter-spacing:.1em}
.bars{display:grid;gap:9px}
.bar{display:grid;grid-template-columns:92px 1fr 40px;gap:10px;align-items:center;font:700 15px var(--f-b)}
.bar i{height:8px;border-radius:4px;background:#ffffff14;overflow:hidden;display:block}.bar i b{display:block;height:100%;border-radius:4px}
.bar em{font-style:normal;text-align:right;font:900 19.5px/1 var(--f-d);font-variant-numeric:tabular-nums}
.bar em.hi{color:var(--goldlt)}
.bts{margin-top:12px;padding-top:10px;border-top:1px solid #ffffff14}.bts ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:6px;font:500 15px/1.35 var(--f-b);color:#d9def0}.bts b{color:var(--goldlt);font-weight:800}
.xpb{height:8px;border-radius:4px;background:#ffffff14;overflow:hidden}.xpb b{display:block;height:100%;background:linear-gradient(90deg,#6cb8ff,#a07cf0)}
.pips{display:flex;gap:4px}.pips i{width:16px;height:16px;border-radius:4px;background:#ffffff14;display:grid;place-items:center;font:800 11px var(--f-b);font-style:normal}.pips i.on{background:var(--gold);color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.slot{border:1px dashed #3a4777;border-radius:10px;padding:7px;background:#0a0f22;text-align:left;min-height:56px}
.slot b{display:block;font:800 14px var(--f-b)}.slot small{display:block;font:600 13px var(--f-b);color:var(--mut)}
.slot.f{border-style:solid;border-color:var(--rc,#3a4777)}
table.box{width:100%;border-collapse:collapse;font:600 14px var(--f-b)}
table.box th{font:700 12px var(--f-b);letter-spacing:.08em;color:var(--mut);text-align:right;padding:4px 3px;border-bottom:1px solid #2c386a}
table.box td{text-align:right;padding:5px 3px;border-bottom:1px solid #ffffff0d;font-variant-numeric:tabular-nums}
table.box th:first-child,table.box td:first-child{text-align:left}

/* scoreboard and court */
.sbd{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;background:#05070f;border:1px solid #2a3460;border-radius:12px;padding:8px 12px}
.sbd .tm b{font:900 34.5px/1 var(--f-d)}.sbd .tm small{display:flex;gap:6px;align-items:center;font:800 14px var(--f-b);letter-spacing:.08em;color:var(--mut)}.sbd .tm.r{text-align:right}.sbd .tm.r small{justify-content:flex-end}
.sbd .mid{text-align:center}.sbd .mid b{font:400 15px var(--f-p);color:var(--goldlt)}.sbd .mid small{display:block;font:700 12px var(--f-b);color:var(--mut);letter-spacing:.08em}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.court{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;border:1px solid #2a3460}
.court canvas{display:block;width:100%;height:auto}
.banner{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.9);font:900 clamp(22px,7vw,34px)/1 var(--f-d);letter-spacing:.05em;text-transform:uppercase;color:var(--goldlt);text-shadow:0 3px 0 #0b1024,0 0 18px #000;opacity:0;transition:.2s;pointer-events:none;text-align:center;white-space:nowrap}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}.banner.good{color:#9cc8ff}.banner.bad{color:var(--dnd)}
.ticker{margin-top:8px;max-height:30vh;overflow:auto;display:grid;gap:4px}
.tk{display:grid;grid-template-columns:52px 1fr auto;gap:8px;font:600 15px var(--f-b);padding:5px 8px;border-radius:8px;background:#ffffff08}
.tk .c{font:400 12px var(--f-p);color:var(--mut);padding-top:2px}.tk .s{font:800 14px var(--f-b);color:var(--mut)}
.tk.me{border-left:3px solid var(--upd)}.tk.them{border-left:3px solid var(--dnd)}.tk.perk{background:#e2b6601f;color:var(--goldlt)}.tk.q{background:none;color:var(--mut);font-weight:800}
/* reveal */
.reveal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:420px){.reveal{grid-template-columns:repeat(4,minmax(0,1fr))}}
.flip{perspective:600px}.flip .fc{transition:transform .45s;transform-style:preserve-3d;position:relative}.flip.open .fc{transform:rotateY(180deg)}
.flip .back,.flip .front{backface-visibility:hidden}.flip .front{transform:rotateY(180deg)}
.flip .back{position:absolute;inset:0;border-radius:12px;background:repeating-linear-gradient(45deg,#26325a 0 6px,#1d2747 6px 12px);border:2px solid #3a4777;display:grid;place-items:center;font:900 21.5px var(--f-d);color:#3a4777}
.flip .back.h5{box-shadow:0 0 18px 4px #f0c060aa;border-color:#f0c060}.flip .back.h4{box-shadow:0 0 14px 2px #a07cf0aa;border-color:#a07cf0}
.list{display:grid;gap:6px}
.li{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:12px;background:#ffffff08;border:1px solid #ffffff10;text-align:left;width:100%;color:inherit}
.li .sp{min-width:0}.li b{display:block;font:800 15px var(--f-b)}.li small{display:block;color:var(--mut);font:600 14px var(--f-b)}
.gem{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font:900 14px var(--f-d);color:#0b1024;flex:none}
.floor{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.floor button{border:1px solid #3a4777;background:#0a0f22;border-radius:10px;padding:8px 0;font:900 19.5px var(--f-d)}
.floor button.cl{background:#1f3a6a;border-color:#4f8ff0}.floor button.lk{opacity:.35}.floor button.boss{border-color:var(--gold);color:var(--goldlt)}
.feat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.days{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin-top:8px}
.days div{background:#0a0f22;border:1px solid #2a3460;border-radius:9px;padding:5px 3px;text-align:center;font:700 10px var(--f-b);color:var(--mut)}.days div b{display:block;font:900 12px var(--f-d);color:var(--ivory);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.teamgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.teamgrid button{border:1px solid #2a3460;background:#0e1430;border-radius:12px;padding:10px 6px;display:grid;justify-items:center;gap:6px;font:800 15px var(--f-b)}
.teamgrid button i{width:28px;height:28px;border-radius:8px}
.teamgrid button small{font:600 12px var(--f-b);color:var(--mut)}
.title{min-height:90vh;display:grid;place-items:center;text-align:center}
.title h1{font:900 clamp(44px,13vw,72px)/.9 var(--f-d);letter-spacing:.03em;margin:0;text-transform:uppercase;background:linear-gradient(180deg,#fff6dc,#e2b660 70%,#b8893a);-webkit-background-clip:text;background-clip:text;color:transparent}
.title p{color:var(--mut);max-width:30ch;margin:10px auto 22px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#05070f;border:1px solid var(--gold);color:var(--goldlt);padding:9px 14px;border-radius:12px;font:800 15px var(--f-b);box-shadow:0 10px 30px #000a;animation:up .2s;max-width:90vw;text-align:center}
.grade{font:900 24px var(--f-d)}.gA{color:var(--upd)}.gB{color:#8fd0ff}.gC{color:var(--ivory)}.gD{color:#ffc58a}.gF{color:var(--dnd)}
.empty{text-align:center;color:var(--mut);padding:20px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}


.grid5 .mc .art{display:none}.grid5 .mc .nm{font-size:12px}.grid5 .mc .o{font-size:22px}.grid5 .mc .o.d3{font-size:19px}.grid5 .mc .sb{display:none}
.sheet .x{float:right;margin:0 0 6px 10px}

.sheet>.box{font-size:15px}.panel p{font-size:15px}

.art .jz{clip-path:polygon(18% 0,36% 0,50% 12%,64% 0,82% 0,100% 14%,88% 38%,88% 100%,12% 100%,12% 38%,0 14%)}.art .jz.lt{color:#1b2140;text-shadow:none}
.bc .art .jz{clip-path:none;border-radius:12px}.bc .art{background:var(--tc)}
.mc .nm .ln{display:none}.grid5 .mc .nm .fn{display:none}.grid5 .mc .nm .ln{display:inline}.grid5 .mc .nm{font-size:11px}
.days{grid-template-columns:repeat(6,minmax(0,1fr))}
.feat{grid-template-columns:104px 1fr;align-items:start}
.pk{display:grid;grid-template-columns:1fr 1.4fr;gap:8px;margin-top:10px}
.pk .btn{display:grid;justify-items:center;align-content:center;gap:1px;padding:9px 8px;font:800 16px var(--f-b);letter-spacing:0;text-transform:none}
.pk .btn b{font:900 21.5px/1 var(--f-d);letter-spacing:.04em}.pk .btn span{font:800 15px var(--f-b);display:flex;align-items:center;gap:4px}.pk .btn small{font:700 13px var(--f-b);opacity:.8}
.toast{bottom:auto;top:calc(env(safe-area-inset-top) + 64px)}
.ticker{align-content:start}
.gl summary{cursor:pointer;list-style:none}.gl summary::-webkit-details-marker{display:none}.gl summary::after{content:"＋";float:right;color:var(--mut)}.gl[open] summary::after{content:"－"}
.glist{display:grid;gap:10px;margin-top:10px}.glist b{font:900 18.5px var(--f-d);text-transform:uppercase;letter-spacing:.03em}.glist b span{color:var(--mut);font:700 14px var(--f-b);margin-left:4px}
.glist p{margin:2px 0;font-size:15px;color:#d9def0}.glist .gj{color:var(--goldlt)}
.unown{filter:saturate(.3) brightness(.78)}

/* live game card */

.pager{display:flex;align-items:center;justify-content:center;gap:14px;margin:-4px 44px 6px;font:700 12px var(--f-b);letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
.pager button{width:36px;height:30px;border-radius:10px;border:1px solid #2c386a;background:#ffffff0d;color:var(--ivory);font:900 20px/1 var(--f-b)}.pager button:disabled{opacity:.3}
@keyframes slL{from{transform:translateX(40%);opacity:.3}}@keyframes slR{from{transform:translateX(-40%);opacity:.3}}

.rv .seg.sm button{padding:6px 9px;font-size:14px}.rvo{font:700 14px var(--f-b);color:var(--mut);white-space:nowrap}.rvo b{font:900 21.5px var(--f-d);color:var(--ivory)}.rvo b.up{color:var(--upd)}
.bar em .dl{display:block;font:800 12px var(--f-b);color:var(--upd);margin-top:1px}

.bxw{overflow:visible;margin:0}.bxw table.box{min-width:0;font-size:13.5px;table-layout:auto}.bxw table.box td:first-child{max-width:84px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv .seg.sm button{white-space:nowrap;padding:6px 10px}
.tiles b{font-size:clamp(11px,3.3vw,15px);letter-spacing:0;text-overflow:clip}.tiles button{padding:12px 2px}

/* power up list */
.pwl{display:grid;gap:8px}
.pw{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;text-align:left;border:1px solid #2c386a;background:linear-gradient(180deg,#1b2446,#141b38);border-radius:14px;padding:8px;color:var(--ivory)}
.pwc{display:block;pointer-events:none}.pwi{display:grid;gap:5px;min-width:0}
.pwi>b{font:900 19.5px/1 var(--f-d);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwr{display:flex;flex-wrap:wrap;gap:4px 10px;font:800 14px var(--f-b);color:var(--mut)}.pwr small{font-weight:600}
.pwi .xpb{display:block;height:6px}.pwi em{font:700 14px var(--f-b);font-style:normal;color:var(--mut)}.pwi em.evr{color:var(--goldlt)}.pwi em.mx{color:var(--upd)}
.top h1 .back{border:0;background:#ffffff14;border-radius:50%;width:32px;height:32px;margin-right:8px;font:800 21.5px/1 var(--f-b);color:var(--ivory);vertical-align:middle}
.libbtn{width:100%;margin:0 0 10px}

table.box.ctr th,table.box.ctr td{text-align:center}

.grid4 .mc .art{width:40px;height:35px}
/* bigger cards: three across in collections and pickers; the lineup bench stays four so it fits without scrolling */
.grid4{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
.grid4.dz{grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}
.grid4:not(.dz) .mc .in{padding:8px 8px 9px;gap:4px}
.grid4:not(.dz) .mc .o{font-size:32px}.grid4:not(.dz) .mc .o.d3{font-size:27px}
.grid4:not(.dz) .mc .art{width:56px;height:48px;border-radius:9px}
.grid4:not(.dz) .mc .st{font-size:12px}
.grid4:not(.dz) .mc .nm{font-size:16px}
.grid4:not(.dz) .mc .sb{font-size:12px}
.grid4:not(.dz) .mc .new{font-size:10px}
.grid5 .mc .nm{font-size:13px}.grid5 .mc .o{font-size:25px}
.tiles b{font-size:clamp(12px,3.6vw,16px)}.tiles small{font-size:12px}
.pko .pkg .mc .o{font-size:22px}
@media (max-width:360px){.grid4:not(.dz) .mc .o{font-size:26px}.grid4:not(.dz) .mc .art{width:46px;height:40px}}
/* use the height: bigger court and jerseys on Team, bigger featured card and pack buttons on Packs */
.court5{height:clamp(236px,36vh,330px)}
.cp{width:84px}.cp .jsy{width:58px;height:64px}.cp b{font-size:14px;max-width:96px}.cp span{font-size:13px;padding:3px 7px}

.feat{grid-template-columns:128px minmax(0,1fr)}.feat h2{font-size:26px}
.pk .btn{padding:14px 8px}.pk .btn b{font-size:26px}

/* Team screen fills the phone: the court takes whatever height is left */
.app.v-team{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.v-team .five{flex:1 1 auto;display:flex;flex-direction:column;margin-bottom:10px}
.v-team .court5{flex:1 1 auto;height:auto;min-height:236px}
.cp{width:88px}.cp .jsy{width:62px;height:68px}.cp b{font-size:15px;max-width:100px}.cp span{font-size:14px;padding:3px 7px}
.lead{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:2px 0 8px}
.lead button{display:grid;justify-items:center;gap:1px;padding:8px 4px;border-radius:12px;border:1px solid #2c386a;background:#0a0f22;color:var(--ivory)}
.lead small{font:700 11px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}.lead b{font:900 26px/1 var(--f-d);font-variant-numeric:tabular-nums}.lead span{font:800 13px var(--f-b);color:var(--goldlt);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-team .tiles{margin-bottom:6px}.tiles button{padding:16px 2px}
.feat{grid-template-columns:128px minmax(0,1fr)}.feat h2{font-size:26px}
.pk .btn{padding:14px 8px}.pk .btn b{font-size:26px}

/* pack results: rows of four (10 cards = 4, 4, 2), bigger cards */
.pkg,.pkg.n10{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:10px}
.pkg .pf{width:calc((100% - 30px)/4)}
.pkg:has(.pf:only-child) .pf{width:46%}
.pkg .mc .in{padding:7px 7px 8px}
.pko .pkg .mc .o{font-size:27px}.pko .pkg .mc .o.d3{font-size:23px}
.pkg .mc .art{width:42px;height:37px}
.pkg .mc .nm{font-size:14px}.pkg .mc .sb,.pkg .mc .st{font-size:11px}
.pkg:has(.pf:only-child) .mc .o{font-size:40px}.pkg:has(.pf:only-child) .mc .art{width:66px;height:58px}.pkg:has(.pf:only-child) .mc .nm{font-size:20px}.pkg:has(.pf:only-child) .mc .sb{font-size:13px}
/* the photo or jersey never pushes past the card's edge */
.mc .hd{min-width:0}.mc .hd .art{flex:0 1 auto;min-width:0;max-width:58%}

/* gear slots on a card: three across, icon, name and what's in it, all centered */
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:grid;justify-items:center;align-content:center;gap:3px;text-align:center;min-height:108px;padding:12px 6px;border-radius:14px;color:var(--ivory)}
.slot .sli{width:30px;height:30px;color:var(--mut);margin-bottom:2px}.slot.f .sli{color:var(--rc)}
.slot b{font:900 18px/1.05 var(--f-d);text-transform:uppercase;letter-spacing:.02em;max-width:100%;overflow-wrap:anywhere}
.slot small{font:700 13px/1.2 var(--f-b);color:var(--mut);max-width:100%;overflow-wrap:anywhere}

/* live card: points live in the tape rows; one fixed slot for controls or the recap button */
.tape p{display:grid;grid-template-columns:minmax(0,1fr) 24px 28px;gap:4px;align-items:baseline;margin:1px 0;font:700 15px/1.35 var(--f-b)}
.tape .r p{grid-template-columns:28px 24px minmax(0,1fr)}
.tape p em{font-style:normal;font-weight:700;font-size:13px;color:var(--mut);text-align:right;font-variant-numeric:tabular-nums}
.tape .r p em{text-align:left}
.tape p b.pt{color:var(--ivory);text-align:right;font-variant-numeric:tabular-nums}.tape .r p b.pt{text-align:left}
.tape .r p span{text-align:right}
.tape p.lead1 span,.tape p.lead1 b.pt{color:var(--goldlt)}
.tape p.th{font:700 10px var(--f-b);letter-spacing:.1em;color:var(--mut);margin-bottom:2px}.tape p.th b,.tape p.th em{color:var(--mut);font-size:10px}
.lvc{margin-top:auto;min-height:56px;display:flex;align-items:center}
.lvc .btn.go{min-height:52px}
.rays.t5{opacity:.3;animation-duration:14s}

.tape{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.tape p span{font-size:14.5px}
.tape p.th span{font:800 11px var(--f-b);letter-spacing:.1em;color:var(--goldlt)}
.lv{gap:7px}

/* the chart grows to fill the card; lines keep their thickness when it stretches */
.lv .wpp{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.lv .wpp .wpc{flex:1 1 auto;min-height:90px;height:100%}
.wpc .ln,.wpc .mid,.wpc .qd{vector-effect:non-scaling-stroke}
.wpc .dot{fill:none;stroke:#fff;stroke-width:8;stroke-linecap:round;vector-effect:non-scaling-stroke}
.lv .mom{margin:0}

/* every pop-up is one size (the screen below the notch), so switching tabs or content never moves it */
.sheet>.box{height:calc(100dvh - env(safe-area-inset-top) - 8px)}
.lvs>.box{height:100dvh}
.sheet.still,.sheet.still>.box{animation:none}

/* ---------- gear art: the item inside a halo in its rarity color ---------- */
.ga{position:relative;display:inline-grid;place-items:center;flex:none;border-radius:50%;
  background:radial-gradient(circle at 50% 55%,color-mix(in srgb,var(--rc) 42%,transparent) 0,color-mix(in srgb,var(--rc) 14%,transparent) 55%,transparent 72%);
  box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 75%,transparent),0 0 14px -2px color-mix(in srgb,var(--rc) 60%,transparent)}
.ga svg{width:76%;height:76%;overflow:visible}
.ga .b{fill:#eef1fb;stroke:#0b1024;stroke-width:1.6;stroke-linejoin:round}
.ga .a{fill:var(--rc);stroke:#0b1024;stroke-width:1.6;stroke-linejoin:round}
.ga .ln{fill:none;stroke:var(--rc);stroke-width:2.6;stroke-linecap:round}
.ga .ln2{fill:none;stroke:#0b1024;stroke-width:1.8;stroke-linecap:round}
.ga.r3,.ga.r4{animation:halo 3.2s ease-in-out infinite}
@keyframes halo{50%{box-shadow:inset 0 0 0 2px var(--rc),0 0 22px 2px color-mix(in srgb,var(--rc) 65%,transparent)}}
.ga .en{position:absolute;right:-5px;bottom:-4px;font:900 12px/1 var(--f-d);font-style:normal;background:#0b1024;border:1.5px solid var(--rc);border-radius:6px;padding:2px 4px;color:var(--ivory)}
.li .ga{margin-right:2px}
/* gear in the pack grid: a tile the same size as a card */
.gtile{width:100%;height:100%;display:grid;justify-items:center;align-content:center;gap:2px;padding:10px 4px 9px;border-radius:12px;border:2px solid var(--rc);background:linear-gradient(180deg,#1f2a50,#0d1228);color:var(--ivory);text-align:center}
.gtile b{font:900 15px/1.05 var(--f-d);text-transform:uppercase;margin-top:5px;max-width:100%;overflow-wrap:anywhere}
.gtile small{font:700 11px/1.2 var(--f-b);color:var(--mut);max-width:100%}
.gtile small.ms{color:var(--rc);font-weight:800}
/* the big gear card in the spotlight */
.bg{border-radius:18px;padding:3px;background:var(--rc);max-width:340px;margin:0 auto;width:100%;box-shadow:0 0 50px 8px color-mix(in srgb,var(--rc) 40%,transparent)}
.bg .in{border-radius:15px;background:linear-gradient(180deg,#1f2a50,#0b1024);padding:20px 16px;display:grid;justify-items:center;gap:6px;text-align:center}
.bg .tg{font:800 12px var(--f-b);letter-spacing:.12em;text-transform:uppercase;color:var(--rc);margin-top:8px}
.bg .nm{font:900 32px/1 var(--f-d);text-transform:uppercase}
.bg .sub{font:700 14px var(--f-b);color:var(--mut)}
.bg .gst{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}.bg .gst span{font:800 14px var(--f-b);padding:4px 10px;border-radius:999px;background:#ffffff10;border:1px solid #ffffff1c}.bg .gst b{color:var(--rc)}
.tierlab .st.gr{font-size:30px;letter-spacing:.12em;text-transform:uppercase;text-shadow:0 0 16px currentColor}

/* front page */
.tacrow{display:flex;align-items:center;gap:10px;width:100%;margin:0 0 10px;padding:10px 12px;border-radius:12px;border:1px solid #2c386a;background:#0a0f22;color:var(--ivory);text-align:left}
.tacrow .kick{margin:0}.tacrow b{flex:1;font:900 18px/1 var(--f-d);text-transform:uppercase;letter-spacing:.02em}.tacrow i{font:700 13px var(--f-b);font-style:normal;color:var(--upd)}
.court5{cursor:pointer;-webkit-tap-highlight-color:transparent}.court5:active{filter:brightness(1.06)}
.cedit{position:absolute;right:8px;bottom:8px;font:800 13px var(--f-b);color:#1b2140;background:#fff8ecdd;border-radius:999px;padding:4px 10px;box-shadow:0 2px 6px #0005}
.cp{pointer-events:none}
.topr{display:flex;align-items:center;gap:8px}
.hmore{width:38px;height:38px;border-radius:50%;border:1px solid #2a3460;background:#05070f;color:var(--mut);display:grid;place-items:center;padding:0}.hmore svg{width:20px;height:20px}.hmore.on{color:var(--goldlt);border-color:var(--gold2)}
.libbtn,.prac{width:100%;margin:0 0 10px}.chev{font:900 26px/1 var(--f-d);font-style:normal;color:var(--mut)}
.prac{display:flex;align-items:center;gap:10px;text-align:left}
/* League tab */
.lg{margin-top:10px}
.gr{display:grid;grid-template-columns:26px 22px 30px minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 2px;border-bottom:1px solid #ffffff0d}
.gr:last-child{border-bottom:0}.gr .gn{font:800 13px var(--f-b);color:var(--mut);text-align:right}.gr .ha{font:700 12px var(--f-b);color:var(--mut)}
.gr b{font:900 17px var(--f-d);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gr .res{font:800 14px var(--f-b);font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap}.gr .res i{font-style:normal;font-weight:900;margin-right:4px}
.gr.w .res i{color:var(--upd)}.gr.l .res i{color:var(--dnd)}.gr.cur{background:#ffffff0a;border-radius:10px}.gr.cur .res{color:var(--goldlt)}
.gr.po{grid-template-columns:30px minmax(0,1fr) auto;margin-top:6px;background:#ffffff0a;border-radius:10px}
table.box.st td,table.box.st th{padding:7px 4px;font-size:14px}table.box.st tr.me td{color:var(--upd);font-weight:800}table.box.st tr.cut td{border-top:2px solid #e2b66066}
.tst{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:8px;text-align:center}.tst b{display:block;font:900 26px/1 var(--f-d);font-variant-numeric:tabular-nums}.tst small{font:700 11px var(--f-b);letter-spacing:.1em;text-transform:uppercase;color:var(--mut)}
table.box.ps td,table.box.ps th{padding:7px 3px;font-size:14px}
.lnk2{background:none;border:0;padding:0;color:var(--ivory);font:800 14px var(--f-b);text-align:left;cursor:pointer}
.hr{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ffffff0d}.hr:last-child{border-bottom:0}.hr b{flex:1;font:800 15px var(--f-b)}.hr span{font:800 14px var(--f-b);color:var(--mut)}.hr i{font:800 13px var(--f-b);font-style:normal;color:var(--mut)}.hr i.gold{color:var(--goldlt)}

/* Skip stays reachable while a big pull is in the spotlight */
.pko .pkh{position:relative;z-index:3}

/* front page fits one screen: compact last-10, tighter matchup, the court takes what's left */
.l10t{margin:0}.l10t b{color:var(--ivory)}
.ng .vs{margin:6px 0 8px}
.tacrow{padding:8px 12px;margin-bottom:8px}
.v-team .court5{min-height:190px}
.lead{margin:2px 0 4px}.lead button{padding:6px 4px}.lead b{font-size:24px}
.v-team .five{margin-bottom:6px}
/* gear tiles: two lines kept for the name so every tile in a pack is the same height */
.gtile b{min-height:2.1em;display:flex;align-items:center;justify-content:center;line-height:1.05}
.pkg{align-items:stretch}.pf{grid-template-rows:1fr auto}.pf .fc,.pf .front{height:100%}

.cedit{top:8px;bottom:auto}
.v-team .cp .jsy{width:56px;height:61px}

.autog{display:flex;align-items:center;gap:10px;margin:0 0 10px}.autog span{font:600 13px var(--f-b);color:var(--mut)}

/* ---------- Gyms map ---------- */
.app.v-gyms{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.gmap{flex:1 1 auto;min-height:420px;position:relative;margin:2px 0 8px;border-radius:18px;overflow:hidden;background:linear-gradient(#0d2d55,#0a1f3d);box-shadow:inset 0 0 0 1px #2a3460}
.gsvg{position:absolute;inset:0;width:100%;height:100%;display:block}
.gsvg .wave{fill:none;stroke:#ffffff16;stroke-width:2;stroke-linecap:round}
.gsvg .road{fill:none;stroke:#f3e3c0;stroke-opacity:.6;stroke-width:4;stroke-dasharray:1 9;stroke-linecap:round}
.gsvg .ml{font:900 20px "Big Shoulders Display",Impact,sans-serif;fill:#fff6dc;stroke:#0b1024;stroke-width:4.5px;paint-order:stroke;text-anchor:middle;letter-spacing:.02em}
.gsvg .ml.big{font-size:22px;fill:#f6dca0}
.gsvg .ms2{font:800 13px Barlow,system-ui,sans-serif;fill:#fff6dc;stroke:#0b1024;stroke-width:3.5px;paint-order:stroke;text-anchor:middle}
.gsvg .mp{font:800 12px Barlow,system-ui,sans-serif;fill:#fff6dc;text-anchor:middle}.gsvg .mp.dark{fill:#1b2140}
.gsvg .son{fill:#f0c060;stroke:#0b1024;stroke-width:1.5}.gsvg .soff{fill:#ffffff38;stroke:#0b1024;stroke-width:1.5}
.gsvg .lm{cursor:pointer;-webkit-tap-highlight-color:transparent}.gsvg .lm:active>circle:nth-of-type(2){filter:brightness(1.15)}
.gsvg .arena.ready .aglow{animation:aglow 3.5s ease-in-out infinite}
@keyframes aglow{50%{opacity:.55}}
.gsvg .cloud{fill:#fff;opacity:.28}.gsvg .c1{animation:drift 60s linear infinite alternate}.gsvg .c2{animation:drift 75s linear infinite alternate-reverse}
@keyframes drift{to{transform:translateX(60px)}}

/* ---------- Shop ---------- */
.kick.sh{display:block;margin:16px 2px 8px}
.srow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px;margin-bottom:8px;border-radius:14px;border:1px solid #2c386a;background:linear-gradient(180deg,#1b2446,#141b38)}
.srow .pak{width:46px;height:62px;filter:drop-shadow(0 3px 6px #0008)}
.sinfo{display:grid;gap:2px;min-width:0}.sinfo b{font:900 18px/1.1 var(--f-d);text-transform:uppercase;letter-spacing:.02em}
.sinfo small{font:600 13px/1.3 var(--f-b);color:var(--mut)}.sinfo .lk{color:var(--dnd);font-weight:700}.sinfo .was{color:var(--mut);text-decoration:line-through;font-size:12px}
.sbtn{display:grid;gap:6px;justify-items:stretch}
.pb{display:grid;justify-items:center;gap:0;min-width:74px;padding:6px 10px}.pb b{font:900 16px/1 var(--f-d)}.pb span{display:flex;align-items:center;gap:4px;font:800 14px var(--f-b)}
.coin.ci{display:inline-block;width:13px;height:13px}
.srow.locked{opacity:.62}.srow.locked .pak{filter:grayscale(.6) drop-shadow(0 3px 6px #0008)}

/* lineup: the rating each spot needs, and the team's needs */
.posbar div{flex-wrap:wrap;row-gap:1px}.posbar em{flex-basis:100%;font:700 11px var(--f-b);font-style:normal;color:var(--mut);letter-spacing:.04em}
.needs{margin:8px 0 10px;padding:10px 12px;border-radius:12px;background:#0a0f22;border:1px solid #2a3460}
.needs .kick{display:block;margin-bottom:4px}
.nd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:6px 0;border-bottom:1px solid #ffffff0d}.nd:last-child{border-bottom:0}
.nd b{font:800 15px var(--f-b)}.nd .g{font:900 15px var(--f-d);text-transform:uppercase;letter-spacing:.04em;color:var(--ivory)}.nd .g.up{color:var(--upd)}.nd .g.dn{color:var(--dnd)}
.nd small{grid-column:1/-1;font:600 12.5px/1.3 var(--f-b);color:var(--mut)}

/* ---------- Collection Book ---------- */
.bkgoat{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px;align-items:center;margin-top:10px}
.bkgoat h3{margin:2px 0 2px;font-size:24px}.bkgoat p{margin:0 0 6px;color:var(--mut);font-size:14px}
.bkt{display:grid;gap:4px}
.bkbar{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;gap:8px;align-items:center;font:700 12px var(--f-b);color:var(--mut)}.bkbar i{height:8px;border-radius:4px;background:#ffffff14;overflow:hidden}.bkbar b{display:block;height:100%;background:linear-gradient(90deg,#c99a45,#f6dca0)}.bkbar em{font-style:normal;text-align:right;color:var(--ivory)}
.bkr{position:relative}.bkr.lock .mc{filter:grayscale(.85) brightness(.55)}.bkr .lk{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;pointer-events:none}
.bkconfs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bkc{display:grid;justify-items:center;text-align:center;gap:3px;margin-top:10px}.bkc b{font:900 18px/1.1 var(--f-d);text-transform:uppercase}.bkc small{font:600 12px/1.25 var(--f-b);color:var(--mut)}.bkc .pr{color:var(--ivory);font-weight:800}
.panel.ready{border-color:var(--gold);box-shadow:0 0 18px -4px #f0c06099}

const IMGBAD=new Set();/* photos that failed once: never tried again this session, so no broken flash */

const mkey=n=>n.nodeType===1?(n.getAttribute("data-key")||n.id||null):null;
function msame(a,b){if(a.nodeType!==b.nodeType)return false;if(a.nodeType!==1)return true;return a.tagName===b.tagName&&mkey(a)===mkey(b)}
function patchKids(a,b){let x=a.firstChild,y=b.firstChild;
  while(y){const ny=y.nextSibling;
    if(!x){a.appendChild(y);y=ny;continue}
    const xn=x.nextSibling;
    /* data-fresh: always a new element (something that should play again, like an entrance) */
    if(msame(x,y)){if(y.nodeType===1&&y.hasAttribute("data-fresh"))a.replaceChild(y,x);else patchNode(x,y);x=xn;y=ny;continue}
    /* one node gone, or one new: line the rest back up instead of rebuilding everything after it */
    if(xn&&msame(xn,y)&&!(ny&&msame(x,ny))){a.removeChild(x);x=xn;continue}
    if(ny&&msame(x,ny)){a.insertBefore(y,x);y=ny;continue}
    const k=mkey(y);if(k){let m=xn;while(m&&mkey(m)!==k)m=m.nextSibling;if(m){a.insertBefore(m,x);patchNode(m,y);y=ny;continue}}
    a.replaceChild(y,x);x=xn;y=ny}
  while(x){const nx=x.nextSibling;a.removeChild(x);x=nx}}
function patchNode(x,y){if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;return}
  const tag=x.tagName,focus=x===document.activeElement;
  for(const at of[...x.attributes]){const n=at.name;if(y.hasAttribute(n))continue;if(tag==="DETAILS"&&n==="open")continue;x.removeAttribute(n)}
  for(const at of y.attributes){const n=at.name,v=at.value;if(tag==="DETAILS"&&n==="open")continue;if(focus&&n==="value")continue;if(x.getAttribute(n)!==v)x.setAttribute(n,v)}
  if(tag==="INPUT"){if(x.type==="checkbox"||x.type==="radio")x.checked=y.hasAttribute("checked");else if(!focus){const v=y.getAttribute("value")||"";if(x.value!==v)x.value=v}return}
  if(tag==="TEXTAREA"){if(!focus&&x.value!==y.value)x.value=y.value;return}
  const sel=tag==="SELECT"?y.querySelector("option[selected]"):null,sv=sel?sel.value:null;
  patchKids(x,y);
  if(tag==="SELECT"&&!focus&&sv!=null&&x.value!==sv)x.value=sv}

function faqHTML(){const q=(t,b,open)=>`<details class="panel faq"${open?" open":""}><summary>${t}</summary>${b}</details>`;

   q("Collection book",`<p>My Cards → Book has a page for every team. Each page has 8 slots: three 1★, three 2★ and two 3★ cards from that team (a better card fits a lower slot).</p><p>Locking a card in takes it out of your collection for good, with its level and jersey rank.</p><ul><li>Fill a page: that team's Hall of Famer.</li><li>All 15 Western pages: Kobe Bryant.</li><li>All 15 Eastern pages: Bill Russell.</li><li>Both conferences: Michael Jordan, the GOAT.</li></ul><p>Each page sells packs of that team's cards.</p>`)+

   q("Leveling and evolving",`<p>New cards play at 85% of their real season. They reach 100% at max level. Players earn XP from minutes played, Practice, and spare cards you feed them.</p><p>At max level, evolve a card by using spare cards. Each new star adds +2 to every rating.</p><p>Duplicates add jersey ranks, J1 to J5.</p>`)+

   q("Gear",`<p>Each player wears six pieces. A piece has a star grade (1★ to 6★), a rarity, a main stat and up to four substats. Rarity is how many substats it starts with: Common none, Uncommon 1, Rare 2, Epic 3, Legendary 4. Stars set how big the main stat gets and how big each substat roll is.</p><p>Power up a piece with coins, up to +15. The main stat grows every level. At +3, +6, +9 and +12 a new substat appears, or once it has four, one of them grows. Higher levels miss more often; a miss costs the coins, never the level.</p><p>Every slot can roll several main stats, so the right main stat for your player is a real find. The chase is a 6★ Legendary with the right main stat and the right substats.</p><p><b>Stat sets</b> (two pieces) add +4 to one rating. Good, never meta. <b>Meta sets</b> (four pieces) change how one role plays, and only drop in gyms: Floor General, Splash, Lockdown, Rim Protector, Engine and Closer.</p>`)+
   q("Gyms",`<p>Each gym is ten floors. Floor 10 is its five Legends. Each gym keeps its own team: build it on the gym page. Floors 1 to 5 are 3 on 3 and use the three best of that five.</p><p>Every run costs energy: 3 on floors 1 to 5, 5 on floors 6 to 9, 8 on floor 10. Energy refills one point every 3 minutes, up to ${EN_MAX}, and every league game adds 2.</p><p>Only wins drop gear. Each gym drops its own meta set (30% of drops) and two stat sets. Floors 1 to 5 drop 1★ to 3★, floors 6 to 9 drop 2★ to 5★, and floor 10 drops 4★ to 6★.</p><p>Clear a floor to grind it: ten runs in a row, each taking real time (20 seconds a run on floors 1 to 5, 30 on 6 to 9, 45 on floor 10). Drops land in a log as they happen, and the haul opens at the end. It keeps going while the app is closed.</p>`)+

   <div class="pkg ${n>5?"n10":""}">${it.map((x,k)=>`<div class="pf" data-k="${k}"><div class="fc"><div class="back h${x.tier}${x.big?" glow":""}"><span>${x.gear?"◆":"★"}</span></div><div class="front">${x.front}</div></div>${x.tag}</div>`).join("")}</div>
   <div class="pkf" style="visibility:hidden"><div class="pkfr">${again.map(a=>`<button class="btn dk pb" data-again="${esc(a.arg)}" ${S.coins<a.price?"disabled":""}><b>${esc(a.label)}</b><span>${coinI}${a.price.toLocaleString()}</span></button>`).join("")}<button class="btn go" id="pkDone">Done</button></div>
    <label class="pkal"><input type="checkbox" id="pkAlways" ${S.skipFlips?"checked":""}> Always skip the flips</label></div>
   <div class="spot" hidden></div>`;
  raise(ov);document.body.appendChild(ov);
  const $p=s=>ov.querySelector(s),slot=k=>ov.querySelector(`.pf[data-k="${k}"]`);
  let alive=true,skipAll=false,spotDone=null;
  const wait=ms=>new Promise(r=>{const t=setTimeout(r,ms);ov._t=t});
  const flipSlot=k=>slot(k).classList.add("open");
  async function run(){
    if(skipAll){finish();return}
    await wait(350);
    const small=it.map((_,k)=>k).filter(k=>!it[k].big);
    for(const k of small){if(!alive)return;flipSlot(k);if(!skipAll)await wait(n>5?110:220)}
    if(small.length&&order.length&&!skipAll)await wait(450);
    for(const k of order){if(!alive)return;if(skipAll){flipSlot(k);continue}await spotlight(k);flipSlot(k);await wait(200)}
    finish()}
  function finish(){if(!alive)return;it.forEach((_,k)=>flipSlot(k));$p("#pkSkip").style.visibility="hidden";$p(".pkf").style.visibility="visible";const d=$p("#pkDone");try{d.focus({preventScroll:true})}catch(e){}}
  function reel(label,items,finalHTML,ms){const strip=[...items,finalHTML];
    return`<div class="reel"><small>${label}</small><div class="win"><div class="strip" style="--n:${strip.length-1};--ms:${ms}ms">${strip.map(x=>`<div>${x}</div>`).join("")}</div></div></div>`}
  function spotlight(k){return new Promise(resolve=>{
    const x=it[k];const top=x.tier;const rnd=a=>a[Math.floor(Math.random()*a.length)];
    let reels=[],gold=false,rumble=false,label5="",land="";
    if(x.card){const c=x.card,p=DB.p[c.p];const legend=c.k==="L",mvp=c.k==="M";gold=top>=5||legend||mvp;rumble=top>=4||legend||mvp;
      label5=legend?"Legend":mvp?"MVP":c.k==="D"?"DPOY":c.k==="P"?"Prime":"";
      const nClue=gold?3:top===4?2:1;const teams=DB.t.map((_,i)=>i).filter(i=>i!==c.t);const yrs=[];for(let y=1980;y<=2026;y++)if(y!==c.y)yrs.push(y);
      reels.push(reel("Position",[...Array(9)].map(()=>rnd(POSL.filter(q=>q!==p[1].split("/")[0]))),esc(p[1]),1300));
      if(nClue>=2)reels.push(reel("Team",[...Array(9)].map(()=>logoHTML(rnd(teams),34)),logoHTML(c.t,34),1500));
      if(nClue>=3)reels.push(reel("Season",[...Array(9)].map(()=>`'${String(rnd(yrs)+1).slice(2)}`),c.k==="K"?"'27":`'${String(c.y+1).slice(2)}`,1700));
      land=`${bigCardHTML(x.r.id)}<div class="ltag">${x.tag}</div>`}
    else{const g=x.gear;gold=g.rar>=4;rumble=g.rar>=4;
      const sets=Object.keys(SETS).filter(s=>s!==g.set);
      reels.push(reel("Slot",[...Array(9)].map(()=>rnd(SLOTS.filter(s=>s!==SLOTS[g.slot]))),SLOTS[g.slot],1300));
      if(g.rar>=4)reels.push(reel("Set",[...Array(9)].map(()=>rnd(sets)),esc(g.set),1600));

    const sp=$p(".spot");sp.hidden=false;
    sp.innerHTML=`<div class="rays t1"></div><div class="stage">

      <div class="bigback t1"><div class="shine"></div><span>${x.gear?"◆":"★"}</span></div>
      <div class="reels">${reels.join("")}</div>
      <div class="bloom"></div><div class="burst"></div>
      <p class="tap">Tap to skip</p></div>`;
    const back=sp.querySelector(".bigback"),rays=sp.querySelector(".rays"),lab=sp.querySelector(".tierlab");
    let done=false,stage="build";
    const setTier=t=>{back.className="bigback t"+t+(back.classList.contains("rumble")?" rumble":"");rays.className="rays t"+t;
      lab.innerHTML=x.gear?`<span class="st gr" style="color:${TIERC[t-1]}">${RAR[t-1]}</span>`:`<span class="st">${"★".repeat(t)}</span>${t===5&&label5?`<b>${label5}</b>`:""}`;

    function reveal(){if(done)return;done=true;T.forEach(clearTimeout);stage="shown";
      setTier(top);sp.querySelectorAll(".strip").forEach(s=>s.classList.add("go","now"));
      /* no white flash: a soft glow in the tier color behind the item, fading in and out slowly */
      const bl=sp.querySelector(".bloom");bl.style.setProperty("--bc",TIERC[top-1]);bl.classList.remove("on");void bl.offsetWidth;bl.classList.add("on");
      back.classList.remove("rumble");

      bst.innerHTML=[...Array(nb)].map((_,i)=>{const a=i/nb*Math.PI*2+Math.random()*.3,d=120+Math.random()*(top>=4?160:90);return`<i style="--x:${Math.cos(a)*d}px;--y:${Math.sin(a)*d}px;--c:${col[i%col.length]};--r:${Math.random()*360}deg"></i>`}).join("");

    spotDone=()=>{done=true;T.forEach(clearTimeout);sp.hidden=true;sp.innerHTML="";resolve()};
    let t=250;
    for(let s=2;s<=top;s++){const ss=s;at(t,()=>setTier(ss));t+=ss>=4?700:420}
    sp.querySelectorAll(".strip").forEach(s=>{at(t,()=>s.classList.add("go"));t+=+s.style.getPropertyValue("--ms").replace("ms","")*.75});

    at(t,reveal)})}
  $p("#pkSkip").onclick=()=>{skipAll=true;clearTimeout(ov._t);if(spotDone)spotDone();it.forEach((_,k)=>flipSlot(k));finish()};
  /* back to whatever was open underneath, redrawn with the new cards (a book page shows them at once) */
  const refresh=()=>{render();if(SHEET&&SHEET.reopen&&!SHEET.el.classList.contains("under"))SHEET.reopen()};

  ov.querySelectorAll("[data-again]").forEach(b=>b.onclick=()=>{alive=false;ov.remove();ACT.buy(b.dataset.again)});
  $p("#pkAlways").onchange=e=>{S.skipFlips=e.target.checked;save()};
  ov.querySelector(".pkg").addEventListener("click",e=>{const f=e.target.closest(".pf");if(!f)return;if(!f.classList.contains("open")){e.stopPropagation();return}
    const gt=f.querySelector("[data-gid]");if(gt){e.stopPropagation();openGear(gt.dataset.gid);return}
    const b=f.querySelector("[data-act]");if(b){e.stopPropagation();cardCtx(b);openCard(b.dataset.arg)}},true);

  run()}

/* game.js: playing games, recaps, reports, seasons, gyms, actions */
/* ---------- run a game of any kind ---------- */
function runGame(kind,mode,ctx){ctx=ctx||{};let A,B,fmt="full";const s=S.season;
  if(kind==="reg"){const opp=s.sched[s.g];A=myTeam(null,{home:s.home[s.g]});B=oppTeam(opp,leagueLevel(tgt(s.n,s.g)));B.home=!s.home[s.g]}
  else if(kind==="po"){A=myTeam(null,{home:s.po.w+s.po.l<2});B=oppTeam(s.po.opp,leagueLevel(tgt(s.n,48))+2+s.po.round)}
  else if(kind==="boss"){const k=(s.n-1)%BOSSES.length;const b=BOSSES[k];if(bossOver()||S.bossesBeaten.includes(s.n)){toast("The boss series is over. A new boss comes next season.");return}
    A=myTeam();B=bossTeam(b,bossOvr(s.n))}
  else if(kind==="gym"){const gym=GYMS.find(g=>g.id===ctx.gym);const tier=gymTier(ctx.floor);fmt=tier===1?"3v3":tier===2?"half":"full";A=myTeam(ctx.ids,{spots:tier>1});B=gymTeam(gym,ctx.floor)}
  else if(kind==="prac"){fmt="q";A=myTeam(ctx.ids);B=scaledTeam(teamRosterIds((S.fr+5)%30,77),A.ovr,{name:"Scout team",abbr:"SCT",color:"#5a6a8a"})}
  B.pl.forEach(p=>p.team=1);A.pl.forEach(p=>p.team=0);
  const label=kind==="reg"?`Game ${s.g+1} of 48`:kind==="po"?`${["First round","Semifinals","Finals"][s.po.round]} · game ${s.po.w+s.po.l+1}`:kind==="boss"?`Boss series · game ${bossSeries().w+bossSeries().l+1}`:kind==="gym"?`${GYMS.find(g=>g.id===ctx.gym).n} · Floor ${ctx.floor}`:"Practice";
  /* Play: you call one side, the engine the other */
  if(mode==="play"){const side=ctx.side!=null?+ctx.side:(S.playSide||0);playGame({A,B,fmt,kind,ctx},side,res=>{if(!res){render();return}res.A=A;res.B=B;res.kind=kind;res.ctx=ctx;res.label=label;finishGame(res)});return}
  const res=simGame(A,B,{fmt});res.A=A;res.B=B;res.kind=kind;res.ctx=ctx;res.label=label;
  if(mode==="quiet")return{res,out:finishGame(res,true)};
  if(mode==="watch")watchGame(res,()=>finishGame(res));else finishGame(res)}
function finishGame(res,quiet){const kind=res.kind,s=S.season,won=res.score[0]>res.score[1];const out=applyGame(res,kind==="gym"?"gym":kind,res.ctx);out.drops=[];out.notes=[];
  if(kind==="reg"||kind==="po"||kind==="boss")addEnergy(2);
  if(kind==="reg"){s.stand[S.fr][won?0:1]++;s.stand[s.sched[s.g]][won?1:0]++;leagueRound(s.sched[s.g]);s.games.push({o:s.sched[s.g],s:res.score});s.g++;if(s.g>=48)startPlayoffs(out)}
  else if(kind==="po")playoffGame(res,won,out);
  else if(kind==="boss"){const bs=bossSeries();if(won)bs.w++;else bs.l++;
    if(bs.w>=4){S.bossesBeaten.push(s.n);S.legendPick=s.n;out.bossWin=true;out.notes.push(`You beat the boss ${bs.w}-${bs.l}.`)}
    else if(bs.l>=4)out.notes.push(`Lost the series ${bs.w}-${bs.l}. A new boss comes next season.`);
    else out.notes.push(`Boss series ${bs.w}-${bs.l}. First to 4 wins.`)}
  else if(kind==="gym"&&won){const gym=GYMS.find(g=>g.id===res.ctx.gym);out.drops=gymDrops(gym,res.ctx.floor);const key=gym.id+res.ctx.floor;if(!S.firstClears[key]){S.firstClears[key]=1;S.coins+=60+res.ctx.floor*20;out.coins+=60+res.ctx.floor*20;out.notes.push("First clear bonus")}S.gyms[gym.id]=Math.max(S.gyms[gym.id]||0,res.ctx.floor)}
  save();if(quiet)return out;report(res,out)}
/* ---------- sim several games in a row, then one summary ---------- */
let SIMLOG=null;
function simMany(kind,n){const s=S.season;const log=[];const round0=s.po?s.po.round:null,n0=s.n;
  for(let k=0;k<n;k++){
    if(kind==="reg"&&s.phase!=="reg")break;
    if(kind==="po"&&(s.phase!=="po"||s.po.out||s.po.round!==round0))break;
    if(kind==="boss"&&(s.phase!=="done"||bossOver()||S.bossesBeaten.includes(s.n)))break;
    if(kind==="reg"&&lineupIssues().includes("Same player twice")){toast("The same player can't start twice");break}
    const r=runGame(kind,"quiet");if(!r)break;log.push(r)}
  if(!log.length)return;SIMLOG={kind,log,n0};simSummary()}
function simSummary(){const{kind,log}=SIMLOG;const w=log.filter(x=>x.out.won).length,l=log.length-w;const coins=log.reduce((a,x)=>a+x.out.coins,0);
  const ups={};for(const x of log)for(const i in x.out.ups)ups[i]=1;const notes=log.flatMap(x=>[...x.out.milestones.map(m=>`${DB.p[DB.c[m.i].p][0]}: ${m.label}`),...x.out.notes]);
  const title=log.map(x=>x.out.titleCard).find(x=>x!=null);const coin='<span class="coin"></span>';
  const lab=kind==="reg"?`Sim · ${log.length} game${log.length>1?"s":""}`:kind==="po"?"Sim · playoff series":"Sim · boss series";
  const rec=S.season.stand[S.fr];
  const sub=kind==="reg"?`${rec[0]}-${rec[1]} on the season · #${standings().indexOf(S.fr)+1} in the league`:`${w}-${l} in these games`;
  const h=`<span class="kick">${lab}</span><h2 class="rs ${w>=l?"w":"l"}">${w}-${l}</h2><p class="hl">${sub}</p>
   <div class="rw"><div class="rwc">${coin}<b>+${coins}</b><span>coins</span></div>
   ${title!=null?`<div class="rwcard"><span class="kick">Title reward</span><div style="width:110px;margin:6px auto 0">${mcHTML(title,{act:"peek"})}</div></div>`:""}
   ${Object.keys(ups).length?`<div class="rwl"><span class="kick">Level up</span><div class="chips">${Object.keys(ups).map(i=>`<span class="chip gold">${esc(lastName(DB.p[DB.c[i].p][0]))} Lv ${S.own[i]?S.own[i].lv:""}</span>`).join("")}</div></div>`:""}
   ${notes.map(n=>`<p class="ms">${esc(n)}</p>`).join("")}</div>
   <div class="smr">${log.map((x,k)=>{const r=x.res,won=x.out.won;return`<button data-act="simrow" data-arg="${k}"><b class="${won?"w":"l"}">${won?"W":"L"}</b><span>${esc(r.B.name)}</span><em>${r.score[0]}-${r.score[1]}</em><i>›</i></button>`}).join("")}</div>`;
  /* keep going from here: more games, the rest of the season, or the next series */
  const s=S.season,left=48-s.g;let more="";
  if(s.phase==="reg")more=`<div class="row smore"><button class="btn sp dk" data-act="simn" data-arg="reg:5">Sim 5 more</button>${left>5?`<button class="btn sp dk" data-act="simn" data-arg="reg:${left}">Sim the rest</button>`:""}</div>`;
  else if(s.phase==="po"&&!s.po.out)more=`<div class="row smore"><button class="btn sp dk" data-act="simn" data-arg="po:7">Sim the next series</button></div>`;
  sheet(h,()=>{if(log.some(x=>x.out.bossWin))bossPick()},`${more}<button class="btn go" style="width:100%" data-act="close">Continue</button>`,"simsum",()=>simSummary())}
function startPlayoffs(out){const s=S.season;const st=standings();const top=st.slice(0,8);
  if(!top.includes(S.fr)){s.phase="done";S.banners.push({n:s.n,w:s.stand[S.fr][0],l:s.stand[S.fr][1],po:false,champ:false});seasonAwards(false);out.notes.push("Missed the playoffs. Season boss unlocked.");return}
  S.coins+=300;out.coins+=300;out.notes.push("Made the playoffs: +300 coins");
  const order=[0,7,3,4,1,6,2,5].map(k=>top[k]);s.po={br:order,round:0,w:0,l:0,out:false,champ:false,fin:{},hist:[],seed:top.indexOf(S.fr)+1};s.po.opp=poOpp();s.phase="po"}
function poOpp(){const po=S.season.po;const k=po.br.indexOf(S.fr);return po.br[k^1]}
function playoffGame(res,won,out){const s=S.season,po=s.po;if(won)po.w++;else po.l++;
  if(po.round===2)for(const k in res.box){const b=res.box[k];if(b.team===0)po.fin[b.id]=(po.fin[b.id]||0)+b.pts}
  const need=po.round===0?2:3;
  if(po.w>=need||po.l>=need){(po.hist=po.hist||[]).push({r:po.round,opp:po.opp,w:po.w,l:po.l});if(po.w>=need){S.coins+=200;out.coins+=200;out.notes.push(`Series won: +200 coins`);
      /* the rest of the bracket */const nb=[];for(let k=0;k<po.br.length;k+=2){const a=po.br[k],b=po.br[k+1];if(a===S.fr||b===S.fr)nb.push(S.fr);else{const p=1/(1+Math.exp(-(s.str[a]-s.str[b])/2));nb.push(rnd()<p?a:b)}}
      po.br=nb;if(nb.length===1){po.champ=true;po.out=true;S.coins+=500;out.coins+=500;out.notes.push("Champions: +500 coins and a 4★ or better card");
        const pool=[...POOL.byStar[4],...POOL.byStar[5].filter(()=>rnd()<.25)];const id=pick(pool);addCard(id);out.titleCard=id;
        const fm=Object.entries(po.fin).sort((a,b)=>b[1]-a[1])[0];if(fm&&S.own[fm[0]]){S.own[fm[0]].stats.aw.push(`Finals MVP S${s.n}`)}
        S.titles=S.titles||[];S.titles.push({n:s.n,rec:[...s.stand[S.fr]],seed:po.seed||null,series:po.hist.map(x=>({...x})),fmvp:fm?+fm[0]:null,fpts:fm?fm[1]:0,roster:[...S.roster],reward:id,ovr:myTeam().ovr,t:Date.now()});
        for(const i of S.roster)if(S.own[i])S.own[i].stats.aw.push("Champion");}
      else{po.round++;po.w=0;po.l=0;po.opp=poOpp()}}
    else{po.out=true}}
  if(po.out){s.phase="done";S.banners.push({n:s.n,w:s.stand[S.fr][0],l:s.stand[S.fr][1],po:true,champ:po.champ,series:(po.hist||[]).map(x=>({...x}))});seasonAwards(po.champ)}}
function seasonAwards(champ){const s=S.season;const key=String(s.n);let best=null,bv=-1;
  for(const i of S.roster){const o=S.own[i];const st=o&&o.stats.s[key];if(!st||st.gp<24)continue;const v=(st.pts+st.reb+st.ast)/st.gp;if(v>bv){bv=v;best=i}
    if(st.pts/st.gp>=22||v>=35){o.stats.aw.push(`All-League S${s.n}`);S.coins+=100;giveXP(i,150)}}
  if(best!=null){const w=s.stand[S.fr][0];S.own[best].stats.aw.push(w>=34?`MVP S${s.n}`:`Team MVP S${s.n}`);S.coins+=w>=34?200:80;giveXP(best,w>=34?300:120)}}

let PLAYCB=null;
function choosePlay(cb){PLAYCB=cb;const last=S.playSide||0;
  sheet(`<span class="kick">Play</span><h2>Which side do you run?</h2><p class="mut" style="margin-top:0">You call every possession on that side, all game. The engine runs the other side. Played games pay more than sims.</p>

/* ---------- recap ---------- */
function gs(b){return b.pts+.4*b.fgm-.7*b.fga-.4*(b.fta-b.ftm)+.7*b.reb+.7*b.ast+b.stl+.7*b.blk-b.tov}
function headline(res){const A=res.A,B=res.B,won=res.score[0]>res.score[1];const m=Math.abs(res.score[0]-res.score[1]);const the=n=>/^the /i.test(n)?n:"the "+n;
  const top=s=>Object.values(res.box).filter(b=>b.team===s).sort((a,b)=>gs(b)-gs(a))[0];const me=top(0),them=top(1);
  const verb=won?(m>=18?"blow out":m<=3?"edge":"beat"):(m>=18?"get blown out by":m<=3?"fall just short of":"lose to");
  const who=won?me:them;const line=who?`${lastName(who.name)} ${who.pts} pts${who.reb>=10?`, ${who.reb} reb`:who.ast>=8?`, ${who.ast} ast`:""}. `:"";
  return`${line}The ${A.name} ${verb} ${the(B.name)}.`}
function whyLine(res,won){const st=res.stat;const reb=[st[0].oreb+st[0].dreb,st[1].oreb+st[1].dreb];
  const g=[{d:reb[0]-reb[1],bad:`They won the boards ${reb[1]}-${reb[0]}. A rebounder or Glass gear would help.`,good:`You won the boards ${reb[0]}-${reb[1]}.`},
    {d:(st[0].tpm-st[1].tpm)*1.5,bad:`They hit ${st[1].tpm} threes to your ${st[0].tpm}. Put a stopper on their shooters.`,good:`You hit ${st[0].tpm} threes to their ${st[1].tpm}.`},
    {d:(st[1].tov-st[0].tov)*1.3,bad:`You turned it over ${st[0].tov} times. You need a better ball handler.`,good:`You forced ${st[1].tov} turnovers.`},

  const nm=i=>`<button class="lnk2" data-act="card" data-arg="${i}">${esc(lastName(DB.p[DB.c[i].p][0]))}</button>`;

/* an original championship cup: two handles, a star, a stepped base with the season plate */

   <path d="M22 16 H78 C78 50 66 68 50 72 C34 68 22 50 22 16 Z" fill="url(#${id})"/><ellipse cx="50" cy="16" rx="28" ry="5" fill="#fbe7b5"/><ellipse cx="50" cy="16" rx="23" ry="3" fill="#a87a28"/>
   <path d="M50 30 l3.5 7.2 7.9 1.1-5.7 5.6 1.4 7.8-7.1-3.7-7.1 3.7 1.4-7.8-5.7-5.6 7.9-1.1z" fill="#fff4d6" opacity=".85"/>
   <path d="M45 71 Q50 76 55 71 L54 90 H46 Z" fill="url(#${id})"/><ellipse cx="50" cy="81" rx="7" ry="3" fill="#f6dca0"/>
   <path d="M33 90 H67 L71 100 H29 Z" fill="url(#${id})"/><rect x="24" y="100" width="52" height="30" rx="3" fill="url(#${id}b)"/><rect x="24" y="100" width="52" height="2.5" fill="#d9ad55"/>
   <rect x="34" y="108" width="32" height="14" rx="2" fill="url(#${id})"/><text x="50" y="119" text-anchor="middle" font-family="'Big Shoulders Display',Impact,sans-serif" font-weight="900" font-size="11" fill="#3a2608">${esc(label)}</text></svg>`}
function trophyCase(){const T=S.titles||[];const legacy=S.banners.filter(b=>b.champ&&!T.some(t=>t.n===b.n));
  const items=[...T.map((t,k)=>({n:t.n,k})),...legacy.map(b=>({n:b.n,k:null}))].sort((a,b)=>a.n-b.n);
  const shelf=items.length?items.map(x=>`<button class="tcup" data-act="title" data-arg="${x.k!=null?"t"+x.k:"b"+x.n}" aria-label="Season ${x.n} title">${trophySVG("S"+x.n)}<small>Season ${x.n}</small></button>`).join("")
    :`<div class="tcup none">${trophySVG("?",true)}<small>Your first title goes here</small></div>`;
  return`<div class="panel tcase"><div class="row"><span class="kick">Trophy case</span><span class="sp"></span><span class="mut tcn">${items.length} title${items.length===1?"":"s"}</span></div><div class="shelf">${shelf}</div></div>`}
/* leaders by player: his best card shows; numbers are for your team only */
function ledRows(){const L=S.led||{};const rows=[];const cur=String(S.season.n);
  for(const id in L){const c=DB.c[id];if(!c)continue;for(const key in L[id].s){if(!/^\d+$/.test(key))continue;rows.push({i:+id,p:c.p,key,...L[id].s[key]})}}
  if(HVIEW==="all"){const by={};for(const r of rows){const x=by[r.p]||(by[r.p]={i:r.i,p:r.p,gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,tpm:0,best:0});for(const f of["gp","pts","reb","ast","stl","blk","tpm"])x[f]+=r[f]||0;if(r.gp>x.best){x.best=r.gp;x.i=r.i}}return Object.values(by)}
  if(HVIEW==="cur")return rows.filter(r=>r.key===cur);
  return rows.filter(r=>r.gp>=12)}
function leadersBoard(){const rows=ledRows();const all=HVIEW==="all";
  const tiles=HCAT.map(([f,n,ab])=>{const val=r=>all?(r[f]||0):(r[f]||0)/r.gp;const top=[...rows].sort((a,b)=>val(b)-val(a))[0];
    if(!top||!val(top))return`<div class="ldr empty"><span class="kick">${n}</span><div class="ldc"></div><b>–</b><small>No games yet</small></div>`;
    const per=((top[f]||0)/top.gp).toFixed(1);
    return`<div class="ldr" role="button" tabindex="0" data-act="ldrMore" data-arg="${f}"><span class="kick">${n}</span><div class="ldc">${mcHTML(top.i,{act:"ldrMore",arg:f,noNew:true})}</div><b>${all?(top[f]||0).toLocaleString():per}</b><small>${all?`${per} a game · ${top.gp} games`:`${ab} a game · ${HVIEW==="cur"?`${top.gp} games`:`Season ${top.key}`}`}</small></div>`}).join("");
  return`<div class="panel lg"><div class="row"><span class="kick">Franchise leaders</span></div>
   <div class="seg sm hseg">${[["all","All-time"],["best","Best season"],["cur","This season"]].map(([k,n])=>`<button class="${HVIEW===k?"on":""}" data-act="hview" data-arg="${k}">${n}</button>`).join("")}</div>
   <div class="ldg">${tiles}</div><p class="mut" style="font-size:12px;margin:8px 0 0">Regular season games for your team. Tap a leader for the top 10.${HVIEW==="best"?" Best season needs 12 games.":""}</p></div>`}
function ldrMore(f){const rows=ledRows();const all=HVIEW==="all";const cat=HCAT.find(x=>x[0]===f);const val=r=>all?(r[f]||0):(r[f]||0)/r.gp;
  const top=[...rows].filter(r=>val(r)>0).sort((a,b)=>val(b)-val(a)).slice(0,10);
  sheet(`<span class="kick">${HVIEW==="all"?"All-time":HVIEW==="cur"?`Season ${S.season.n}`:"Best single season"}</span><h2>${cat[1]} leaders</h2>
   <div class="ldl">${top.map((r,k)=>`<button data-act="peek" data-arg="${r.i}"><i>${k+1}</i>${faceHTML(r.i,40)}<span><b>${esc(DB.p[DB.c[r.i].p][0])}</b><small>${seasonLabel(DB.c[r.i].y)} card${HVIEW==="best"?` · Season ${r.key}`:""} · ${r.gp} games</small></span><em>${all?(r[f]||0).toLocaleString():((r[f]||0)/r.gp).toFixed(1)}</em></button>`).join("")}</div>`,null,null,"ldrmore",()=>ldrMore(f))}
function seriesLine(x){return`${["First round","Semifinals","Finals"][x.r]}: ${x.w>x.l?"beat":"lost to"} the ${esc(TEAMNICK(x.opp))} ${x.w}-${x.l}`}
function openTitle(a){const T=S.titles||[];const t=a[0]==="t"?T[+a.slice(1)]:null;const n=t?t.n:+a.slice(1);const b=S.banners.find(x=>x.n===n);
  const rec=t?t.rec:[b.w,b.l];
  let h=`<div class="ttop">${trophySVG("S"+n)}<div><span class="kick">Season ${n}</span><h2>Champions</h2><p class="mut" style="margin:0">${rec[0]}-${rec[1]} in the regular season${t&&t.seed?` · #${t.seed} seed`:""}${t&&t.ovr?` · team OVR ${t.ovr}`:""}</p></div></div>`;
  const ser=(t&&t.series)||(b&&b.series)||[];
  if(ser.length)h+=`<div class="panel"><span class="kick">The run</span>${ser.map(x=>`<p class="tser"><b>${["First round","Semifinals","Finals"][x.r]}</b><span>${logoHTML(x.opp,22)} ${esc(TEAMNICK(x.opp))}</span><em>${x.w}-${x.l}</em></p>`).join("")}</div>`;
  if(t&&t.fmvp!=null&&DB.c[t.fmvp])h+=`<div class="panel tfm"><div style="width:104px">${mcHTML(t.fmvp,{act:"peek",noNew:true})}</div><div class="tfmt"><span class="kick">Finals MVP</span><b>${esc(DB.p[DB.c[t.fmvp].p][0])}</b><small>${t.fpts} points in the Finals</small></div></div>`;

function historyHTML(){let h=trophyCase()+leadersBoard();
  h+=`<div class="panel lg"><span class="kick">Seasons</span>${S.banners.length?[...S.banners].reverse().map(b=>{const last=b.series&&b.series[b.series.length-1];
    return`<div class="hr2"><b>Season ${b.n}</b><span>${b.w}-${b.l}</span><i class="${b.champ?"gold":""}">${b.champ?"Champions":b.po?(last?`Out in the ${["first round","semifinals","Finals"][last.r]}`:"Playoffs"):"Missed playoffs"}</i>${last&&!b.champ?`<small>${seriesLine(last)}</small>`:""}${S.bossesBeaten.includes(b.n)?`<small class="up">Beat the season boss</small>`:""}</div>`}).join(""):'<p class="mut" style="margin:6px 0 0">Finish a season to start your history.</p>'}</div>`;
  const aw=[];for(const id in S.own)for(const a of S.own[id].stats.aw)if(a!=="Champion")aw.push([a,+id]);
  aw.sort((x,y)=>(parseInt(y[0].split("S").pop())||0)-(parseInt(x[0].split("S").pop())||0));
  h+=`<div class="panel lg"><span class="kick">Awards</span>${aw.length?`<div class="awl">${aw.map(([a,i])=>`<button data-act="card" data-arg="${i}">${faceHTML(i,36)}<span><b>${esc(a.replace(/ S\d+$/,""))}</b><small>${esc(DB.p[DB.c[i].p][0])} · Season ${a.split("S").pop()}</small></span></button>`).join("")}</div>`:'<p class="mut" style="margin:6px 0 0">No awards yet. They\'re handed out when a season ends.</p>'}</div>`;
  h+=`<div class="panel lg"><span class="kick">Season bosses</span>${BOSSES.map((b,k)=>{const beat=S.bossesBeaten.some(n=>(n-1)%BOSSES.length===k);return`<div class="hr"><b>${k+1}. ${esc(b.n)}</b><i class="${beat?"gold":""}">${beat?"Beaten":"Not yet"}</i></div>`}).join("")}</div>`;
  return h}

/* shop.js: the Shop. Everything is bought with coins you earn by playing.

function rollFill(t){let r=rnd(),a=0;for(const[s,p]of t){a+=p;if(r<a)return s}return t[0][0]}
function premiumPull(def){const hits=POOL.byStar[def.k==="P"||def.k==="D"?4:5].filter(i=>DB.c[i].k===def.k);
  const out=[];for(let k=0;k<3;k++){const id=rnd()<def.rate?pick(hits):cardFromStar(rollFill(def.fill),i=>DB.c[i].k!=="M"&&DB.c[i].k!=="L");out.push({id,...addCard(id)})}return out}

const ODDS_UP=[[5,.01],[4,.06],[3,.24],[2,.34],[1,.35]];
